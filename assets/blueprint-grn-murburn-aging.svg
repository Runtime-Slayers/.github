<rect x="490" y="169" width="420" height="35" rx="3" fill="#0a0800" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="187" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">MURBURN INTEGRATION: ROS kinetics aging model</text>
<text x="700" y="197" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Murburn concept: free radical reaction aging rates per gene</text>
<rect x="490" y="211" width="420" height="35" rx="3" fill="#001500" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="229" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">OUTPUT: Aging GRN rewiring map + longevity genes</text>
<text x="700" y="239" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">TP53, FOXO3, SIRT1 hub rewiring predicts 15+ biological age markers</text>
<rect x="475" y="263" width="460" height="130" fill="#080d18" rx="4" stroke="#F59E0B" stroke-width="1"/>
<text x="490" y="280" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">KEY FINDINGS</text>
<g class="m" font-size="8">
  <text x="490" y="297" fill="#94a3b8">Hub genes:</text><text x="620" y="297" fill="#F59E0B">TP53, FOXO3, SIRT1, mTOR, NF-kB</text>
  <text x="490" y="314" fill="#94a3b8">Aging signature:</text><text x="620" y="314" fill="#c084fc">547 differentially regulated edges</text>
  <text x="490" y="331" fill="#94a3b8">Longevity TFs:</text><text x="620" y="331" fill="#10B981">FOXO3, SIRT1 — conserved across tissues</text>
  <text x="490" y="348" fill="#94a3b8">Murburn ROS:</text><text x="620" y="348" fill="#FF3366">Mitochondrial complex I genes depleted</text>
  <text x="490" y="365" fill="#94a3b8">GRN tool:</text><text x="620" y="365" fill="#38bdf8">GENIE3 + ARACNE — top DREAM5 methods</text>
  <text x="490" y="382" fill="#94a3b8">Tissues:</text><text x="620" y="382" fill="#94a3b8">Brain, heart, skeletal muscle, liver</text>
</g>
