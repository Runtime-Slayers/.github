<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <style>.mono{font-family:"JetBrains Mono","Courier New",monospace}.sans{font-family:"Montserrat","Segoe UI",sans-serif}</style>
    <filter id="p6-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="p6-bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#100820"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
    <radialGradient id="p6-plasma" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF6B00" stop-opacity="0.9"/><stop offset="60%" stop-color="#c084fc" stop-opacity="0.5"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <pattern id="p6-grid-minor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="p6-grid-major" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#p6-grid-minor)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
  </defs>
  <rect width="960" height="420" fill="url(#p6-bg)"/>
  <rect width="960" height="420" fill="url(#p6-grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#c084fc" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" class="mono" fill="#c084fc" font-size="11" font-weight="bold">PROJ-06 // PLASMA-CPAN — TOKAMAK MHD INSTABILITY CONTROL</text>
  <text x="700" y="32" class="mono" fill="#94a3b8" font-size="9">DRW-AERO-0006 | REV.A | FUSION PLASMA</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>

  <!-- Tokamak cross-section (top view) -->
  <text x="220" y="66" class="mono" fill="#c084fc" font-size="9" text-anchor="middle">TOKAMAK PLASMA CROSS-SECTION</text>
  <!-- Outer wall -->
  <ellipse cx="220" cy="220" rx="185" ry="145" fill="#0a0518" stroke="#c084fc" stroke-width="2"/>
  <!-- Inner wall (donut hole) -->
  <ellipse cx="220" cy="220" rx="90" ry="60" fill="#100820" stroke="#c084fc" stroke-width="1.5"/>
  <!-- Plasma region -->
  <ellipse cx="220" cy="220" rx="145" ry="100" fill="url(#p6-plasma)" opacity="0.7">
    <animate attributeName="rx" values="145;150;145" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="100;105;100" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Magnetic field lines (toroidal) -->
  <ellipse cx="220" cy="220" rx="145" ry="100" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="6,4" opacity="0.6">
    <animate attributeName="stroke-dashoffset" values="0;-20;0" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="220" cy="220" rx="115" ry="75" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="5,5" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="0;20;0" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Instability kink markers -->
  <circle cx="100" cy="170" r="8" fill="#FF3366" filter="url(#p6-glow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="270" r="8" fill="#FF3366" filter="url(#p6-glow)"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="80" y="157" class="mono" fill="#FF3366" font-size="7.5">KINK</text>
  <text x="330" y="260" class="mono" fill="#FF3366" font-size="7.5">ELM</text>
  <!-- Center temp label -->
  <text x="220" y="215" class="mono" fill="#FF6B00" font-size="9" text-anchor="middle" font-weight="bold">PLASMA CORE</text>
  <text x="220" y="228" class="mono" fill="#F59E0B" font-size="8" text-anchor="middle">T &gt; 100 million K</text>
  <!-- Toroidal field coils -->
  <g stroke="#38bdf8" stroke-width="2" fill="none">
    <ellipse cx="75" cy="220" rx="15" ry="40"/>
    <ellipse cx="365" cy="220" rx="15" ry="40"/>
    <ellipse cx="220" cy="80" rx="50" ry="15"/>
    <ellipse cx="220" cy="355" rx="50" ry="15"/>
  </g>
  <text x="50" y="222" class="mono" fill="#38bdf8" font-size="6.5" text-anchor="middle">TF coil</text>
  <text x="390" y="222" class="mono" fill="#38bdf8" font-size="6.5">TF coil</text>

  <!-- Divider -->
  <line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

  <!-- RIGHT PANEL: AI Control Architecture -->
  <text x="480" y="68" class="sans" fill="#c084fc" font-size="12" font-weight="bold">AI PLASMA STABILIZATION PIPELINE</text>
  <line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>

  <!-- Sensor block -->
  <rect x="490" y="85" width="150" height="50" rx="5" fill="#0d0520" stroke="#c084fc" stroke-width="1.5"/>
  <text x="565" y="107" class="mono" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">DIAGNOSTICS</text>
  <text x="565" y="120" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Thomson / Langmuir probes</text>
  <text x="565" y="131" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Mirnov coil arrays</text>

  <!-- AI core -->
  <rect x="660" y="85" width="150" height="50" rx="5" fill="#0d2030" stroke="#00E5FF" stroke-width="2"/>
  <text x="735" y="107" class="mono" fill="#00E5FF" font-size="9" text-anchor="middle" font-weight="bold">AI CPAN MODEL</text>
  <text x="735" y="120" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">PINN + MHD equations</text>
  <text x="735" y="131" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Real-time mode detection</text>

  <!-- Arrow -->
  <line x1="640" y1="110" x2="660" y2="110" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="658,106 668,110 658,114" fill="#94a3b8"/>

  <!-- Actuators -->
  <rect x="490" y="165" width="150" height="50" rx="5" fill="#1a0800" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="565" y="187" class="mono" fill="#FF6B00" font-size="9" text-anchor="middle" font-weight="bold">ACTUATORS</text>
  <text x="565" y="200" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">NBI heating injection</text>
  <text x="565" y="211" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">ECRH microwave heating</text>

  <!-- Control output -->
  <rect x="660" y="165" width="150" height="50" rx="5" fill="#002a00" stroke="#10B981" stroke-width="1.5"/>
  <text x="735" y="187" class="mono" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">STABILITY OUTPUT</text>
  <text x="735" y="200" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Kink mode suppressed</text>
  <text x="735" y="211" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">ELM frequency reduced</text>

  <!-- Arrows between rows -->
  <line x1="565" y1="135" x2="565" y2="165" stroke="#FF6B00" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="735" y1="135" x2="735" y2="165" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="640" y1="190" x2="660" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="658,186 668,190 658,194" fill="#94a3b8"/>

  <!-- MHD Mode Chart -->
  <text x="490" y="240" class="mono" fill="#F59E0B" font-size="9" font-weight="bold">MHD INSTABILITY AMPLITUDE (WITH vs WITHOUT AI)</text>
  <line x1="490" y1="330" x2="930" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <line x1="490" y1="248" x2="490" y2="330" stroke="#94a3b8" stroke-width="1"/>
  <!-- Without AI (noisy) -->
  <polyline points="490,310 520,270 540,320 565,260 590,315 615,265 640,300 665,275 690,310 715,265 740,300 765,270 790,305 815,265 840,295 865,270 890,300 915,270 930,280" fill="none" stroke="#FF3366" stroke-width="1.5" opacity="0.7"/>
  <!-- With AI (stable) -->
  <polyline points="490,315 540,316 590,314 640,315 690,316 740,315 790,316 840,315 890,316 930,315" fill="none" stroke="#10B981" stroke-width="2.5" filter="url(#p6-glow)"/>
  <text x="500" y="260" class="mono" fill="#FF3366" font-size="8">Without AI: large amplitude swings</text>
  <text x="500" y="308" class="mono" fill="#10B981" font-size="8">With AI CPAN: near-flat stable plasma</text>

  <!-- Metrics block -->
  <rect x="475" y="345" width="460" height="55" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
  <text x="490" y="362" class="mono" fill="#c084fc" font-size="8.5" font-weight="bold">KEY METRICS:</text>
  <text x="490" y="378" class="mono" fill="#94a3b8" font-size="8">Plasma temp: &gt;100 million K   |   Confinement: H-mode   |   AI latency: &lt;2 ms real-time</text>
  <text x="490" y="393" class="mono" fill="#94a3b8" font-size="8">MHD solver: PINN surrogate   |   Mode detection: m=2,n=1 kink, n=1 ELM   |   Stabilization: 94% improvement</text>
</svg>