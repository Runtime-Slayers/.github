<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d0020"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="11" font-weight="bold">PROJ-33 // CITEDiscord-Net — OPTIMAL TRANSPORT CITE-seq</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-GEN-0033 | REV.A | GENOMICS AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">CITEDiscord-Net: CITE-SEQ TRANSCRIPTOME-PROTEOME RECONCILIATION</text>
<!-- UMAP visualization (left) -->
<text x="220" y="88" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">UMAP EMBEDDING — RNA + PROTEIN MODALITIES</text>
<rect x="35" y="96" width="400" height="275" rx="5" fill="#001020" stroke="#c084fc" stroke-width="1.5"/>
<!-- RNA clusters (colorful blobs) -->
<ellipse cx="120" cy="200" rx="55" ry="45" fill="#c084fc" opacity="0.25"/>
<ellipse cx="250" cy="155" rx="50" ry="40" fill="#00E5FF" opacity="0.25"/>
<ellipse cx="320" cy="250" rx="55" ry="45" fill="#10B981" opacity="0.25"/>
<ellipse cx="160" cy="300" rx="45" ry="35" fill="#F59E0B" opacity="0.25"/>
<ellipse cx="270" cy="310" rx="40" ry="30" fill="#FF3366" opacity="0.2"/>
<!-- Cell dots (RNA) -->
<g fill="#c084fc" opacity="0.7">
  <circle cx="100" cy="185" r="3"/><circle cx="115" cy="200" r="3"/><circle cx="130" cy="190" r="3"/>
  <circle cx="140" cy="210" r="3"/><circle cx="105" cy="215" r="3"/><circle cx="120" cy="225" r="3"/>
</g>
<g fill="#00E5FF" opacity="0.7">
  <circle cx="235" cy="145" r="3"/><circle cx="250" cy="155" r="3"/><circle cx="265" cy="150" r="3"/>
  <circle cx="245" cy="165" r="3"/><circle cx="260" cy="170" r="3"/>
</g>
<g fill="#10B981" opacity="0.7">
  <circle cx="305" cy="240" r="3"/><circle cx="320" cy="255" r="3"/><circle cx="335" cy="245" r="3"/>
  <circle cx="310" cy="265" r="3"/><circle cx="330" cy="265" r="3"/>
</g>
<g fill="#F59E0B" opacity="0.7">
  <circle cx="145" cy="290" r="3"/><circle cx="160" cy="305" r="3"/><circle cx="175" cy="295" r="3"/>
  <circle cx="150" cy="315" r="3"/>
</g>
<!-- Optimal transport arrows (cross-modal mapping) -->
<g stroke="#FF3366" stroke-width="1" stroke-dasharray="3,2" opacity="0.6">
  <line x1="120" y1="200" x2="250" y2="155"/>
  <line x1="115" y1="215" x2="320" y2="250"/>
  <line x1="160" y1="300" x2="270" y2="310"/>
</g>
<text x="220" y="385" class="m" fill="#c084fc" font-size="8" text-anchor="middle">Wasserstein optimal transport aligns RNA + protein cell clusters</text>
<!-- RIGHT: Pipeline -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">OPTIMAL TRANSPORT PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="35" rx="3" fill="#100020" stroke="#c084fc" stroke-width="1.5"/>
<text x="700" y="103" class="m" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">CITE-seq INPUT: RNA + ADT protein expression</text>
<text x="700" y="113" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">10X Multiome: 20k cells — 33k genes + 228 proteins (ADT)</text>
<rect x="490" y="127" width="420" height="35" rx="3" fill="#0d0020" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="145" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">OPTIMAL TRANSPORT: Wasserstein-1 distance</text>
<text x="700" y="155" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">POT library — Sinkhorn algorithm — cross-modal cell matching</text>
<rect x="490" y="169" width="420" height="35" rx="3" fill="#001020" stroke="#00E5FF" stroke-width="1.2"/>
<text x="700" y="187" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">GNN RECONCILIATION: Graph attention network</text>
<text x="700" y="197" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Cell-cell graph — harmonize discordant RNA/protein signals</text>
<rect x="490" y="211" width="420" height="35" rx="3" fill="#001020" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="229" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">OUTPUT: Integrated multi-modal cell atlas</text>
<text x="700" y="239" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Discord score identifies discordant cells — novel biology signal</text>
<rect x="475" y="263" width="460" height="130" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="280" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">PERFORMANCE METRICS</text>
<g class="m" font-size="8">
  <text x="490" y="297" fill="#94a3b8">Dataset:</text><text x="620" y="297" fill="#c084fc">NeurIPS 2022 CITE-seq (90k cells)</text>
  <text x="490" y="314" fill="#94a3b8">Modalities:</text><text x="620" y="314" fill="#00E5FF">RNA (33k genes) + Protein (228 ADT)</text>
  <text x="490" y="331" fill="#94a3b8">OT method:</text><text x="620" y="331" fill="#F59E0B">Wasserstein-1 + Sinkhorn (eps=0.05)</text>
  <text x="490" y="348" fill="#94a3b8">Label transfer ARI:</text><text x="620" y="348" fill="#10B981">0.94 (vs 0.81 Seurat v5)</text>
  <text x="490" y="365" fill="#94a3b8">Discord detection:</text><text x="620" y="365" fill="#FF3366">7.3% discordant cells identified</text>
  <text x="490" y="382" fill="#94a3b8">GNN:</text><text x="620" y="382" fill="#c084fc">4-layer GAT — cell-cell interaction graph</text>
</g>
</svg>