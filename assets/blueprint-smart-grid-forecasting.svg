<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000d05"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#10B981" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#10B981" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#10B981" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#10B981" font-size="10" font-weight="bold">PROJ-45 // SMART GRID ENERGY DEMAND FORECASTING — LSTM + TRANSFORMER</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-ENG-0045 | REV.A | ENERGY AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
<text x="220" y="66" class="m" fill="#10B981" font-size="9" text-anchor="middle">SMART GRID ENERGY DEMAND FORECAST — 24HR AHEAD</text>
    <rect x="35" y="80" width="400" height="295" rx="5" fill="#000d05" stroke="#10B981" stroke-width="1.5"/>
    <text x="220" y="100" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">24-HOUR DEMAND FORECAST (MW)</text>
    <!-- Time axis -->
    <line x1="55" y1="340" x2="420" y2="340" stroke="#94a3b8" stroke-width="1"/>
    <line x1="55" y1="130" x2="55" y2="340" stroke="#94a3b8" stroke-width="1"/>
    <!-- Actual load (past 168hr) -->
    <polyline points="55,280 80,260 105,240 130,220 155,235 180,270 205,300 230,310 255,290 280,260 305,240 330,230 355,245 380,265 405,280 420,270" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="0"/>
    <!-- Forecast (next 24hr) highlighted -->
    <polyline points="420,270 435,260 450,245 465,240" fill="none" stroke="#10B981" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Confidence band -->
    <path d="M420,270 L435,255 L450,238 L465,232 L465,248 L450,252 L435,265 Z" fill="#10B981" opacity="0.2"/>
    <text x="450" y="230" class="m" fill="#10B981" font-size="7.5">FORECAST</text>
    <!-- Y-axis labels -->
    <text x="35" y="142" class="m" fill="#94a3b8" font-size="7.5">High</text>
    <text x="35" y="285" class="m" fill="#94a3b8" font-size="7.5">Low</text>
    <!-- Anomaly detection spike -->
    <circle cx="205" cy="300" r="8" fill="none" stroke="#FF3366" stroke-width="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="195" y="318" class="m" fill="#FF3366" font-size="7.5">ANOMALY</text>
    <!-- Legend -->
    <line x1="55" y1="358" x2="80" y2="358" stroke="#94a3b8" stroke-width="2"/><text x="85" y="362" class="m" fill="#94a3b8" font-size="7.5">Actual (168hr)</text>
    <line x1="200" y1="358" x2="225" y2="358" stroke="#10B981" stroke-width="2"/><text x="230" y="362" class="m" fill="#10B981" font-size="7.5">Forecast (24hr)</text>
    <text x="220" y="380" class="m" fill="#10B981" font-size="8" text-anchor="middle">MAPE: 2.1% | Anomaly detect: 97.4% | POSOCO Indian grid</text>
<!-- RIGHT PANEL -->
<text x="700" y="68" class="s" fill="#10B981" font-size="11" font-weight="bold" text-anchor="middle">SYSTEM ARCHITECTURE &amp; METRICS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>
<!-- Description block -->
<rect x="490" y="82" width="440" height="200" rx="5" fill="#080d18" stroke="#10B981" stroke-width="1"/>
<text x="710" y="100" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">TECHNICAL OVERVIEW</text>
<line x1="490" y1="108" x2="930" y2="108" stroke="#10B981" stroke-width="0.5"/>
<text x="500" y="130" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">Hybrid LSTM + Transformer model for 24-hour ahead electricity demand forecasting</text>
<text x="500" y="148" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> on Indian national grid data. Input features: historical load (168 hr), tempera</text>
<text x="500" y="166" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">ture, humidity, day-of-week, public holiday flag, renewable energy generation. M</text>
<text x="500" y="184" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">APE: 2.1% (vs 3.8% ARIMA). Tested on POSOCO Indian grid data 2019-2023. Anomaly </text>
<text x="500" y="202" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">detection integrated: 97.4% fault detect. Enables real-time demand-response opti</text>
<text x="500" y="220" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">mization for renewable integration.</text>
<text x="500" y="238" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="256" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="274" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<!-- Metrics table -->
<rect x="490" y="295" width="440" height="110" rx="4" fill="#080d18" stroke="#10B981" stroke-width="1"/>
<text x="710" y="310" class="m" fill="#10B981" font-size="8.5" text-anchor="middle" font-weight="bold">KEY METRICS</text>
<line x1="490" y1="316" x2="930" y2="316" stroke="#10B981" stroke-width="0.5"/>
<text x="490" y="305" class="m" fill="#94a3b8" font-size="8">Model</text><text x="660" y="305" class="m" fill="#10B981" font-size="8">LSTM + Transformer hybrid</text>
<text x="490" y="322" class="m" fill="#94a3b8" font-size="8">Forecast horizon</text><text x="660" y="322" class="m" fill="#94a3b8" font-size="8">24 hours ahead (hourly)</text>
<text x="490" y="339" class="m" fill="#94a3b8" font-size="8">MAPE</text><text x="660" y="339" class="m" fill="#10B981" font-size="8">2.1% (vs 3.8% ARIMA baseline)</text>
<text x="490" y="356" class="m" fill="#94a3b8" font-size="8">Anomaly detection</text><text x="660" y="356" class="m" fill="#FF3366" font-size="8">97.4% fault identification</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">Dataset</text><text x="660" y="373" class="m" fill="#38bdf8" font-size="8">POSOCO Indian grid 2019-2023</text>
<text x="490" y="390" class="m" fill="#94a3b8" font-size="8">Features</text><text x="660" y="390" class="m" fill="#94a3b8" font-size="8">Load history + weather + calendar</text>

</svg>