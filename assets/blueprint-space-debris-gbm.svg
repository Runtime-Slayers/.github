<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <style>.mono{font-family:"JetBrains Mono","Courier New",monospace}.sans{font-family:"Montserrat","Segoe UI",sans-serif}</style>
    <filter id="p8-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="p8-bg" cx="30%" cy="30%" r="60%"><stop offset="0%" stop-color="#0a0e1f"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
    <pattern id="p8-grid-minor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="p8-grid-major" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#p8-grid-minor)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
  </defs>
  <rect width="960" height="420" fill="url(#p8-bg)"/>
  <rect width="960" height="420" fill="url(#p8-grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#10B981" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#10B981" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" class="mono" fill="#10B981" font-size="11" font-weight="bold">PROJ-08 // SPACE DEBRIS COLLISION PROBABILITY — GBM ENSEMBLE</text>
  <text x="700" y="32" class="mono" fill="#94a3b8" font-size="9">DRW-AERO-0008 | REV.A | ORBITAL SAFETY</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>

  <!-- LEFT: Orbital visualization -->
  <text x="220" y="66" class="mono" fill="#10B981" font-size="9" text-anchor="middle">LEO DEBRIS CONJUNCTION GEOMETRY</text>
  <!-- Earth -->
  <circle cx="220" cy="235" r="55" fill="#0a1a30" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="220" y="239" class="mono" fill="#38bdf8" font-size="9" text-anchor="middle">EARTH</text>
  <!-- Orbital rings -->
  <ellipse cx="220" cy="235" rx="120" ry="45" fill="none" stroke="#10B981" stroke-width="1" stroke-dasharray="5,5" opacity="0.6" transform="rotate(-20 220 235)"/>
  <ellipse cx="220" cy="235" rx="140" ry="55" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" transform="rotate(10 220 235)"/>
  <ellipse cx="220" cy="235" rx="160" ry="65" fill="none" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="5,5" opacity="0.4" transform="rotate(-35 220 235)"/>
  <!-- Active satellite -->
  <circle cx="335" cy="205" r="7" fill="#00E5FF" filter="url(#p8-glow)"/>
  <text x="348" y="202" class="mono" fill="#00E5FF" font-size="7.5">SAT-A</text>
  <!-- Debris objects -->
  <circle cx="105" cy="255" r="5" fill="#FF3366" filter="url(#p8-glow)"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="62" y="252" class="mono" fill="#FF3366" font-size="7.5">DEB-001</text>
  <circle cx="280" cy="130" r="4" fill="#FF3366" filter="url(#p8-glow)"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <text x="286" y="128" class="mono" fill="#FF3366" font-size="7.5">DEB-002</text>
  <circle cx="360" cy="310" r="3" fill="#F59E0B" filter="url(#p8-glow)"/>
  <circle cx="100" cy="165" r="3" fill="#F59E0B" filter="url(#p8-glow)"/>
  <circle cx="350" cy="155" r="3" fill="#c084fc" filter="url(#p8-glow)"/>
  <!-- Conjunction warning arrow -->
  <line x1="325" y1="205" x2="270" y2="205" stroke="#FF3366" stroke-width="2" stroke-dasharray="4,2" filter="url(#p8-glow)"/>
  <line x1="115" y1="255" x2="190" y2="245" stroke="#FF3366" stroke-width="2" stroke-dasharray="4,2" filter="url(#p8-glow)"/>
  <text x="220" y="390" class="mono" fill="#10B981" font-size="8" text-anchor="middle">CDM data — TCA in 72h — Pc threshold 1e-4</text>

  <!-- Divider -->
  <line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>

  <!-- RIGHT: ML Pipeline -->
  <text x="480" y="68" class="sans" fill="#10B981" font-size="12" font-weight="bold">GBM COLLISION PROBABILITY PIPELINE</text>
  <line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>

  <!-- Input: CDM -->
  <rect x="490" y="85" width="200" height="45" rx="5" fill="#001a0f" stroke="#10B981" stroke-width="1.5"/>
  <text x="590" y="106" class="mono" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">CDM INPUT</text>
  <text x="590" y="120" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">18-col conjunction data messages</text>

  <!-- Feature engineering -->
  <rect x="490" y="145" width="200" height="45" rx="5" fill="#0a1a00" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="590" y="166" class="mono" fill="#F59E0B" font-size="9" text-anchor="middle" font-weight="bold">FEATURE ENGINEERING</text>
  <text x="590" y="180" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">orbital elements, relative velocity, sigma</text>

  <!-- GBM Model -->
  <rect x="490" y="205" width="200" height="55" rx="5" fill="#0d2010" stroke="#10B981" stroke-width="2"/>
  <text x="590" y="226" class="mono" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">GRADIENT BOOSTED</text>
  <text x="590" y="239" class="mono" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">ENSEMBLE (XGBoost)</text>
  <text x="590" y="252" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">500 trees, depth 6, SHAP explain</text>

  <!-- Output -->
  <rect x="490" y="275" width="200" height="45" rx="5" fill="#001500" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="590" y="296" class="mono" fill="#00E5FF" font-size="9" text-anchor="middle" font-weight="bold">Pc SCORE OUTPUT</text>
  <text x="590" y="310" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Maneuver decision: YES/NO at 1e-4</text>

  <!-- Arrows -->
  <line x1="590" y1="130" x2="590" y2="145" stroke="#94a3b8" stroke-width="1.5"/><polygon points="587,143 590,150 593,143" fill="#94a3b8"/>
  <line x1="590" y1="190" x2="590" y2="205" stroke="#94a3b8" stroke-width="1.5"/><polygon points="587,203 590,210 593,203" fill="#94a3b8"/>
  <line x1="590" y1="260" x2="590" y2="275" stroke="#94a3b8" stroke-width="1.5"/><polygon points="587,273 590,280 593,273" fill="#94a3b8"/>

  <!-- SHAP feature importance panel -->
  <rect x="715" y="85" width="215" height="235" rx="5" fill="#080d18" stroke="#F59E0B" stroke-width="1"/>
  <text x="822" y="104" class="mono" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">SHAP FEATURE IMPORTANCE</text>
  <line x1="715" y1="112" x2="930" y2="112" stroke="#F59E0B" stroke-width="0.5"/>
  <!-- Feature bars -->
  <text x="727" y="128" class="mono" fill="#94a3b8" font-size="8">miss_distance</text><rect x="827" y="118" width="90" height="12" fill="#10B981" rx="2"/>
  <text x="727" y="148" class="mono" fill="#94a3b8" font-size="8">relative_speed</text><rect x="827" y="138" width="75" height="12" fill="#10B981" rx="2" opacity="0.85"/>
  <text x="727" y="168" class="mono" fill="#94a3b8" font-size="8">sigma_r</text><rect x="827" y="158" width="60" height="12" fill="#10B981" rx="2" opacity="0.7"/>
  <text x="727" y="188" class="mono" fill="#94a3b8" font-size="8">Pc_SpaceTrack</text><rect x="827" y="178" width="50" height="12" fill="#F59E0B" rx="2" opacity="0.7"/>
  <text x="727" y="208" class="mono" fill="#94a3b8" font-size="8">TCA hours</text><rect x="827" y="198" width="40" height="12" fill="#F59E0B" rx="2" opacity="0.6"/>
  <text x="727" y="228" class="mono" fill="#94a3b8" font-size="8">altitude_km</text><rect x="827" y="218" width="30" height="12" fill="#c084fc" rx="2" opacity="0.5"/>
  <text x="727" y="248" class="mono" fill="#94a3b8" font-size="8">object_size</text><rect x="827" y="238" width="22" height="12" fill="#c084fc" rx="2" opacity="0.4"/>
  <text x="727" y="268" class="mono" fill="#94a3b8" font-size="8">Rcs_est</text><rect x="827" y="258" width="15" height="12" fill="#FF3366" rx="2" opacity="0.4"/>
  <line x1="715" y1="280" x2="930" y2="280" stroke="#F59E0B" stroke-width="0.5"/>
  <text x="727" y="296" class="mono" fill="#94a3b8" font-size="8">AUC-ROC: 0.987</text>
  <text x="727" y="311" class="mono" fill="#10B981" font-size="8">Precision at 1e-4: 94.2%</text>

  <!-- Bottom metrics -->
  <rect x="475" y="330" width="460" height="72" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
  <text x="490" y="347" class="mono" fill="#10B981" font-size="8.5" font-weight="bold">SYSTEM METRICS</text>
  <text x="490" y="363" class="mono" fill="#94a3b8" font-size="8">Dataset: ESA CDM catalog, 50k+ conjunction events   |   Model: XGBoost GBM ensemble</text>
  <text x="490" y="378" class="mono" fill="#94a3b8" font-size="8">Pc threshold: 1e-4   |   Prediction window: 72 hours TCA   |   Inference: 12 ms per event</text>
  <text x="490" y="393" class="mono" fill="#F59E0B" font-size="8">Impact: Reduces false maneuver alarms by 67% vs classical Foster method</text>
</svg>