<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#100020"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="11" font-weight="bold">PROJ-17 // TOPOLOGICAL SURFACE CODE — SATELLITE QKD</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-QUANTUM-0017 | REV.A | QUANTUM CRYPTOGRAPHY</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">TOPOLOGICAL SURFACE CODE + SATELLITE QKD</text>
<!-- Qubit lattice (surface code) -->
<!-- Data qubits -->
<g fill="#c084fc" stroke="#c084fc" stroke-width="0.5">
  <rect x="55" y="85" width="16" height="16" rx="3"/><rect x="115" y="85" width="16" height="16" rx="3"/>
  <rect x="175" y="85" width="16" height="16" rx="3"/><rect x="235" y="85" width="16" height="16" rx="3"/>
  <rect x="55" y="145" width="16" height="16" rx="3"/><rect x="115" y="145" width="16" height="16" rx="3"/>
  <rect x="175" y="145" width="16" height="16" rx="3"/><rect x="235" y="145" width="16" height="16" rx="3"/>
  <rect x="55" y="205" width="16" height="16" rx="3"/><rect x="115" y="205" width="16" height="16" rx="3"/>
  <rect x="175" y="205" width="16" height="16" rx="3"/><rect x="235" y="205" width="16" height="16" rx="3"/>
</g>
<!-- Ancilla qubits (X and Z check) -->
<g fill="none" stroke="#00E5FF" stroke-width="1.2">
  <circle cx="85" cy="115" r="8"/><circle cx="205" cy="115" r="8"/>
  <circle cx="85" cy="175" r="8"/><circle cx="205" cy="175" r="8"/>
  <circle cx="145" cy="115" r="8" stroke="#F59E0B"/><circle cx="145" cy="175" r="8" stroke="#F59E0B"/>
</g>
<!-- Lattice connections -->
<g stroke="#c084fc" stroke-width="0.5" opacity="0.3">
  <line x1="71" y1="93" x2="85" y2="107"/><line x1="131" y1="93" x2="85" y2="107"/><line x1="71" y1="153" x2="85" y2="107"/>
  <line x1="71" y1="153" x2="85" y2="175"/><line x1="131" y1="153" x2="85" y2="175"/>
  <line x1="131" y1="93" x2="145" y2="107"/><line x1="191" y1="93" x2="145" y2="107"/>
  <line x1="191" y1="93" x2="205" y2="107"/><line x1="251" y1="93" x2="205" y2="107"/>
</g>
<!-- Error syndrome highlighted -->
<circle cx="145" cy="175" r="10" fill="#FF3366" opacity="0.4" filter="url(#glow)"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="1s" repeatCount="indefinite"/></circle>
<text x="160" y="178" class="m" fill="#FF3366" font-size="7.5">ERROR</text>
<text x="160" y="189" class="m" fill="#FF3366" font-size="7.5">DETECTED</text>
<text x="150" y="230" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">X-check  (cyan)</text>
<text x="150" y="242" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Z-check  (amber)</text>
<!-- Satellite link schematic -->
<rect x="50" y="270" width="80" height="50" rx="5" fill="#100020" stroke="#c084fc" stroke-width="1.5"/>
<text x="90" y="291" class="m" fill="#c084fc" font-size="8" text-anchor="middle">GROUND</text>
<text x="90" y="304" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Station A</text>
<!-- Photon link arc -->
<path d="M130 295 Q220 200 310 295" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="5,3" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="0;-16;0" dur="1.5s" repeatCount="indefinite"/>
</path>
<!-- Satellite -->
<text x="220" y="215" class="m" fill="#F59E0B" font-size="20" text-anchor="middle" filter="url(#glow)">&#9732;</text>
<text x="220" y="235" class="m" fill="#F59E0B" font-size="7.5" text-anchor="middle">QKD SAT</text>
<text x="220" y="246" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">500 km LEO</text>
<rect x="290" y="270" width="80" height="50" rx="5" fill="#100020" stroke="#c084fc" stroke-width="1.5"/>
<text x="330" y="291" class="m" fill="#c084fc" font-size="8" text-anchor="middle">GROUND</text>
<text x="330" y="304" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Station B</text>
<text x="220" y="390" class="m" fill="#c084fc" font-size="8" text-anchor="middle">BB84 over 500 km satellite link — topological error correction</text>
<!-- RIGHT: BB84 Protocol -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">BB84 QKD PROTOCOL DIAGRAM</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<!-- Alice -->
<rect x="490" y="85" width="100" height="50" rx="4" fill="#100020" stroke="#c084fc" stroke-width="1.5"/>
<text x="540" y="110" class="m" fill="#c084fc" font-size="10" text-anchor="middle" font-weight="bold">ALICE</text>
<text x="540" y="125" class="m" fill="#94a3b8" font-size="8" text-anchor="middle">TX photons</text>
<!-- Bob -->
<rect x="830" y="85" width="100" height="50" rx="4" fill="#100020" stroke="#00E5FF" stroke-width="1.5"/>
<text x="880" y="110" class="m" fill="#00E5FF" font-size="10" text-anchor="middle" font-weight="bold">BOB</text>
<text x="880" y="125" class="m" fill="#94a3b8" font-size="8" text-anchor="middle">RX photons</text>
<!-- Photon stream -->
<g class="m" font-size="12" fill="#F59E0B">
  <text x="615" y="102">|+&gt;</text><text x="648" y="102">|0&gt;</text><text x="681" y="102">|-&gt;</text><text x="714" y="102">|1&gt;</text><text x="747" y="102">|+&gt;</text>
</g>
<line x1="590" y1="110" x2="830" y2="110" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
</line>
<!-- Steps -->
<rect x="490" y="155" width="440" height="35" rx="3" fill="#001020" stroke="#c084fc" stroke-width="1"/>
<text x="710" y="170" class="m" fill="#c084fc" font-size="8.5" text-anchor="middle" font-weight="bold">Step 1: Alice sends random polarized photons (4 bases)</text>
<text x="710" y="183" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Rectilinear (+) and diagonal (x) bases randomly chosen</text>
<rect x="490" y="198" width="440" height="35" rx="3" fill="#001020" stroke="#F59E0B" stroke-width="1"/>
<text x="710" y="213" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">Step 2: Bob measures randomly — sifting over classical channel</text>
<text x="710" y="226" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">50% basis match — remaining form raw key</text>
<rect x="490" y="241" width="440" height="35" rx="3" fill="#001020" stroke="#10B981" stroke-width="1"/>
<text x="710" y="256" class="m" fill="#10B981" font-size="8.5" text-anchor="middle" font-weight="bold">Step 3: Error correction + privacy amplification</text>
<text x="710" y="269" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Topological surface code corrects bit-flip and phase errors</text>
<rect x="490" y="284" width="440" height="35" rx="3" fill="#001020" stroke="#FF3366" stroke-width="1"/>
<text x="710" y="299" class="m" fill="#FF3366" font-size="8.5" text-anchor="middle" font-weight="bold">Step 4: Eavesdrop detection — QBER threshold 11%</text>
<text x="710" y="312" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">If QBER &gt; 11% abort: Eve detected by Heisenberg uncertainty</text>
<!-- Bottom -->
<rect x="475" y="332" width="460" height="72" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="349" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">SYSTEM SPECS</text>
<text x="490" y="366" class="m" fill="#94a3b8" font-size="8">Link distance: 500 km LEO satellite   |   Key rate: 10 kbps   |   QBER threshold: 11%</text>
<text x="490" y="381" class="m" fill="#94a3b8" font-size="8">Error correction: Topological surface code (distance-3)   |   Qubit type: transmon</text>
<text x="490" y="396" class="m" fill="#F59E0B" font-size="8">Security: Information-theoretically secure (no computational assumptions)</text>
</svg>