<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000d08"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#10B981" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#10B981" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#10B981" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#10B981" font-size="11" font-weight="bold">PROJ-37 // TEMPORAL GUT MICROBIOME NETWORK FORECASTING</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-GEN-0037 | REV.A | MICROBIOME AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#10B981" font-size="9" text-anchor="middle">TEMPORAL GUT MICROBIOME NETWORK FORECASTING</text>
<!-- Microbiome timeline chart (left) -->
<text x="220" y="88" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">MICROBIAL ABUNDANCE OVER TIME — TEMPORAL GRAPH</text>
<rect x="35" y="96" width="400" height="270" rx="5" fill="#001020" stroke="#10B981" stroke-width="1.5"/>
<!-- Time axis -->
<line x1="55" y1="335" x2="420" y2="335" stroke="#94a3b8" stroke-width="1"/>
<line x1="55" y1="120" x2="55" y2="335" stroke="#94a3b8" stroke-width="1"/>
<text x="237" y="350" class="m" fill="#94a3b8" font-size="8" text-anchor="middle">Time (weeks 0 to 52)</text>
<!-- Species abundance time series -->
<polyline points="55,300 115,270 175,240 235,220 295,235 355,215 415,200" fill="none" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
<polyline points="55,260 115,290 175,285 235,260 295,275 355,265 415,250" fill="none" stroke="#c084fc" stroke-width="2"/>
<polyline points="55,320 115,310 175,300 235,310 295,290 355,280 415,290" fill="none" stroke="#F59E0B" stroke-width="2"/>
<polyline points="55,280 115,250 175,270 235,245 295,255 355,240 415,230" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
<!-- Legend -->
<line x1="60" y1="115" x2="85" y2="115" stroke="#10B981" stroke-width="2"/><text x="90" y="119" class="m" fill="#94a3b8" font-size="7.5">Lactobacillus</text>
<line x1="160" y1="115" x2="185" y2="115" stroke="#c084fc" stroke-width="2"/><text x="190" y="119" class="m" fill="#94a3b8" font-size="7.5">Bifidobacterium</text>
<line x1="280" y1="115" x2="305" y2="115" stroke="#F59E0B" stroke-width="2"/><text x="310" y="119" class="m" fill="#94a3b8" font-size="7.5">Prevotella</text>
<line x1="360" y1="115" x2="385" y2="115" stroke="#38bdf8" stroke-width="1.5"/><text x="390" y="119" class="m" fill="#94a3b8" font-size="7.5">Bacteroides</text>
<!-- Perturbation event (antibiotic) -->
<line x1="235" y1="120" x2="235" y2="335" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
<text x="230" y="358" class="m" fill="#FF3366" font-size="7.5" text-anchor="middle">Antibiotic</text>
<!-- Forecasted region -->
<rect x="355" y="120" width="65" height="215" fill="#00E5FF" opacity="0.06"/>
<text x="387" y="135" class="m" fill="#00E5FF" font-size="7" text-anchor="middle">FORECAST</text>
<text x="220" y="393" class="m" fill="#10B981" font-size="8" text-anchor="middle">Temporal GNN forecasts post-antibiotic microbiome recovery trajectory</text>
<!-- RIGHT: Temporal GNN pipeline -->
<text x="700" y="68" class="s" fill="#10B981" font-size="11" font-weight="bold" text-anchor="middle">TEMPORAL GRAPH NEURAL NETWORK PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="35" rx="3" fill="#001500" stroke="#10B981" stroke-width="1.5"/>
<text x="700" y="103" class="m" fill="#10B981" font-size="9" text-anchor="middle">INPUT: 16S rRNA amplicon + metagenomic time-series</text>
<text x="700" y="113" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Human Microbiome Project — 52-week longitudinal cohort (n=300)</text>
<rect x="490" y="127" width="420" height="35" rx="3" fill="#0a1000" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="145" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">GRAPH CONSTRUCTION: OTU interaction network</text>
<text x="700" y="155" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Spearman correlation network — 200 OTU nodes — weekly snapshots</text>
<rect x="490" y="169" width="420" height="35" rx="3" fill="#001020" stroke="#c084fc" stroke-width="1.2"/>
<text x="700" y="187" class="m" fill="#c084fc" font-size="9" text-anchor="middle">TEMPORAL GNN: DCRNN + GraphWaveNet</text>
<text x="700" y="197" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Diffusion convolution RNN — captures temporal dynamics + topology</text>
<rect x="490" y="211" width="420" height="35" rx="3" fill="#001500" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="229" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">OUTPUT: 4-week OTU abundance forecast</text>
<text x="700" y="239" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">MAPE 8.3% — predicts dysbiosis recovery timeline</text>
<rect x="475" y="263" width="460" height="130" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
<text x="490" y="280" class="m" fill="#10B981" font-size="8.5" font-weight="bold">FORECASTING METRICS</text>
<g class="m" font-size="8">
  <text x="490" y="297" fill="#94a3b8">Cohort:</text><text x="620" y="297" fill="#10B981">HMP2 — 300 participants, 52 weeks</text>
  <text x="490" y="314" fill="#94a3b8">OTU nodes:</text><text x="620" y="314" fill="#94a3b8">200 operational taxonomic units</text>
  <text x="490" y="331" fill="#94a3b8">Forecast horizon:</text><text x="620" y="331" fill="#F59E0B">4 weeks ahead — MAPE 8.3%</text>
  <text x="490" y="348" fill="#94a3b8">Perturbation:</text><text x="620" y="348" fill="#FF3366">Antibiotic — recovery predicted in 6 wk</text>
  <text x="490" y="365" fill="#94a3b8">GNN model:</text><text x="620" y="365" fill="#c084fc">DCRNN (diffusion convolutional RNN)</text>
  <text x="490" y="382" fill="#94a3b8">Benchmark:</text><text x="620" y="382" fill="#94a3b8">+31% MAPE improvement vs VAR model</text>
</g>
</svg>