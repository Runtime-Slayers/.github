<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d001a"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="11" font-weight="bold">PROJ-21 // QUANTUM-NEURAL HYBRID MRI RECONSTRUCTION</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-QUANTUM-0021 | REV.A | QUANTUM BIOMEDICAL</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">QUANTUM-CLASSICAL HYBRID MRI RECONSTRUCTION</text>
<!-- MRI k-space raw data -->
<rect x="35" y="80" width="130" height="130" rx="4" fill="#001020" stroke="#c084fc" stroke-width="1.5"/>
<text x="100" y="97" class="m" fill="#c084fc" font-size="8" text-anchor="middle">K-SPACE DATA</text>
<!-- k-space noise pattern -->
<g opacity="0.7">
  <rect x="40" y="100" width="120" height="105" fill="#030a15"/>
  <!-- Scattered bright k-space points -->
  <rect x="95" y="148" width="10" height="10" fill="#c084fc" opacity="0.9"/>
  <rect x="70" y="130" width="6" height="6" fill="#c084fc" opacity="0.6"/>
  <rect x="110" y="140" width="6" height="6" fill="#c084fc" opacity="0.6"/>
  <rect x="60" y="155" width="4" height="4" fill="#c084fc" opacity="0.4"/>
  <rect x="130" y="155" width="4" height="4" fill="#c084fc" opacity="0.4"/>
  <rect x="80" y="170" width="5" height="5" fill="#c084fc" opacity="0.5"/>
  <rect x="115" y="165" width="5" height="5" fill="#c084fc" opacity="0.5"/>
  <rect x="95" y="120" width="8" height="8" fill="#c084fc" opacity="0.8"/>
  <rect x="50" y="145" width="3" height="3" fill="#c084fc" opacity="0.3"/>
  <rect x="145" y="145" width="3" height="3" fill="#c084fc" opacity="0.3"/>
</g>
<text x="100" y="220" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Undersampled k-space</text>
<!-- Arrow -->
<line x1="165" y1="145" x2="190" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="188,141 195,145 188,149" fill="#94a3b8"/>
<!-- Quantum circuit for CS reconstruction -->
<rect x="190" y="80" width="130" height="130" rx="4" fill="#100020" stroke="#00E5FF" stroke-width="1.5"/>
<text x="255" y="97" class="m" fill="#00E5FF" font-size="7.5" text-anchor="middle">QUANTUM CS SOLVER</text>
<!-- Simplified circuit lines in the box -->
<line x1="200" y1="115" x2="315" y2="115" stroke="#10B981" stroke-width="1"/>
<line x1="200" y1="135" x2="315" y2="135" stroke="#10B981" stroke-width="1"/>
<line x1="200" y1="155" x2="315" y2="155" stroke="#10B981" stroke-width="1"/>
<line x1="200" y1="175" x2="315" y2="175" stroke="#10B981" stroke-width="1"/>
<g fill="#100020" stroke="#c084fc" stroke-width="1">
  <rect x="210" y="108" width="20" height="14" rx="2"/><text x="220" y="118" class="m" fill="#c084fc" font-size="6.5" text-anchor="middle">H</text>
  <rect x="248" y="108" width="25" height="14" rx="2"/><text x="260" y="118" class="m" fill="#c084fc" font-size="6" text-anchor="middle">Ry(th)</text>
</g>
<circle cx="240" cy="135" r="4" fill="#F59E0B"/>
<line x1="240" y1="135" x2="240" y2="155" stroke="#F59E0B" stroke-width="1.5"/>
<circle cx="240" cy="155" r="8" fill="none" stroke="#F59E0B" stroke-width="1.2"/>
<text x="255" y="200" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">VQE sparse solver</text>
<text x="255" y="212" class="m" fill="#00E5FF" font-size="7" text-anchor="middle">L1-norm compress</text>
<!-- Arrow -->
<line x1="320" y1="145" x2="345" y2="145" stroke="#94a3b8" stroke-width="1.5"/>
<polygon points="343,141 350,145 343,149" fill="#94a3b8"/>
<!-- CNN reconstruction -->
<rect x="345" y="80" width="100" height="130" rx="4" fill="#001a10" stroke="#10B981" stroke-width="1.5"/>
<text x="395" y="97" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">CNN REFINE</text>
<text x="395" y="110" class="m" fill="#94a3b8" font-size="6.5" text-anchor="middle">U-Net decoder</text>
<!-- CNN layer visual -->
<g fill="#001a10" stroke="#10B981" stroke-width="0.8">
  <rect x="355" y="115" width="80" height="12" rx="2"/><text x="395" y="124" class="m" fill="#10B981" font-size="6" text-anchor="middle">Conv 3x3x64</text>
  <rect x="360" y="133" width="70" height="12" rx="2"/><text x="395" y="142" class="m" fill="#10B981" font-size="6" text-anchor="middle">Conv 3x3x128</text>
  <rect x="368" y="151" width="54" height="12" rx="2"/><text x="395" y="160" class="m" fill="#10B981" font-size="6" text-anchor="middle">UpConv x2</text>
  <rect x="360" y="169" width="70" height="12" rx="2"/><text x="395" y="178" class="m" fill="#10B981" font-size="6" text-anchor="middle">Output 256x256</text>
</g>
<text x="395" y="200" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Classical CNN</text>
<text x="395" y="212" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">post-processing</text>
<!-- Reconstructed MRI brain -->
<ellipse cx="250" cy="310" rx="60" ry="75" fill="#0a0010" stroke="#c084fc" stroke-width="1.5"/>
<!-- Brain-like structure inside ellipse -->
<path d="M205 300 Q220 270 250 265 Q280 270 295 300 Q280 340 250 350 Q220 340 205 300 Z" fill="#1a0030" stroke="#c084fc" stroke-width="0.8" opacity="0.7"/>
<path d="M230 280 Q250 275 270 280" fill="none" stroke="#c084fc" stroke-width="0.7" opacity="0.5"/>
<path d="M220 300 Q250 295 280 300" fill="none" stroke="#c084fc" stroke-width="0.7" opacity="0.5"/>
<!-- Tumor highlight -->
<ellipse cx="263" cy="295" rx="15" ry="12" fill="#FF3366" opacity="0.4" filter="url(#glow)"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/></ellipse>
<text x="290" y="293" class="m" fill="#FF3366" font-size="7.5">LESION</text>
<text x="290" y="305" class="m" fill="#FF3366" font-size="7.5">DETECTED</text>
<text x="250" y="400" class="m" fill="#c084fc" font-size="8" text-anchor="middle">Reconstructed MRI — 4x faster than full k-space sampling</text>
<!-- RIGHT: Metrics -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">RECONSTRUCTION QUALITY METRICS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<text x="490" y="96" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">SSIM SCORE — Structural Similarity (higher=better)</text>
<text x="490" y="115" class="m" fill="#94a3b8" font-size="8">Zero-filled reconstruction</text><rect x="640" y="105" width="80" height="14" fill="#FF3366" rx="2" opacity="0.7"/><text x="726" y="116" class="m" fill="#94a3b8" font-size="7.5">0.61</text>
<text x="490" y="136" class="m" fill="#94a3b8" font-size="8">Classical compressed sensing</text><rect x="640" y="126" width="140" height="14" fill="#F59E0B" rx="2" opacity="0.8"/><text x="786" y="137" class="m" fill="#94a3b8" font-size="7.5">0.79</text>
<text x="490" y="157" class="m" fill="#94a3b8" font-size="8">Classical CNN U-Net</text><rect x="640" y="147" width="170" height="14" fill="#10B981" rx="2" opacity="0.8"/><text x="816" y="158" class="m" fill="#94a3b8" font-size="7.5">0.87</text>
<text x="490" y="178" class="m" fill="#94a3b8" font-size="8">Quantum-Classical hybrid</text><rect x="640" y="168" width="193" height="14" fill="#c084fc" rx="2" filter="url(#glow)"/><text x="839" y="179" class="m" fill="#0B0F19" font-size="7.5" font-weight="bold">0.93 best!</text>
<!-- System specs -->
<rect x="475" y="198" width="460" height="205" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="215" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">HYBRID SYSTEM SPECIFICATIONS</text>
<line x1="475" y1="222" x2="935" y2="222" stroke="#c084fc" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="490" y="240" fill="#94a3b8">MRI data:</text><text x="640" y="240" fill="#00E5FF">FastMRI dataset — brain + knee</text>
  <text x="490" y="257" fill="#94a3b8">Acceleration factor:</text><text x="640" y="257" fill="#10B981">4x (25% k-space sampled)</text>
  <text x="490" y="274" fill="#94a3b8">Quantum solver:</text><text x="640" y="274" fill="#c084fc">VQE L1-norm sparse recovery</text>
  <text x="490" y="291" fill="#94a3b8">Qubits used:</text><text x="640" y="291" fill="#c084fc">8 qubits — PennyLane + IBM</text>
  <text x="490" y="308" fill="#94a3b8">CNN architecture:</text><text x="640" y="308" fill="#10B981">U-Net (32M parameters)</text>
  <text x="490" y="325" fill="#94a3b8">SSIM score:</text><text x="640" y="325" fill="#10B981">0.93 (vs 0.87 classical)</text>
  <text x="490" y="342" fill="#94a3b8">PSNR:</text><text x="640" y="342" fill="#F59E0B">38.2 dB</text>
  <text x="490" y="359" fill="#94a3b8">Reconstruction time:</text><text x="640" y="359" fill="#94a3b8">2.1 s (quantum) + 0.4s (CNN)</text>
  <text x="490" y="376" fill="#94a3b8">Lesion detection:</text><text x="640" y="376" fill="#FF3366">Glioma, meningioma segmented</text>
  <text x="490" y="393" fill="#94a3b8">Application:</text><text x="640" y="393" fill="#94a3b8">Accelerated clinical MRI scanning</text>
</g>
</svg>