  <text x="490" y="373" class="mono" fill="#94a3b8" font-size="8">Vortex quantization: h/(m) circulation quanta   |   Lattice type: Abrikosov triangular</text>
  <text x="490" y="388" class="mono" fill="#c084fc" font-size="8">AI: PINN-GPE solver   |   Application: Quantum holographic memory storage</text>
