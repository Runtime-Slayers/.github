  <text x="730" y="133" class="mono" fill="#94a3b8" font-size="8">GPE: ih dPsi/dt =</text>
  <text x="730" y="148" class="mono" fill="#38bdf8" font-size="8">  [-h2/2m nabla2 + V</text>
  <text x="730" y="163" class="mono" fill="#38bdf8" font-size="8">  + g|Psi|2] Psi</text>
  <text x="730" y="183" class="mono" fill="#94a3b8" font-size="8">PINN surrogate solver:</text>
  <text x="730" y="198" class="mono" fill="#F59E0B" font-size="8">  Auto-differentiable GPE</text>
  <text x="730" y="213" class="mono" fill="#F59E0B" font-size="8">  Vortex nucleation predict</text>
  <text x="730" y="228" class="mono" fill="#F59E0B" font-size="8">  Lattice stability optimise</text>
  <text x="730" y="248" class="mono" fill="#94a3b8" font-size="8">Memory density:</text>
  <text x="730" y="263" class="mono" fill="#10B981" font-size="8">  ~10^6 vortex bits / mm^2</text>
  <text x="730" y="278" class="mono" fill="#94a3b8" font-size="8">Coherence time:</text>
  <text x="730" y="293" class="mono" fill="#10B981" font-size="8">  ~100 ms (nano-K trap)</text>

