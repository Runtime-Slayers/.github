    <radialGradient id="p7-bec" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/><stop offset="70%" stop-color="#38bdf8" stop-opacity="0.3"/><stop offset="100%" stop-color="transparent"/></radialGradient>
    <pattern id="p7-grid-minor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="p7-grid-major" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#p7-grid-minor)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
