  <rect x="720" y="85" width="210" height="225" rx="5" fill="#080d18" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="825" y="108" class="mono" fill="#F59E0B" font-size="9" text-anchor="middle" font-weight="bold">GROSS-PITAEVSKII AI</text>
