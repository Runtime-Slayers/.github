<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="d-title d-desc">
  <title id="d-title">AI-Driven 5-Axis CNC Precision Dental Zirconia Milling Blueprint</title>
  <desc id="d-desc">Architectural CAD blueprint of 5-axis CNC dental crown milling, localized tool curvature, and Bayesian cutting force optimization.</desc>
  <defs>
    <linearGradient id="d-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e0a"/>
      <stop offset="50%" stop-color="#1c1610"/>
      <stop offset="100%" stop-color="#0a0705"/>
    </linearGradient>
    <pattern id="d-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2d2218" stroke-width="0.5"/>
    </pattern>
    <filter id="d-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#d-bg)"/>
  <rect width="960" height="420" fill="url(#d-grid)"/>
  <rect width="960" height="420" fill="none" stroke="#523e2b" stroke-width="2"/>

  <!-- CAD Border Registration -->
  <path d="M 10 15 H 25 M 15 10 V 25" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 935 15 H 950 M 945 10 V 25" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 10 405 H 25 M 15 395 V 410" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 935 405 H 950 M 945 395 V 410" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • ADVANCED MANUFACTURING &amp; ROBOTICS BLUEPRINT</text>
  <text x="35" y="58" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">AI-DRIVEN 5-AXIS CNC PRECISION DENTAL ZIRCONIA CROWN MANUFACTURING</text>
  <text x="35" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">BAYESIAN CUTTING FORCE DAMPING • ZERO-CHIPPING TOOLPATH • MARGINAL FIT UNDER 15 MICRONS</text>

  <!-- LEFT PANEL: 5-Axis Diamond Burr Milling & Zirconia Crown Anatomy -->
  <g transform="translate(35, 95)">
    <rect width="450" height="295" rx="8" fill="#18120d" stroke="#523e2b" stroke-width="1.5"/>
    <text x="16" y="22" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 4.0: 5-AXIS TOOLPATH &amp; LOCALIZED CURVATURE</text>

    <!-- Pre-sintered Zirconia Disc (ZrO2) Blank -->
    <rect x="50" y="160" width="350" height="90" rx="6" fill="#261d15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="225" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">PRE-SINTERED CERAMIC ZIRCONIA DISC (98mm)</text>

    <!-- Milled Anatomical Crown Margin -->
    <path d="M 150 160 C 160 110, 200 90, 225 100 C 250 90, 290 110, 300 160 Z" fill="#3b2d20" stroke="#00e5ff" stroke-width="2"/>
    <text x="225" y="135" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CROWN CAVITY</text>

    <!-- 5-Axis Diamond Milling Tool Burr (A/B Rotary + X/Y/Z) -->
    <rect x="220" y="40" width="10" height="40" fill="#94a3b8" stroke="#f8fafc" stroke-width="1"/>
    <polygon points="218,80 232,80 225,92" fill="#f59e0b" filter="url(#d-glow)"/>
    <text x="240" y="65" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">5-AXIS DIAMOND BURR</text>

    <!-- Dynamic Force Vectors F_x, F_y, F_z -->
    <line x1="225" y1="92" x2="260" y2="105" stroke="#ff3366" stroke-width="2"/>
    <polygon points="260,105 252,100 255,108" fill="#ff3366"/>
    <text x="268" y="112" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">F_dynamic &lt; 8.2 N</text>

    <!-- Sub-15 Micron Caliper -->
    <line x1="145" y1="170" x2="155" y2="170" stroke="#10b981" stroke-width="1.5"/>
    <text x="75" y="174" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">MARGIN &lt; 15um</text>

    <text x="16" y="280" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Bayesian physics adjusts feedrate dynamically to prevent brittle micro-cracking</text>
  </g>

  <!-- RIGHT PANEL TOP: Bayesian Physics Toolpath Optimizer -->
  <g transform="translate(505, 95)">
    <rect width="420" height="150" rx="8" fill="#18120d" stroke="#523e2b" stroke-width="1.5"/>
    <text x="16" y="20" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 4.1: CHATTER DAMPING &amp; MATERIAL RETENTION</text>

    <rect x="30" y="45" width="105" height="50" rx="5" fill="#2a1f16" stroke="#f59e0b" stroke-width="1"/>
    <text x="82" y="65" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">G-CODE SCAN</text>
    <text x="82" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Toolpath Vectors</text>

    <path d="M 135 70 H 160" stroke="#00e5ff" stroke-width="1.5"/>

    <rect x="160" y="45" width="120" height="50" rx="5" fill="#2a1f16" stroke="#ff3366" stroke-width="1.5"/>
    <text x="220" y="65" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">FORCE SURROGATE</text>
    <text x="220" y="78" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Bayesian FE Damping</text>

    <path d="M 280 70 H 305" stroke="#00e5ff" stroke-width="1.5"/>

    <rect x="305" y="45" width="95" height="50" rx="5" fill="#2a1f16" stroke="#10b981" stroke-width="1"/>
    <text x="352" y="65" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">0-CHIPPING</text>
    <text x="352" y="78" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">34% Saved Blank</text>

    <text x="16" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Slashes chairside milling cycle time by 40% while eliminating porcelain fracture risk</text>
  </g>

  <!-- RIGHT PANEL BOTTOM: CAD Title Block -->
  <g transform="translate(505, 260)">
    <rect width="420" height="130" rx="8" fill="#18120d" stroke="#523e2b" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="420" y2="30" stroke="#523e2b" stroke-width="1"/>
    <line x1="0" y1="65" x2="420" y2="65" stroke="#523e2b" stroke-width="1"/>
    <line x1="0" y1="100" x2="420" y2="100" stroke="#523e2b" stroke-width="1"/>
    <line x1="210" y1="0" x2="210" y2="100" stroke="#523e2b" stroke-width="1"/>

    <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="80" y="20" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="222" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING ID:</text>
    <text x="285" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-MANUF-DENT-006-REV-A</text>

    <text x="12" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPO:</text>
    <text x="12" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">AI-Driven-Dental-Zirconia-Crown</text>

    <text x="222" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ENGINEERING GROUP:</text>
    <text x="325" y="52" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">PRECISION ROBOTICS</text>

    <text x="12" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">MARGINAL FIT:</text>
    <text x="90" y="86" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">UNDER 15 MICRONS</text>

    <text x="222" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">CYCLE TIME GAIN:</text>
    <text x="325" y="86" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">40% FASTER CHAIRSIDE</text>

    <text x="12" y="118" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">PREVENTS SUBSURFACE MICRO-FRACTURES IN CUSTOM BIOCOMPATIBLE DENTAL RESTORATIONS</text>
  </g>
</svg>