    <rect x="295" y="190" width="110" height="130" fill="#FF3366" opacity="0.2" rx="2"/>
    <!-- Classification grid overlay -->
    <g stroke="#00E5FF" stroke-width="0.5" opacity="0.4">
      <line x1="175" y1="110" x2="175" y2="320"/><line x1="285" y1="110" x2="285" y2="320"/>
      <line x1="55" y1="190" x2="405" y2="190"/>
    </g>
    <text x="115" y="155" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">Vegetation</text>
    <text x="230" y="155" class="m" fill="#38bdf8" font-size="7.5" text-anchor="middle">Water</text>
    <text x="345" y="155" class="m" fill="#F59E0B" font-size="7.5" text-anchor="middle">Urban</text>
    <text x="125" y="260" class="m" fill="#c084fc" font-size="7.5" text-anchor="middle">Barren</text>
    <text x="245" y="260" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">Crop</text>
    <text x="350" y="260" class="m" fill="#FF3366" font-size="7.5" text-anchor="middle">Fire</text>
