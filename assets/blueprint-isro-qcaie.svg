<text x="700" y="68" class="s" fill="#00E5FF" font-size="11" font-weight="bold" text-anchor="middle">SYSTEM ARCHITECTURE &amp; METRICS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#00E5FF" stroke-width="0.5" opacity="0.4"/>
<!-- Description block -->
<rect x="490" y="82" width="440" height="200" rx="5" fill="#080d18" stroke="#00E5FF" stroke-width="1"/>
<text x="710" y="100" class="m" fill="#00E5FF" font-size="9" text-anchor="middle" font-weight="bold">TECHNICAL OVERVIEW</text>
<line x1="490" y1="108" x2="930" y2="108" stroke="#00E5FF" stroke-width="0.5"/>
<text x="500" y="130" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">Quantum-Classical AI Engine for ISRO satellite Earth observation data analysis. </text>
<text x="500" y="148" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">Integrates variational quantum circuits (VQE/QAOA) with classical CNN for multis</text>
<text x="500" y="166" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">pectral image classification, cloud-shadow detection, crop phenology monitoring,</text>
<text x="500" y="184" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> and disaster damage assessment. Tested on Resourcesat-2A and EOS-06 LISS-IV mul</text>
<text x="500" y="202" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">tispectral imagery at 5.8m resolution. QAOA-enhanced SVM for land-cover classifi</text>
<text x="500" y="220" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">cation. PSNR: 38.4dB (SR reconstruction). 6 land-cover classes.</text>
<text x="500" y="238" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="256" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="274" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<!-- Metrics table -->
<rect x="490" y="295" width="440" height="110" rx="4" fill="#080d18" stroke="#00E5FF" stroke-width="1"/>
<text x="710" y="310" class="m" fill="#00E5FF" font-size="8.5" text-anchor="middle" font-weight="bold">KEY METRICS</text>
<line x1="490" y1="316" x2="930" y2="316" stroke="#00E5FF" stroke-width="0.5"/>
<text x="490" y="305" class="m" fill="#94a3b8" font-size="8">Platform</text><text x="660" y="305" class="m" fill="#00E5FF" font-size="8">Resourcesat-2A / EOS-06 LISS-IV</text>
<text x="490" y="322" class="m" fill="#94a3b8" font-size="8">Resolution</text><text x="660" y="322" class="m" fill="#94a3b8" font-size="8">5.8m multispectral — 4 bands</text>
<text x="490" y="339" class="m" fill="#94a3b8" font-size="8">Quantum method</text><text x="660" y="339" class="m" fill="#c084fc" font-size="8">QAOA-SVM + VQE super-resolution</text>
<text x="490" y="356" class="m" fill="#94a3b8" font-size="8">Land classification</text><text x="660" y="356" class="m" fill="#10B981" font-size="8">96.1% accuracy (6 classes)</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">Disaster damage</text><text x="660" y="373" class="m" fill="#FF3366" font-size="8">94% recall — flood / fire</text>
<text x="490" y="390" class="m" fill="#94a3b8" font-size="8">SR PSNR</text><text x="660" y="390" class="m" fill="#F59E0B" font-size="8">38.4 dB (quantum+CNN)</text>

</svg>