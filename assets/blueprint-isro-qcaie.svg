</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#00E5FF" font-size="10" font-weight="bold">PROJ-41 // ISRO-QCAIE — QUANTUM-CLASSICAL EARTH OBSERVATION AI</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-ML-0041 | REV.A | EARTH OBSERVATION AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#00E5FF" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#00E5FF" stroke-width="0.8" opacity="0.4"/>
<text x="220" y="66" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">ISRO QCAIE — SATELLITE IMAGE QUANTUM-CLASSICAL PIPELINE</text>
    <rect x="35" y="80" width="400" height="300" rx="5" fill="#001020" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="220" y="100" class="m" fill="#00E5FF" font-size="8.5" text-anchor="middle">ISRO EOS SATELLITE MULTISPECTRAL IMAGE</text>
    <!-- False color composite -->
    <rect x="55" y="110" width="350" height="210" rx="3" fill="#001a10"/>
    <!-- Land patches (false color) -->
    <rect x="55" y="110" width="120" height="80" fill="#10B981" opacity="0.4" rx="2"/>
    <rect x="175" y="110" width="110" height="80" fill="#38bdf8" opacity="0.3" rx="2"/>
    <rect x="285" y="110" width="120" height="80" fill="#F59E0B" opacity="0.3" rx="2"/>
    <rect x="55" y="190" width="140" height="130" fill="#c084fc" opacity="0.3" rx="2"/>
