<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="t-title t-desc">
  <title id="t-title">TITAN-NET Turbofan PINN Spatio-Temporal Graph Transformer Blueprint</title>
  <desc id="t-desc">Architectural CAD blueprint of multi-stage aircraft turbofan engine, spatio-temporal graph topology, and thermodynamic entropy gating.</desc>
  <defs>
    <linearGradient id="t-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#0c1629"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <pattern id="t-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#122540" stroke-width="0.5"/>
    </pattern>
    <filter id="t-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#t-bg)"/>
  <rect width="960" height="420" fill="url(#t-grid)"/>
  <rect width="960" height="420" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- CAD Border Registration -->
  <path d="M 10 15 H 25 M 15 10 V 25" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 935 15 H 950 M 945 10 V 25" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 10 405 H 25 M 15 395 V 410" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 935 405 H 950 M 945 395 V 410" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • AERO-PROPULSION PINN BLUEPRINT</text>
  <text x="35" y="58" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">TITAN-NET: PHYSICS-INFORMED SPATIO-TEMPORAL GRAPH TRANSFORMER</text>
  <text x="35" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">THERMODYNAMIC ENTROPY GATING • SENSOR RECOVERY FILTER • NASA C-MAPSS 11.42 CYCLES RMSE</text>

  <!-- LEFT PANEL: Turbofan Cross-Section with Graph Station Overlay -->
  <g transform="translate(35, 95)">
    <rect width="450" height="295" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 1.0: MULTI-STAGE TURBOFAN GRAPH TOPOLOGY</text>

    <!-- Turbofan Nacelle Outer Cowling -->
    <path d="M 30 70 L 160 50 L 320 50 L 410 80 L 410 220 L 320 250 L 160 250 L 30 230 Z" fill="#0d1d36" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <!-- Core Engine Contour -->
    <path d="M 130 90 L 390 105 L 390 195 L 130 210 Z" fill="#091322" stroke="#00e5ff" stroke-width="2"/>

    <!-- Engine Stages: Fan, LPC, HPC, Combustor, HPT, LPT -->
    <!-- Fan Station (Station 2) -->
    <line x1="80" y1="70" x2="80" y2="230" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="80" cy="150" r="8" fill="#f59e0b" filter="url(#t-glow)"/>
    <text x="80" y="260" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">STN 2: FAN</text>

    <!-- LPC Station -->
    <line x1="160" y1="95" x2="160" y2="205" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="160" cy="150" r="7" fill="#38bdf8"/>
    <text x="160" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">LPC</text>

    <!-- HPC Station (Station 3) -->
    <line x1="230" y1="100" x2="230" y2="200" stroke="#ff3366" stroke-width="3"/>
    <circle cx="230" cy="150" r="7" fill="#ff3366" filter="url(#t-glow)"/>
    <text x="230" y="220" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">HPC (T30)</text>

    <!-- Combustor -->
    <rect x="260" y="125" width="30" height="50" rx="3" fill="#ff3366" opacity="0.4" stroke="#ff3366" stroke-width="1"/>
    <text x="275" y="153" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">CC</text>

    <!-- HPT Station (Station 4) -->
    <line x1="310" y1="100" x2="310" y2="200" stroke="#ff3366" stroke-width="3"/>
    <circle cx="310" cy="150" r="7" fill="#ff3366"/>
    <text x="310" y="220" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">HPT</text>

    <!-- LPT Station (Station 5) -->
    <line x1="360" y1="105" x2="360" y2="195" stroke="#10b981" stroke-width="3"/>
    <circle cx="360" cy="150" r="7" fill="#10b981" filter="url(#t-glow)"/>
    <text x="360" y="220" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">LPT (T50)</text>

    <!-- Directed Spatio-Temporal Graph Edges Linking Stations -->
    <path d="M 88 150 Q 124 135, 153 150" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="3 2"/>
    <path d="M 167 150 Q 198 135, 223 150" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="3 2"/>
    <path d="M 237 150 Q 273 135, 303 150" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="3 2"/>
    <path d="M 317 150 Q 338 135, 353 150" fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-dasharray="3 2"/>

    <text x="16" y="280" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Station Telemetry Graph: Pressure, Temperature, Rotor Speed (Nf, Nc), Bleed Flow</text>
  </g>

  <!-- RIGHT PANEL TOP: Thermodynamic Gated Loss vs Continuous Wear -->
  <g transform="translate(505, 95)">
    <rect width="420" height="150" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="20" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 1.1: SENSOR RECOVERY vs MAINTENANCE EVENT</text>

    <!-- Axes -->
    <line x1="40" y1="120" x2="380" y2="120" stroke="#475569" stroke-width="1"/>
    <line x1="40" y1="120" x2="40" y2="35" stroke="#475569" stroke-width="1"/>
    <text x="380" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">TIME (FLIGHT CYCLES)</text>
    <text x="14" y="35" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">HEALTH</text>

    <!-- Degradation Curve -->
    <path d="M 40 50 Q 150 55, 190 85 L 200 55 Q 280 65, 360 115" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- The Sudden Maintenance Wash Recovery -->
    <circle cx="200" cy="55" r="4" fill="#10b981" filter="url(#t-glow)"/>
    <line x1="190" y1="85" x2="200" y2="55" stroke="#10b981" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="210" y="58" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">MAINTENANCE WASH</text>

    <text x="16" y="140" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Standard AI flags wash as sensor failure; TITAN-NET recognizes positive entropy balance</text>
  </g>

  <!-- RIGHT PANEL BOTTOM: CAD Title Block -->
  <g transform="translate(505, 260)">
    <rect width="420" height="130" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="420" y2="30" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="0" y1="65" x2="420" y2="65" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="0" y1="100" x2="420" y2="100" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="210" y1="0" x2="210" y2="100" stroke="#1e3a5f" stroke-width="1"/>

    <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="80" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="222" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING ID:</text>
    <text x="285" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-AERO-TITAN-001-REV-A</text>

    <text x="12" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPO:</text>
    <text x="12" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">TITAN-NET-Physics-Informed-Transformer</text>

    <text x="222" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">LEAD ARCHITECT:</text>
    <text x="310" y="52" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">B. RAJENDRA REDDY</text>

    <text x="12" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">BENCHMARK RESULT:</text>
    <text x="105" y="86" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">11.42 CYCLES RMSE (FD002)</text>

    <text x="222" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">EMPIRICAL DATASET:</text>
    <text x="315" y="86" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">NASA C-MAPSS FD001-004</text>

    <text x="12" y="118" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">FIRST-PRINCIPLE THERMODYNAMICS ENFORCED DIRECTLY ON NEURAL LOSS GRAPH</text>
  </g>
</svg>