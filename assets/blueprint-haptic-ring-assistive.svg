<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="r-title r-desc">
  <title id="r-title">Haptic Ring Speech-to-Vibrotactile Sensory Substitution Blueprint</title>
  <desc id="r-desc">Architectural CAD blueprint of wearable finger ring, 4-actuator LRA array, and TinyML phonetic frequency decomposition.</desc>
  <defs>
    <linearGradient id="r-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c1a"/>
      <stop offset="100%" stop-color="#08050e"/>
    </linearGradient>
    <pattern id="r-grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#251638" stroke-width="0.5"/>
    </pattern>
    <pattern id="r-grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#3d215c" stroke-width="1"/>
    </pattern>
    <filter id="r-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#r-bg)"/>
  <rect width="960" height="420" fill="url(#r-grid-minor)"/>
  <rect width="960" height="420" fill="url(#r-grid-major)"/>
  <rect width="960" height="420" fill="none" stroke="#3d215c" stroke-width="2"/>

  <!-- Blueprint Corner Guides -->
  <path d="M 10 15 H 25 M 15 10 V 25" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 935 15 H 950 M 945 10 V 25" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 10 405 H 25 M 15 395 V 410" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 935 405 H 950 M 945 395 V 410" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • ASSISTIVE EDGE ROBOTICS BLUEPRINT</text>
  <text x="35" y="58" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">HAPTIC RING: VIBROTACTILE PHONETIC SENSORY SUBSTITUTION FOR THE DEAF</text>
  <text x="35" y="74" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9">4-ZONE LINEAR RESONANT ACTUATORS • ESP32-S3 TINYML • 120 WORDS PER MINUTE</text>

  <!-- LEFT PANEL: Wearable Ring Chassis & Quadrant Actuator Layout -->
  <g transform="translate(35, 95)">
    <rect width="430" height="290" rx="8" fill="#180e29" stroke="#3d215c" stroke-width="1.5"/>
    <text x="16" y="22" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 3.0: RING CHASSIS &amp; QUADRANT LRA TOPOLOGY</text>

    <!-- Concentric Ring Cross-Section -->
    <circle cx="215" cy="145" r="90" fill="none" stroke="#3d215c" stroke-width="16"/>
    <circle cx="215" cy="145" r="90" fill="none" stroke="#c084fc" stroke-width="2"/>
    <circle cx="215" cy="145" r="75" fill="#0c0714" stroke="#00e5ff" stroke-width="1"/>
    <text x="215" y="148" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">FINGER BORE (18mm)</text>

    <!-- 4 Quadrant LRAs -->
    <!-- North: High Formants -->
    <rect x="200" y="45" width="30" height="18" rx="4" fill="#ff3366" filter="url(#r-glow)"/>
    <text x="215" y="38" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">LRA-N (Fricatives 4-8kHz)</text>

    <!-- South: Low Formants -->
    <rect x="200" y="225" width="30" height="18" rx="4" fill="#10b981" filter="url(#r-glow)"/>
    <text x="215" y="255" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">LRA-S (Vowels 200-800Hz)</text>

    <!-- West: Nasals / Glides -->
    <rect x="110" y="135" width="18" height="30" rx="4" fill="#00e5ff" filter="url(#r-glow)"/>
    <text x="95" y="130" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="end">LRA-W (Nasals)</text>

    <!-- East: Plosives / Stops -->
    <rect x="300" y="135" width="18" height="30" rx="4" fill="#f59e0b" filter="url(#r-glow)"/>
    <text x="325" y="130" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700">LRA-E (Plosives)</text>

    <text x="16" y="275" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Resonant Freq f_0 = 175 Hz • Response Latency under 12 ms • Skin Mechanoreceptor Coupling</text>
  </g>

  <!-- RIGHT PANEL TOP: Audio-to-Phoneme Encoding Pipeline -->
  <g transform="translate(485, 95)">
    <rect width="440" height="145" rx="8" fill="#180e29" stroke="#3d215c" stroke-width="1.5"/>
    <text x="16" y="20" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 3.1: REAL-TIME TINYML PHONETIC ENCODING PIPELINE</text>

    <!-- Step Boxes -->
    <rect x="25" y="40" width="85" height="55" rx="6" fill="#0f091a" stroke="#00e5ff" stroke-width="1"/>
    <text x="67" y="60" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">MIC AUDIO</text>
    <text x="67" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">16kHz 16-bit</text>

    <path d="M 110 67 H 130" stroke="#c084fc" stroke-width="1.5"/>

    <rect x="130" y="40" width="85" height="55" rx="6" fill="#0f091a" stroke="#f59e0b" stroke-width="1"/>
    <text x="172" y="60" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">MFCC FILTER</text>
    <text x="172" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">13 Cepstrals</text>

    <path d="M 215 67 H 235" stroke="#c084fc" stroke-width="1.5"/>

    <rect x="235" y="40" width="85" height="55" rx="6" fill="#0f091a" stroke="#ff3366" stroke-width="1"/>
    <text x="277" y="60" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">ESP32 INT8</text>
    <text x="277" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Phoneme Map</text>

    <path d="M 320 67 H 340" stroke="#c084fc" stroke-width="1.5"/>

    <rect x="340" y="40" width="85" height="55" rx="6" fill="#0f091a" stroke="#10b981" stroke-width="1"/>
    <text x="382" y="60" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">4-LRA PULSE</text>
    <text x="382" y="75" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Skin Tactile</text>

    <text x="16" y="125" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8">Complete End-to-End Latency: 11.8 ms • Non-surgical sensory substitution for profound deafness</text>
  </g>

  <!-- RIGHT PANEL BOTTOM: CAD Title Block -->
  <g transform="translate(485, 255)">
    <rect width="440" height="130" rx="8" fill="#180e29" stroke="#3d215c" stroke-width="1.5"/>
    
    <line x1="0" y1="30" x2="440" y2="30" stroke="#3d215c" stroke-width="1"/>
    <line x1="0" y1="65" x2="440" y2="65" stroke="#3d215c" stroke-width="1"/>
    <line x1="0" y1="100" x2="440" y2="100" stroke="#3d215c" stroke-width="1"/>
    <line x1="220" y1="0" x2="220" y2="100" stroke="#3d215c" stroke-width="1"/>

    <text x="14" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="85" y="20" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="234" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING NUMBER:</text>
    <text x="325" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-EDGE-ROBOT-003-REV-C</text>

    <text x="14" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPOS:</text>
    <text x="14" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">Haptic-Ring-Deaf-Communication</text>

    <text x="234" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">EMBEDDED LEAD:</text>
    <text x="325" y="52" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">LIKITH PALAKURTHI</text>

    <text x="14" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">COMPREHENSION:</text>
    <text x="105" y="86" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">120 WORDS / MINUTE</text>

    <text x="234" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">HARDWARE BILL OF MATERIALS:</text>
    <text x="385" y="86" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">18 USD</text>

    <text x="14" y="118" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">AFFORDABLE WEARABLE REPLACING 40,000 USD INVASIVE COCHLEAR IMPLANTS</text>
  </g>
</svg>