<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a000a"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  
    <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/>
    </pattern>
    <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-minor)"/>
      <path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/>
    </pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#F59E0B" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#F59E0B" font-size="11" font-weight="bold">PROJ-14 // AI SPECTRUM ANOMALY DETECTION — COGNITIVE RADIO EW</text>
  <text x="700" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#94a3b8" font-size="9">DRW-DEF-0014 | REV.A | DOMAIN: ELECTRONIC WARFARE</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#F59E0B" stroke-width="0.8" opacity="0.6"/>
<!-- LEFT: Spectrum display -->
<text x="220" y="66" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">COGNITIVE RADIO SPECTRUM WATERFALL</text>
<!-- Axes -->
<line x1="35" y1="70" x2="35" y2="380" stroke="#94a3b8" stroke-width="1"/>
<line x1="35" y1="380" x2="440" y2="380" stroke="#94a3b8" stroke-width="1"/>
<text x="237" y="398" class="m" fill="#94a3b8" font-size="8" text-anchor="middle">Frequency (0.1 — 6 GHz)</text>
<!-- Spectrum bars -->
<g>
  <!-- Occupied bands -->
  <rect x="60" y="250" width="40" height="130" fill="#003366" opacity="0.7"/><text x="80" y="245" class="m" fill="#38bdf8" font-size="7" text-anchor="middle">GSM</text>
  <rect x="110" y="180" width="50" height="200" fill="#002244" opacity="0.7"/><text x="135" y="175" class="m" fill="#38bdf8" font-size="7" text-anchor="middle">3G</text>
  <rect x="175" y="200" width="60" height="180" fill="#003355" opacity="0.7"/><text x="205" y="195" class="m" fill="#38bdf8" font-size="7" text-anchor="middle">WiFi</text>
  <rect x="255" y="220" width="55" height="160" fill="#002244" opacity="0.7"/><text x="282" y="215" class="m" fill="#38bdf8" font-size="7" text-anchor="middle">LTE</text>
  <rect x="330" y="280" width="45" height="100" fill="#003366" opacity="0.7"/><text x="352" y="275" class="m" fill="#38bdf8" font-size="7" text-anchor="middle">5G</text>
  <!-- Anomalous signals (highlighted) -->
  <rect x="145" y="130" width="25" height="250" fill="#FF3366" opacity="0.7" filter="url(#glow)"/><text x="157" y="125" class="m" fill="#FF3366" font-size="7" text-anchor="middle">ANOM</text>
  <rect x="295" y="160" width="25" height="220" fill="#FF6B00" opacity="0.7" filter="url(#glow)"/><text x="307" y="155" class="m" fill="#FF6B00" font-size="7" text-anchor="middle">ANOM</text>
  <rect x="390" y="200" width="30" height="180" fill="#c084fc" opacity="0.6" filter="url(#glow)"/>
  <text x="405" y="195" class="m" fill="#c084fc" font-size="7" text-anchor="middle">UNK</text>
</g>
<!-- Annotation boxes -->
<rect x="130" y="82" width="80" height="38" fill="none" stroke="#FF3366" stroke-width="1.2" stroke-dasharray="4,2"/>
<text x="170" y="97" class="m" fill="#FF3366" font-size="6.5" text-anchor="middle">Rogue</text>
<text x="170" y="107" class="m" fill="#FF3366" font-size="6.5" text-anchor="middle">transmitter</text>
<rect x="280" y="112" width="80" height="38" fill="none" stroke="#FF6B00" stroke-width="1.2" stroke-dasharray="4,2"/>
<text x="320" y="127" class="m" fill="#FF6B00" font-size="6.5" text-anchor="middle">Hopping</text>
<text x="320" y="137" class="m" fill="#FF6B00" font-size="6.5" text-anchor="middle">jammer</text>
<!-- Divider -->
<line x1="455" y1="48" x2="455" y2="412" stroke="#F59E0B" stroke-width="0.8" opacity="0.4"/>
<!-- RIGHT: AI pipeline -->
<text x="700" y="68" class="s" fill="#F59E0B" font-size="11" font-weight="bold" text-anchor="middle">COGNITIVE RADIO AI PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#F59E0B" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="40" rx="4" fill="#1a0a00" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="103" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">SDR INPUT: IQ samples @ 100 MSPS — wideband spectrum scan</text>
<text x="700" y="117" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Fast Fourier Transform — power spectral density estimation</text>
<rect x="490" y="133" width="420" height="40" rx="4" fill="#100a00" stroke="#FF6B00" stroke-width="1.2"/>
<text x="700" y="151" class="m" fill="#FF6B00" font-size="9" text-anchor="middle">FEATURE EXTRACTION: Cyclostationary + wavelet</text>
<text x="700" y="165" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Modulation signature, bandwidth, duty cycle, hop pattern</text>
<rect x="490" y="181" width="420" height="40" rx="4" fill="#0d1a00" stroke="#c084fc" stroke-width="1.5"/>
<text x="700" y="199" class="m" fill="#c084fc" font-size="9" text-anchor="middle">AUTOENCODER ANOMALY DETECTION</text>
<text x="700" y="213" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Reconstruction error threshold — learns normal spectrum footprint</text>
<rect x="490" y="229" width="420" height="40" rx="4" fill="#001500" stroke="#10B981" stroke-width="1.2"/>
<text x="700" y="247" class="m" fill="#10B981" font-size="9" text-anchor="middle">WAVEFORM CLASSIFICATION: CNN + LSTM</text>
<text x="700" y="261" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">8 signal classes: AM/FM/BPSK/QPSK/8PSK/16QAM/64QAM/rogue</text>
<rect x="490" y="277" width="420" height="40" rx="4" fill="#200000" stroke="#FF3366" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="295" class="m" fill="#FF3366" font-size="9" text-anchor="middle" font-weight="bold">ALERT: ANOMALY FLAGGED + GEO-LOCATE</text>
<text x="700" y="309" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Frequency, bandwidth, modulation, TDOA bearing — response dispatched</text>
<!-- Bottom -->
<rect x="475" y="330" width="460" height="75" fill="#080d18" rx="4" stroke="#F59E0B" stroke-width="1"/>
<text x="490" y="347" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">SYSTEM PERFORMANCE</text>
<text x="490" y="364" class="m" fill="#94a3b8" font-size="8">Anomaly detection AUC: 0.991   |   Classification accuracy: 95.8%</text>
<text x="490" y="379" class="m" fill="#94a3b8" font-size="8">SNR range: -10 to +30 dB   |   Waveform classes: 8   |   Latency: 4.1 ms</text>
<text x="490" y="394" class="m" fill="#c084fc" font-size="8">Architecture: Autoencoder + CNN + LSTM hybrid | Real-time cognitive radio</text>
</svg>