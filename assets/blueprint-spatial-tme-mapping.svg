<g fill="#00E5FF" opacity="0.6">
  <polygon points="140,155 155,145 170,155 170,175 155,185 140,175"/><polygon points="255,155 270,145 285,155 285,175 270,185 255,175"/>
  <polygon points="145,200 160,190 175,200 175,220 160,230 145,220"/><polygon points="255,230 270,220 285,230 285,250 270,260 255,250"/>
</g>
