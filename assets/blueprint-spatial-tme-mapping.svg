<g fill="#F59E0B" opacity="0.5">
  <polygon points="100,180 115,170 130,180 130,200 115,210 100,200"/><polygon points="300,175 315,165 330,175 330,195 315,205 300,195"/>
  <polygon points="115,240 130,230 145,240 145,260 130,270 115,260"/><polygon points="285,250 300,240 315,250 315,270 300,280 285,270"/>
</g>
<!-- Vasculature (green) -->
<path d="M200 130 Q220 135 240 130 Q260 150 255 175" fill="none" stroke="#10B981" stroke-width="3" filter="url(#glow)"/>
<text x="263" y="148" class="m" fill="#10B981" font-size="7">vessel</text>
<!-- Legend -->
<rect x="50" y="315" width="12" height="12" fill="#FF3366" rx="2"/><text x="68" y="325" class="m" fill="#94a3b8" font-size="7.5">Tumor core</text>
<rect x="140" y="315" width="12" height="12" fill="#00E5FF" rx="2"/><text x="158" y="325" class="m" fill="#94a3b8" font-size="7.5">Immune TIL</text>
<rect x="230" y="315" width="12" height="12" fill="#F59E0B" rx="2"/><text x="248" y="325" class="m" fill="#94a3b8" font-size="7.5">Stroma</text>
<rect x="310" y="315" width="12" height="12" fill="#10B981" rx="2"/><text x="328" y="325" class="m" fill="#94a3b8" font-size="7.5">Vasculature</text>
<text x="220" y="380" class="m" fill="#c084fc" font-size="8" text-anchor="middle">Spatial deconvolution: 4-cell-type TME resolved to 55 um spot resolution</text>
<!-- RIGHT: Pipeline + metrics -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">SPATIAL TME ANALYSIS PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="35" rx="3" fill="#100020" stroke="#c084fc" stroke-width="1.5"/>
<text x="700" y="103" class="m" fill="#c084fc" font-size="9" text-anchor="middle">INPUT: 10X Visium slide — 4992 spots x 33k genes</text>
<text x="700" y="113" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">H&amp;E image co-registered — breast + colon cancer cohorts</text>
<rect x="490" y="127" width="420" height="35" rx="3" fill="#0d0020" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="145" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">SPATIAL CLUSTERING: SpatialDE + BANKSY</text>
<text x="700" y="155" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Neighborhood-aware dimensionality reduction + cell-type clustering</text>
<rect x="490" y="169" width="420" height="35" rx="3" fill="#001020" stroke="#00E5FF" stroke-width="1.2"/>
<text x="700" y="187" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">DECONVOLUTION: CARD + SPOTlight reference-free</text>
<text x="700" y="197" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Cell-type proportion per spot — scRNA-seq reference atlas</text>
<rect x="490" y="211" width="420" height="35" rx="3" fill="#001020" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="229" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">OUTPUT: TME ecosystem map — cell co-localization score</text>
<text x="700" y="239" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">TIL infiltration index predicts immunotherapy response (AUC 0.87)</text>
<rect x="475" y="263" width="460" height="130" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="280" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">SPATIAL METRICS</text>
<g class="m" font-size="8">
  <text x="490" y="297" fill="#94a3b8">Platform:</text><text x="620" y="297" fill="#c084fc">10X Visium — 55um spot resolution</text>
  <text x="490" y="314" fill="#94a3b8">Spots:</text><text x="620" y="314" fill="#94a3b8">4992 per slide — up to 5000 cells/spot</text>
  <text x="490" y="331" fill="#94a3b8">Cell types:</text><text x="620" y="331" fill="#F59E0B">8 TME cell types resolved</text>
  <text x="490" y="348" fill="#94a3b8">Deconvolution:</text><text x="620" y="348" fill="#10B981">CARD RMSE 0.038 (benchmark best)</text>
  <text x="490" y="365" fill="#94a3b8">Spatial genes:</text><text x="620" y="365" fill="#38bdf8">2847 spatially variable genes (SpatialDE)</text>
  <text x="490" y="382" fill="#94a3b8">Clinical outcome:</text><text x="620" y="382" fill="#FF3366">TIL density AUC 0.87 — ICI response</text>
</g>
</svg>