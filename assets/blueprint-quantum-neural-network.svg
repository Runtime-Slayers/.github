<circle cx="275" cy="210" r="5" fill="#F59E0B"/><line x1="275" y1="210" x2="275" y2="260" stroke="#F59E0B" stroke-width="1.5"/>
<circle cx="275" cy="260" r="10" fill="none" stroke="#F59E0B" stroke-width="1.5"/><line x1="265" y1="260" x2="285" y2="260" stroke="#F59E0B" stroke-width="1.5"/>
