<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-label="Hypersonic Plasma Sheath Quantum WKB Tunneling Blueprint">
  <defs>
    <linearGradient id="q-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#090e1c"/>
    </linearGradient>
    <pattern id="q-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e3a5f" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <pattern id="q-grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#132338" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <marker id="q-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#38bdf8"/></marker>
    <marker id="q-arr-rose" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0 0, 6 3, 0 6" fill="#fb7185"/></marker>
  </defs>

  <rect width="960" height="520" fill="url(#q-bg)"/>
  <rect width="960" height="520" fill="url(#q-grid-minor)"/>
  <rect width="960" height="520" fill="url(#q-grid-major)"/>
  <rect width="960" height="520" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Technical Border -->
  <rect x="15" y="15" width="930" height="490" fill="none" stroke="#e11d48" stroke-width="1.2" opacity="0.6"/>
  <path d="M 10 15 H 20 M 15 10 V 20" stroke="#fb7185" stroke-width="1.5"/>
  <path d="M 940 15 H 950 M 945 10 V 20" stroke="#fb7185" stroke-width="1.5"/>
  <path d="M 10 505 H 20 M 15 500 V 510" stroke="#fb7185" stroke-width="1.5"/>
  <path d="M 940 505 H 950 M 945 500 V 510" stroke="#fb7185" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="44" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • EXTREME AERO-PHYSICS BLUEPRINT</text>
  <text x="35" y="66" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800">HYPERSONIC PLASMA SHEATH QUANTUM WKB TUNNELING RESONATOR</text>
  <text x="35" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">MACH 8-25 RE-ENTRY • PLASMA RF PENETRATION • 23 dB ATTENUATION REDUCTION</text>

  <!-- LEFT PANEL: Nose Cone Re-entry Shockwave & Sheath Geometry -->
  <g transform="translate(40, 105)">
    <rect width="420" height="340" rx="8" fill="#091326" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="24" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 2.0: HYPERSONIC BOW SHOCK &amp; SHEATH BOUNDARY</text>

    <!-- Hypersonic Nose Cone Body -->
    <path d="M 380 60 L 120 170 L 380 280 Z" fill="#0d1b33" stroke="#38bdf8" stroke-width="2"/>
    <text x="240" y="175" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">VEHICLE HULL</text>
    <text x="240" y="190" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Carbon-Carbon TPS</text>

    <!-- Detached Hypersonic Bow Shockwave -->
    <path d="M 400 30 C 180 60, 50 120, 50 170 C 50 220, 180 280, 400 310" 
          fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="8 4" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
    </path>
    <text x="55" y="130" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">BOW SHOCK (Mach 12)</text>

    <!-- High-Density Ionized Plasma Sheath Layer -->
    <path d="M 400 45 C 200 70, 75 130, 75 170 C 75 210, 200 270, 400 295 L 380 280 L 120 170 L 380 60 Z" 
          fill="#f43f5e" opacity="0.18"/>
    <text x="115" y="100" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="8">IONIZED SHEATH</text>
    <text x="115" y="112" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="7">n_e > 10^20 m^-3</text>

    <!-- Antenna Array on Vehicle Surface -->
    <rect x="230" y="115" width="25" height="10" fill="#38bdf8" stroke="#f8fafc" stroke-width="1"/>
    <line x1="242" y1="115" x2="160" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="260" y="123" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">RF TUNNELING EMITTER</text>

    <text x="16" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Plasma Frequency omega_p = 56.4 GHz • Standard S-band/X-band normally blocked 100%</text>
  </g>

  <!-- RIGHT PANEL TOP: Semiclassical Quantum Barrier Tunneling Curve -->
  <g transform="translate(480, 105)">
    <rect width="440" height="170" rx="8" fill="#091326" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="22" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 2.1: WKB POTENTIAL BARRIER &amp; WAVE TRANSMISSION</text>

    <!-- Coordinate Axes -->
    <line x1="40" y1="135" x2="390" y2="135" stroke="#475569" stroke-width="1" marker-end="url(#q-arr)"/>
    <line x1="40" y1="135" x2="40" y2="35" stroke="#475569" stroke-width="1" marker-end="url(#q-arr)"/>
    <text x="390" y="148" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DISTANCE x</text>
    <text x="25" y="35" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">V(x)</text>

    <!-- Parabolic Potential Barrier Curve representing Plasma Density -->
    <path d="M 120 135 Q 210 35, 300 135" fill="none" stroke="#fb7185" stroke-width="2.5"/>
    <text x="210" y="55" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">BARRIER V_max</text>

    <!-- Incident Wave Packet -->
    <path d="M 40 95 Q 55 75, 70 95 T 100 95 T 120 95" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">INCIDENT WAVE</text>

    <!-- Tunneling Probability Decay through Barrier -->
    <path d="M 120 95 Q 210 125, 300 120" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="4 2"/>
    <text x="210" y="115" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">WKB DECAY exp(-2 gamma)</text>

    <!-- Transmitted Wave Packet -->
    <path d="M 300 120 Q 315 110, 330 120 T 360 120 T 385 120" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="345" y="105" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">TRANSMITTED</text>

    <text x="16" y="158" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="8">Transmission Coefficient T = exp(-2 int sqrt(2m(V-E)) dx) • Telemetry maintained</text>
  </g>

  <!-- RIGHT PANEL BOTTOM: Official CAD Title Block -->
  <g transform="translate(480, 290)">
    <rect width="440" height="155" rx="8" fill="#091326" stroke="#1e3a5f" stroke-width="1.5"/>
    
    <line x1="0" y1="35" x2="440" y2="35" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="0" y1="75" x2="440" y2="75" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="0" y1="115" x2="440" y2="115" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="220" y1="0" x2="220" y2="115" stroke="#1e3a5f" stroke-width="1"/>

    <text x="14" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="85" y="22" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="234" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING NUMBER:</text>
    <text x="325" y="22" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-AERO-PHYS-002-REV-B</text>

    <text x="14" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPOS:</text>
    <text x="14" y="68" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">plasma-cpan &amp; Plasma-Sheath-Comm</text>

    <text x="234" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">LEAD ARCHITECT:</text>
    <text x="325" y="58" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">B. RAJENDRA REDDY</text>

    <text x="14" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">BENCHMARK RESULT:</text>
    <text x="110" y="98" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">23 dB ATTENUATION DROP</text>

    <text x="234" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">VALIDATION REGIME:</text>
    <text x="330" y="98" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">MACH 8 - 25 FLIGHT</text>

    <text x="14" y="136" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">FIRST-PRINCIPLES QUANTUM WAVE MECHANICS APPLIED TO RE-ENTRY TELEMETRY</text>
  </g>
</svg>