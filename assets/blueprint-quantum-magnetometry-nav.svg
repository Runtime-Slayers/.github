<rect x="55" y="295" width="300" height="90" fill="#001020" stroke="#00E5FF" stroke-width="1" rx="3"/>
<text x="205" y="311" class="m" fill="#00E5FF" font-size="8.5" text-anchor="middle">ODMR SPECTRUM — Zeeman splitting</text>
<line x1="70" y1="365" x2="340" y2="365" stroke="#94a3b8" stroke-width="1"/>
<line x1="70" y1="320" x2="70" y2="365" stroke="#94a3b8" stroke-width="1"/>
<!-- ODMR dip profile -->
<path d="M75,340 L130,340 Q145,318 160,340 L180,340 Q195,318 210,340 L340,340" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#glow)"/>
<text x="147" y="316" class="m" fill="#F59E0B" font-size="7">f1</text>
<text x="197" y="316" class="m" fill="#F59E0B" font-size="7">f2</text>
<text x="205" y="378" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Split = 2*gamma_e*B = femtoTesla sensitivity</text>
<!-- RIGHT: Navigation pipeline -->
<text x="700" y="68" class="s" fill="#00E5FF" font-size="11" font-weight="bold" text-anchor="middle">QUANTUM NAVIGATION PIPELINE</text>
