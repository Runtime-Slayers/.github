<text x="35" y="154" class="m" fill="#10B981" font-size="7.5">laser</text>
<!-- Fluorescence output -->
<line x1="190" y1="80" x2="190" y2="55" stroke="#FF3366" stroke-width="2" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></line>
<text x="200" y="52" class="m" fill="#FF3366" font-size="7.5">637nm PL</text>
