<path d="M95 145 Q85 120 100 100" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,2"/>
<path d="M95 145 Q80 145 80 130" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,2"/>
<text x="55" y="105" class="m" fill="#F59E0B" font-size="7.5">B-field</text>
