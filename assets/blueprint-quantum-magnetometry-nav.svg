<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#000d1a"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#00E5FF" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#00E5FF" font-size="11" font-weight="bold">PROJ-18 // QUANTUM BIOLOGICAL MAGNETOMETRY — GPS-DENIED NAV</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-QUANTUM-0018 | REV.A | QUANTUM SENSING</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#00E5FF" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#00E5FF" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">NV DIAMOND QUANTUM MAGNETOMETER — GPS-DENIED NAV</text>
<!-- NV center diamond lattice -->
<rect x="90" y="80" width="260" height="200" rx="8" fill="#001020" stroke="#00E5FF" stroke-width="1.5"/>
<text x="220" y="98" class="m" fill="#00E5FF" font-size="8.5" text-anchor="middle">DIAMOND CRYSTAL — NV CENTER</text>
<!-- Diamond lattice nodes -->
<g fill="#94a3b8" stroke="none">
  <circle cx="130" cy="130" r="6"/><circle cx="170" cy="110" r="6"/><circle cx="210" cy="130" r="6"/>
  <circle cx="250" cy="110" r="6"/><circle cx="290" cy="130" r="6"/>
  <circle cx="150" cy="160" r="6"/><circle cx="190" cy="145" r="6"/>
  <circle cx="230" cy="160" r="6"/><circle cx="270" cy="145" r="6"/>
  <circle cx="130" cy="190" r="6"/><circle cx="170" cy="175" r="6"/>
  <circle cx="210" cy="190" r="6"/><circle cx="250" cy="175" r="6"/><circle cx="290" cy="190" r="6"/>
  <circle cx="150" cy="220" r="6"/><circle cx="190" cy="210" r="6"/><circle cx="230" cy="220" r="6"/>
</g>
<!-- NV defect center (highlighted) -->
<circle cx="190" cy="145" r="12" fill="#00E5FF" opacity="0.3" filter="url(#glow)"/>
<circle cx="190" cy="145" r="6" fill="#00E5FF" filter="url(#glow)"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></circle>
