<rect x="490" y="85" width="420" height="38" rx="3" fill="#001525" stroke="#00E5FF" stroke-width="1.5"/>
<text x="700" y="103" class="m" fill="#00E5FF" font-size="9" text-anchor="middle" font-weight="bold">NV DIAMOND SENSOR: femtoTesla B-field measurement</text>
<text x="700" y="116" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">ODMR: optically detected magnetic resonance — spin-state readout</text>
<rect x="490" y="131" width="420" height="38" rx="3" fill="#0a1a00" stroke="#10B981" stroke-width="1.2"/>
<text x="700" y="149" class="m" fill="#10B981" font-size="9" text-anchor="middle">RADICAL-PAIR MECHANISM: quantum coherence navigation</text>
<text x="700" y="162" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Bio-inspired: bird compass cryptochrome radical-pair spin dynamics</text>
<rect x="490" y="177" width="420" height="38" rx="3" fill="#100a00" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="195" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">GEOMAGNETIC MAP MATCHING</text>
<text x="700" y="208" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">IGRF model + measured B-vector — particle filter position estimate</text>
<rect x="490" y="223" width="420" height="38" rx="3" fill="#001020" stroke="#c084fc" stroke-width="1.2"/>
<text x="700" y="241" class="m" fill="#c084fc" font-size="9" text-anchor="middle">AI FUSION: Quantum + INS + odometry</text>
<text x="700" y="254" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Extended Kalman filter — quantum sensor + IMU data fusion</text>
<rect x="490" y="269" width="420" height="38" rx="3" fill="#150020" stroke="#FF3366" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="287" class="m" fill="#FF3366" font-size="9" text-anchor="middle" font-weight="bold">OUTPUT: Position estimate — GPS-DENIED navigation</text>
<text x="700" y="300" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Accuracy: ±50m over 100 km — no GPS signal required</text>
<!-- Bottom metrics -->
<rect x="475" y="320" width="460" height="85" fill="#080d18" rx="4" stroke="#00E5FF" stroke-width="1"/>
<text x="490" y="337" class="m" fill="#00E5FF" font-size="8.5" font-weight="bold">SENSOR SPECIFICATIONS</text>
<text x="490" y="354" class="m" fill="#94a3b8" font-size="8">B-field sensitivity: 1 femtoTesla / sqrt(Hz)   |   Diamond: CVD NV ensemble</text>
<text x="490" y="369" class="m" fill="#94a3b8" font-size="8">ODMR linewidth: 1 MHz   |   Zeeman split: 2.8 MHz/mT   |   Temp: 293K (room)</text>
<text x="490" y="384" class="m" fill="#94a3b8" font-size="8">Navigation accuracy: 50m/100km GPS-denied   |   Power: 2W (compact)</text>
<text x="490" y="399" class="m" fill="#F59E0B" font-size="8">Application: submarine, UAV, spacecraft — any GPS-denied environment</text>
