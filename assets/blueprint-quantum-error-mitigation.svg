<rect x="6" y="6" width="948" height="408" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#00E5FF" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
