  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#00E5FF" font-size="10" font-weight="bold">PROJ-50 // QUANTUM ERROR MITIGATION — ZERO-NOISE EXTRAPOLATION</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-QUANTUM-0050 | REV.A | QUANTUM COMPUTING</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#00E5FF" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#00E5FF" stroke-width="0.8" opacity="0.4"/>
<text x="220" y="66" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">QUANTUM ERROR MITIGATION — ZNE + PEC</text>
    <rect x="35" y="80" width="400" height="295" rx="5" fill="#001020" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="220" y="100" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">ZNE EXTRAPOLATION — ENERGY vs NOISE SCALE</text>
    <!-- Axes -->
    <line x1="65" y1="280" x2="420" y2="280" stroke="#94a3b8" stroke-width="1"/>
    <line x1="65" y1="130" x2="65" y2="280" stroke="#94a3b8" stroke-width="1"/>
    <text x="237" y="296" class="m" fill="#94a3b8" font-size="8" text-anchor="middle">Noise scale factor lambda</text>
    <text x="50" y="208" class="m" fill="#94a3b8" font-size="8" text-anchor="middle" transform="rotate(-90 50 208)">Energy E (Ha)</text>
    <!-- Noise-scaled data points -->
    <circle cx="110" cy="220" r="5" fill="#00E5FF"/><circle cx="180" cy="235" r="5" fill="#00E5FF"/>
    <circle cx="255" cy="248" r="5" fill="#00E5FF"/><circle cx="330" cy="260" r="5" fill="#00E5FF"/>
    <!-- ZNE extrapolation line -->
    <path d="M65 205 Q110 212 180 228 Q255 244 330 258 Q380 267 420 275" fill="none" stroke="#00E5FF" stroke-width="2"/>
    <!-- Exact energy (dashed) -->
    <line x1="65" y1="205" x2="420" y2="205" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#glow)"/>
    <text x="80" y="200" class="m" fill="#10B981" font-size="7.5">Exact: -1.1361 Ha</text>
    <!-- Unmitigated point -->
    <circle cx="110" cy="250" r="5" fill="#FF3366"/>
    <text x="115" y="248" class="m" fill="#FF3366" font-size="7.5">Unmit.</text>
    <!-- Extrapolated = 0 marker -->
    <circle cx="65" cy="207" r="7" fill="#F59E0B" filter="url(#glow)"/>
    <text x="80" y="218" class="m" fill="#F59E0B" font-size="7.5">ZNE est.</text>
    <!-- Lambda markers -->
    <text x="110" y="293" class="m" fill="#94a3b8" font-size="7.5">1x</text><text x="180" y="293" class="m" fill="#94a3b8" font-size="7.5">2x</text>
    <text x="255" y="293" class="m" fill="#94a3b8" font-size="7.5">3x</text><text x="330" y="293" class="m" fill="#94a3b8" font-size="7.5">4x</text>
    <!-- IBM device schematic -->
    <rect x="55" y="310" width="360" height="55" fill="#001020" rx="3"/>
    <text x="235" y="325" class="m" fill="#00E5FF" font-size="8" text-anchor="middle">IBM QUANTUM — 27-QUBIT HEAVY-HEX LAYOUT</text>
    <!-- Qubit nodes (simplified) -->
    <g fill="#00E5FF" opacity="0.7">
      <circle cx="80" cy="348" r="6"/><circle cx="110" cy="340" r="6"/><circle cx="140" cy="348" r="6"/>
