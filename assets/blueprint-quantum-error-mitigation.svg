      <circle cx="260" cy="348" r="6"/><circle cx="290" cy="340" r="6"/><circle cx="320" cy="348" r="6"/>
    </g>
    <g stroke="#00E5FF" stroke-width="0.8" opacity="0.5">
      <line x1="86" y1="348" x2="104" y2="342"/><line x1="116" y1="342" x2="134" y2="346"/>
      <line x1="146" y1="348" x2="164" y2="342"/><line x1="176" y1="342" x2="194" y2="346"/>
      <line x1="206" y1="348" x2="224" y2="342"/><line x1="236" y1="342" x2="254" y2="346"/>
      <line x1="266" y1="348" x2="284" y2="342"/><line x1="296" y1="342" x2="314" y2="346"/>
    </g>
    <text x="220" y="395" class="m" fill="#00E5FF" font-size="8" text-anchor="middle">ZNE reduces VQE H2 error by 80% on ibmq_montreal</text>
<!-- RIGHT PANEL -->
<text x="700" y="68" class="s" fill="#00E5FF" font-size="11" font-weight="bold" text-anchor="middle">SYSTEM ARCHITECTURE &amp; METRICS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#00E5FF" stroke-width="0.5" opacity="0.4"/>
<!-- Description block -->
<rect x="490" y="82" width="440" height="200" rx="5" fill="#080d18" stroke="#00E5FF" stroke-width="1"/>
<text x="710" y="100" class="m" fill="#00E5FF" font-size="9" text-anchor="middle" font-weight="bold">TECHNICAL OVERVIEW</text>
<line x1="490" y1="108" x2="930" y2="108" stroke="#00E5FF" stroke-width="0.5"/>
<text x="500" y="130" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">Zero-noise extrapolation (ZNE) and probabilistic error cancellation (PEC) for qu</text>
<text x="500" y="148" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">antum circuit noise mitigation on NISQ hardware. Demonstrated on IBM Quantum dev</text>
<text x="500" y="166" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">ices (ibmq_montreal, 27 qubits). VQE ground state energy error reduced by 80% wi</text>
<text x="500" y="184" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">th ZNE. Pulse-level noise amplification via identity insertion. Clifford circuit</text>
<text x="500" y="202" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> benchmark. Mitigation techniques applied to: Bernstein-Vazirani, GHZ state, VQE</text>
<text x="500" y="220" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> H2 molecule. Error mitigated quasi-probability decomposition PEC implemented wi</text>
<text x="500" y="238" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">th Mitiq library.</text>
<text x="500" y="256" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="274" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<!-- Metrics table -->
<rect x="490" y="295" width="440" height="110" rx="4" fill="#080d18" stroke="#00E5FF" stroke-width="1"/>
<text x="710" y="310" class="m" fill="#00E5FF" font-size="8.5" text-anchor="middle" font-weight="bold">KEY METRICS</text>
<line x1="490" y1="316" x2="930" y2="316" stroke="#00E5FF" stroke-width="0.5"/>
<text x="490" y="305" class="m" fill="#94a3b8" font-size="8">Hardware</text><text x="660" y="305" class="m" fill="#00E5FF" font-size="8">IBM Quantum ibmq_montreal (27q)</text>
<text x="490" y="322" class="m" fill="#94a3b8" font-size="8">Mitigation</text><text x="660" y="322" class="m" fill="#c084fc" font-size="8">ZNE + PEC (Mitiq library)</text>
<text x="490" y="339" class="m" fill="#94a3b8" font-size="8">Energy error</text><text x="660" y="339" class="m" fill="#10B981" font-size="8">-80% VQE H2 molecule</text>
<text x="490" y="356" class="m" fill="#94a3b8" font-size="8">Circuit type</text><text x="660" y="356" class="m" fill="#94a3b8" font-size="8">VQE, Bernstein-Vazirani, GHZ</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">Noise model</text><text x="660" y="373" class="m" fill="#F59E0B" font-size="8">Depolarizing + CNOT errors</text>
<text x="490" y="390" class="m" fill="#94a3b8" font-size="8">ZNE method</text><text x="660" y="390" class="m" fill="#38bdf8" font-size="8">Identity insertion pulse-level</text>

