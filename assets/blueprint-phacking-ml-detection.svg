  <!-- Reference Line: p = 0.05 Boundary -->
  <line x1="180" y1="0" x2="180" y2="180" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="180" y="-5" class="m" fill="#FF3366" font-size="7.5" text-anchor="middle" font-weight="bold">p = 0.05 Threshold</text>

  <!-- Genuine Right-skewed Evidentiary Curve (Green dashed) -->
  <path d="M10 20 Q40 90 90 140 Q140 165 240 175" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="50" y="50" class="m" fill="#10B981" font-size="6.5">True Evidentiary Value</text>

  <!-- P-Hacked Distribution: Massive Caliper Spike just under 0.05 -->
  <!-- Bars -->
  <rect x="15" y="150" width="20" height="30" fill="#00E5FF" opacity="0.7"/>
