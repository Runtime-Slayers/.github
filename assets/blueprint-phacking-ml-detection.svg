  <rect x="65" y="160" width="20" height="20" fill="#00E5FF" opacity="0.7"/>
  <rect x="90" y="162" width="20" height="18" fill="#00E5FF" opacity="0.7"/>
  <rect x="115" y="155" width="20" height="25" fill="#00E5FF" opacity="0.7"/>
  <rect x="140" y="110" width="20" height="70" fill="#F59E0B" opacity="0.8"/>
  
  <!-- THE SUSPICIOUS CLIFF AT 0.041 - 0.049 -->
  <rect x="162" y="30" width="18" height="150" fill="#FF3366" filter="url(#glow)"/>
  <text x="171" y="20" class="m" fill="#FF3366" font-size="7" text-anchor="middle" font-weight="bold">SPIKE: p=0.048</text>

  <!-- Drop immediately above 0.05 -->
