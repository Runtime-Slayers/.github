<g class="m" font-size="8">
  <text x="490" y="282" fill="#94a3b8">Stage</text><text x="560" y="282" fill="#94a3b8">Mechanism</text><text x="700" y="282" fill="#94a3b8">Dean No.</text><text x="800" y="282" fill="#94a3b8">Plasma purity</text>
  <line x1="475" y1="287" x2="935" y2="287" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="490" y="303" fill="#00E5FF">S1</text><text x="560" y="303" fill="#94a3b8">Primary curved</text><text x="700" y="303" fill="#F59E0B">De=15</text><text x="800" y="303" fill="#10B981">82%</text>
  <text x="490" y="320" fill="#00E5FF">S2</text><text x="560" y="320" fill="#94a3b8">Spiral DLD</text><text x="700" y="320" fill="#F59E0B">De=12</text><text x="800" y="320" fill="#10B981">94%</text>
  <text x="490" y="337" fill="#00E5FF">S3</text><text x="560" y="337" fill="#94a3b8">Membrane filter</text><text x="700" y="337" fill="#F59E0B">—</text><text x="800" y="337" fill="#10B981">97.5%</text>
  <text x="490" y="354" fill="#FF3366">S4</text><text x="560" y="354" fill="#94a3b8">Secondary Dean vortex</text><text x="700" y="354" fill="#FF3366">De2=8</text><text x="800" y="354" fill="#10B981" font-weight="bold">99.8%</text>
  <text x="490" y="375" fill="#10B981">Innovation: secondary Dean vortex reduces contamination from 6% to 0.2%</text>
  <text x="490" y="392" fill="#94a3b8">Throughput: 1 mL/min | Channel width: 200 um | Depth: 50 um | PDMS chip</text>
