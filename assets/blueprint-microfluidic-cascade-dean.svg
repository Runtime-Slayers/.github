<defs><linearGradient id="presgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF3366" stop-opacity="0.9"/><stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6"/><stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/></linearGradient></defs>
<rect x="500" y="115" width="400" height="30" fill="url(#presgrad)" rx="2"/>
