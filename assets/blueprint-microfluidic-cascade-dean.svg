  <circle cx="300" cy="175" r="3"/><circle cx="320" cy="175" r="3"/><circle cx="340" cy="175" r="3"/>
  <circle cx="300" cy="195" r="3"/><circle cx="320" cy="195" r="3"/><circle cx="340" cy="195" r="3"/>
</g>
