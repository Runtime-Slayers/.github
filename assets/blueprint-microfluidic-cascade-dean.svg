<text x="30" y="32" class="m" fill="#10B981" font-size="11" font-weight="bold">PROJ-30 // MICROFLUIDIC DEVICE PART 2 — 4-STAGE CASCADE + DEAN VORTICES</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-BIO-0030 | REV.A | MICROFLUIDICS</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>

