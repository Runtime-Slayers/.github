<text x="355" y="318" class="m" fill="#10B981" font-size="8" text-anchor="middle">WASTE + DEBRIS</text>
<text x="355" y="330" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Dean2 reject</text>
<text x="220" y="395" class="m" fill="#10B981" font-size="8" text-anchor="middle">Secondary Dean vortices reduce contamination by 99.7% (vs 94% single stage)</text>
