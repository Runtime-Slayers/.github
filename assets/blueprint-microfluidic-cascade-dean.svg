<text x="650" y="158" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">S2</text>
<text x="750" y="158" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">S3</text>
<text x="850" y="158" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">S4</text>
