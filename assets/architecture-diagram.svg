<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Runtime-Slayers Multi-Domain AI Engine Architecture</title>
  <desc id="arch-desc">Architecture diagram showing sensory telemetry flowing through mathematical invariant engines, processed by the Core Research Council AI surrogates, and outputting to Aerospace, Defense, Electronics, and Biomedical domains.</desc>
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purple-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="rose-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="emerald-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arr-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c084fc"/>
    </marker>
    <marker id="arr-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#34d399"/>
    </marker>
    
    <!-- Subtle dot grid pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/>
    </pattern>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="12" fill="url(#bg-grad)"/>
  <rect width="960" height="480" rx="12" fill="url(#dot-grid)"/>
  <rect width="960" height="480" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="480" y="36" fill="#f8fafc" font-size="18" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="0.05em">THE RUNTIME-SLAYERS MULTI-DOMAIN AI ENGINE</text>
  <text x="480" y="56" fill="#94a3b8" font-size="11" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Extracting Complex High-Level Results Across Natural, Mechanical &amp; Biological Systems</text>

  <!-- ==================== CONNECTORS (Drawn first for clean z-order) ==================== -->
  <!-- Col 1 to Col 2 (x: 216 -> 272) -->
  <path d="M 216 112 H 244 A 8 8 0 0 1 252 120 V 172 A 8 8 0 0 0 260 180 H 272" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)" opacity="0.85"/>
  <path d="M 216 180 H 272" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)" opacity="0.85"/>
  <path d="M 216 248 H 244 A 8 8 0 0 0 252 240 V 188 A 8 8 0 0 1 260 180 H 272" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)" opacity="0.85"/>
  <path d="M 216 316 H 244 A 8 8 0 0 1 252 324 V 348 A 8 8 0 0 0 260 356 H 272" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-cyan)" opacity="0.85"/>

  <!-- Col 2 to Col 3 (x: 464 -> 528) -->
  <path d="M 464 180 H 496 A 8 8 0 0 1 504 188 V 232 A 8 8 0 0 0 512 240 H 528" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-purple)" opacity="0.9"/>
  <path d="M 464 356 H 496 A 8 8 0 0 0 504 348 V 248 A 8 8 0 0 1 512 240 H 528" fill="none" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arr-purple)" opacity="0.9"/>

  <!-- Col 3 to Col 4 (x: 720 -> 768) -->
  <path d="M 720 220 H 744 A 8 8 0 0 0 752 212 V 112 A 8 8 0 0 1 760 104 H 768" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)" opacity="0.85"/>
  <path d="M 720 232 H 744 A 8 8 0 0 0 752 224 V 188 A 8 8 0 0 1 760 180 H 768" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)" opacity="0.85"/>
  <path d="M 720 248 H 744 A 8 8 0 0 1 752 256 V 268 A 8 8 0 0 0 760 276 H 768" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)" opacity="0.85"/>
  <path d="M 720 260 H 744 A 8 8 0 0 1 752 268 V 348 A 8 8 0 0 0 760 356 H 768" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)" opacity="0.85"/>
  <path d="M 720 272 H 740 A 8 8 0 0 1 748 280 V 420 A 8 8 0 0 0 756 428 H 768" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-emerald)" opacity="0.85"/>

