    <text x="56" y="314" fill="#f8fafc" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600">Molecular &amp; Imaging</text>
    <text x="56" y="330" fill="#94a3b8" font-size="10" font-family="'Segoe UI', sans-serif">TCIA MRI, PDB &amp; CITE-seq</text>
  </g>

  <!-- ==================== COLUMN 2: MATHEMATICAL INVARIANCE ENGINES ==================== -->
  <g id="col-math">
    <!-- Math Block 1 -->
    <rect x="272" y="116" width="192" height="128" rx="10" fill="url(#card-grad)" stroke="#0ea5e9" stroke-width="1.2"/>
    <rect x="288" y="128" width="88" height="18" rx="4" fill="#0369a1" opacity="0.4"/>
    <text x="332" y="141" fill="#38bdf8" font-size="9" font-family="'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">THERMODYNAMICS</text>
    <text x="288" y="166" fill="#f1f5f9" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600">Clausius-Duhem Gating</text>
    <text x="288" y="184" fill="#94a3b8" font-size="10" font-family="'Segoe UI', sans-serif">dS_gen/dt &gt;= 0 Conservation</text>
    <text x="288" y="202" fill="#94a3b8" font-size="10" font-family="'Segoe UI', sans-serif">WKB Quantum Tunneling</text>
    <text x="288" y="220" fill="#38bdf8" font-size="10" font-family="'Segoe UI', sans-serif">Gross-Pitaevskii NLSE</text>

    <!-- Math Block 2 -->
