    <rect x="288" y="304" width="96" height="18" rx="4" fill="#6b21a8" opacity="0.4"/>
    <text x="336" y="317" fill="#c084fc" font-size="9" font-family="'Segoe UI', sans-serif" font-weight="700" text-anchor="middle">ACTIVE INFERENCE</text>
    <text x="288" y="342" fill="#f1f5f9" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600">Variational Free Energy</text>
    <text x="288" y="360" fill="#94a3b8" font-size="10" font-family="'Segoe UI', sans-serif">Markov Blanket Autopoiesis</text>
    <text x="288" y="378" fill="#94a3b8" font-size="10" font-family="'Segoe UI', sans-serif">Liouville-von Neumann SDE</text>
    <text x="288" y="396" fill="#c084fc" font-size="10" font-family="'Segoe UI', sans-serif">Persistent Homology (TDA)</text>
  </g>

