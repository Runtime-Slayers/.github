    <text x="780" y="288" fill="#f8fafc" font-size="11" font-family="'Segoe UI', sans-serif">BioSync-AI &amp; PEDOT OECT</text>

    <!-- Domain 4: Biomedical -->
    <rect x="768" y="332" width="156" height="48" rx="8" fill="url(#card-grad)" stroke="#10b981" stroke-width="1"/>
    <text x="780" y="352" fill="#34d399" font-size="10" font-family="'Segoe UI', sans-serif" font-weight="700">BIOMEDICAL &amp; CANCER</text>
    <text x="780" y="368" fill="#f8fafc" font-size="11" font-family="'Segoe UI', sans-serif">Carotid NVST &amp; Brain Radiomics</text>

    <!-- Domain 5: Assistive & Agritech -->
    <rect x="768" y="404" width="156" height="48" rx="8" fill="url(#card-grad)" stroke="#fbbf24" stroke-width="1"/>
    <text x="780" y="424" fill="#fbbf24" font-size="10" font-family="'Segoe UI', sans-serif" font-weight="700">ASSISTIVE &amp; AGRI</text>
    <text x="780" y="440" fill="#f8fafc" font-size="11" font-family="'Segoe UI', sans-serif">Haptic-Ring &amp; RhizoWhisperer</text>
