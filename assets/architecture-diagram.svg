    <text x="56" y="178" fill="#f8fafc" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="600">Multi-Modal Radar &amp; RF</text>
    <text x="56" y="194" fill="#94a3b8" font-size="10" font-family="'Segoe UI', sans-serif">Micro-Doppler &amp; SDR IQ</text>

    <!-- Card 3 -->
