    <text x="548" y="214" fill="#ffffff" font-size="13" font-family="'Segoe UI', sans-serif" font-weight="700">Physics-Informed Graphs</text>
    <text x="548" y="232" fill="#94a3b8" font-size="11" font-family="'Segoe UI', sans-serif">• Spatio-Temporal GNNs</text>
    <text x="548" y="250" fill="#94a3b8" font-size="11" font-family="'Segoe UI', sans-serif">• Neural-Symbolic Consensus</text>
    <text x="548" y="268" fill="#94a3b8" font-size="11" font-family="'Segoe UI', sans-serif">• Attention-Gated Radiomics</text>
    <text x="548" y="286" fill="#94a3b8" font-size="11" font-family="'Segoe UI', sans-serif">• Multi-Modal Video VLM</text>
    <text x="548" y="306" fill="#38bdf8" font-size="10" font-family="'Segoe UI', sans-serif">Deterministic Silicon Runtime</text>
  </g>

  <!-- ==================== COLUMN 4: DOMAIN IMPACTS ==================== -->
