<text x="490" y="305" class="m" fill="#94a3b8" font-size="8">Model</text><text x="660" y="305" class="m" fill="#38bdf8" font-size="8">BioBERT + ClinicalBERT fine-tuned</text>
<text x="490" y="322" class="m" fill="#94a3b8" font-size="8">NER F1 (Disease)</text><text x="660" y="322" class="m" fill="#10B981" font-size="8">0.921 — i2b2-2010 benchmark</text>
<text x="490" y="339" class="m" fill="#94a3b8" font-size="8">NER F1 (Medication)</text><text x="660" y="339" class="m" fill="#10B981" font-size="8">0.944 — n2c2-2018</text>
<text x="490" y="356" class="m" fill="#94a3b8" font-size="8">Relation F1</text><text x="660" y="356" class="m" fill="#F59E0B" font-size="8">0.878 — treats/causes/indicates</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">Dataset</text><text x="660" y="373" class="m" fill="#94a3b8" font-size="8">i2b2-2010 + n2c2-2018 + 50k notes</text>
<text x="490" y="390" class="m" fill="#94a3b8" font-size="8">Compliance</text><text x="660" y="390" class="m" fill="#c084fc" font-size="8">HIPAA de-identification pipeline</text>

