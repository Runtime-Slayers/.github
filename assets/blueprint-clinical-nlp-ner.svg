<text x="710" y="100" class="m" fill="#38bdf8" font-size="9" text-anchor="middle" font-weight="bold">TECHNICAL OVERVIEW</text>
<line x1="490" y1="108" x2="930" y2="108" stroke="#38bdf8" stroke-width="0.5"/>
<text x="500" y="130" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">BioBERT + ClinicalBERT fine-tuned for clinical named entity recognition (NER) an</text>
<text x="500" y="148" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">d relation extraction from EHR discharge summaries. Extracts: Diseases, Medicati</text>
<text x="500" y="166" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">ons, Dosages, Procedures, Lab values, Anatomy. Relation types: treats, causes, i</text>
<text x="500" y="184" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">ndicates, contraindicates. Tested on i2b2-2010 + n2c2-2018 datasets. F1 Disease:</text>
<text x="500" y="202" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> 0.921, Medication: 0.944, Relation F1: 0.878. HIPAA-compliant anonymization pip</text>
<text x="500" y="220" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">eline included. Spans across 50k clinical notes.</text>
<text x="500" y="238" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="256" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="274" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
