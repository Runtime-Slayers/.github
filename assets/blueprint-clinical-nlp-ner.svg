<line x1="455" y1="48" x2="455" y2="412" stroke="#38bdf8" stroke-width="0.8" opacity="0.4"/>
<text x="220" y="66" class="m" fill="#38bdf8" font-size="9" text-anchor="middle">CLINICAL NLP — NAMED ENTITY RECOGNITION + RELATIONS</text>
    <rect x="35" y="80" width="400" height="295" rx="5" fill="#001020" stroke="#38bdf8" stroke-width="1.5"/>
