<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>
    .m { font-family: "JetBrains Mono", monospace; }
    .s { font-family: "Montserrat", sans-serif; }
  </style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d001a"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.45"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="10.5" font-weight="bold">PROJ-43 // CROSS-FREQUENCY EEG PHASE-AMPLITUDE COUPLING</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-NEURO-0043 | REV.A | NEUROSCIENCE AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

<!-- LEFT: Phase-Amplitude Coupling (PAC) -->
<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">CROSS-FREQUENCY EEG PHASE-AMPLITUDE COUPLING</text>
<rect x="35" y="78" width="400" height="230" rx="5" fill="#080015" stroke="#c084fc" stroke-width="1.2"/>

<!-- Theta Wave (Phase Provider) -->
<path d="M50 140 Q85 90 120 140 Q155 190 190 140 Q225 90 260 140 Q295 190 330 140 Q365 90 400 140" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
<text x="415" y="143" class="m" fill="#38bdf8" font-size="7.5">Theta (4-8 Hz)</text>

<!-- Gamma Bursts (Modulated Amplitude at Theta Peaks) -->
<path d="M70 140 Q75 125 80 140 Q85 110 90 140 Q95 100 100 140 Q105 110 110 140 Q115 130 120 140" fill="none" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)"/>
<path d="M210 140 Q215 125 220 140 Q225 110 230 140 Q235 100 240 140 Q245 110 250 140 Q255 130 260 140" fill="none" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)"/>
<path d="M350 140 Q355 125 360 140 Q365 110 370 140 Q375 100 380 140 Q385 110 390 140 Q395 130 400 140" fill="none" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)"/>
<text x="235" y="95" class="m" fill="#c084fc" font-size="7.5" text-anchor="middle">Gamma Burst (30-80 Hz) locked to Theta Peak</text>

<!-- Polar PAC Plot (Canolty Modulation Index) -->
<circle cx="120" cy="240" r="45" fill="#000d20" stroke="#94a3b8" stroke-width="0.5"/>
<circle cx="120" cy="240" r="30" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="2,2"/>
<circle cx="120" cy="240" r="15" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="2,2"/>
<!-- Non-uniform phase distribution (High PAC) -->
<path d="M120 240 L125 200 Q150 205 155 240 L120 240 Z" fill="#c084fc" opacity="0.6"/>
<text x="120" y="295" class="m" fill="#c084fc" font-size="7" text-anchor="middle">Modulation Index: MI = 0.048</text>

<!-- 10-20 Cap Electrode Schematic -->
<circle cx="320" cy="240" r="40" fill="#051025" stroke="#38bdf8" stroke-width="1"/>
<circle cx="320" cy="240" r="4" fill="#FF3366" filter="url(#glow)"/><text x="320" y="233" class="m" fill="#FF3366" font-size="6" text-anchor="middle">Cz</text>
<circle cx="320" cy="215" r="4" fill="#10B981"/><text x="320" y="210" class="m" fill="#10B981" font-size="6" text-anchor="middle">Fz</text>
<circle cx="320" cy="265" r="4" fill="#38bdf8"/><text x="320" y="275" class="m" fill="#38bdf8" font-size="6" text-anchor="middle">Pz</text>
<circle cx="295" cy="240" r="3" fill="#94a3b8"/><circle cx="345" cy="240" r="3" fill="#94a3b8"/>
<text x="320" y="295" class="m" fill="#38bdf8" font-size="7" text-anchor="middle">64-Channel 10-20 Montage</text>

<!-- Lower status bar -->
<rect x="50" y="320" width="370" height="75" rx="4" fill="#001020" stroke="#c084fc" stroke-width="1"/>
<text x="235" y="336" class="m" fill="#c084fc" font-size="8.5" text-anchor="middle" font-weight="bold">SYNAPTIC PLASTICITY &amp; COMPREHENSION QUANTIFICATION</text>
<text x="235" y="352" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Differentiates active long-term potentiation from rote passive memorization</text>
<text x="235" y="367" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">Comprehension Classification: 92.4% Accuracy | Real-Time CUDA Pipeline</text>
<text x="235" y="382" class="m" fill="#00E5FF" font-size="7.5" text-anchor="middle">Hilbert Transform instantaneous phase-locking value (PLV) computation</text>

<!-- RIGHT PANEL: PAC vs Memory Encoding -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">MODULATION INDEX vs LEARNING DEPTH</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>

<g class="m" font-size="7.5">
  <text x="490" y="98" fill="#94a3b8">Passive Reading (Memorization)</text>
  <rect x="650" y="88" width="90" height="13" fill="#94a3b8" rx="2" opacity="0.6"/>
  <text x="748" y="98" fill="#94a3b8">MI = 0.009</text>

  <text x="490" y="118" fill="#94a3b8">Interactive Solving (Procedural)</text>
  <rect x="650" y="108" width="160" height="13" fill="#38bdf8" rx="2" opacity="0.8"/>
  <text x="818" y="118" fill="#38bdf8">MI = 0.027</text>

  <text x="490" y="138" fill="#10B981" font-weight="bold">Conceptual Insight (Eureka / LTP)</text>
  <rect x="650" y="128" width="225" height="13" fill="#10B981" rx="2" filter="url(#glow)"/>
  <text x="882" y="138" fill="#10B981" font-weight="bold">MI = 0.052</text>
</g>

<!-- Specs Block -->
<rect x="475" y="165" width="460" height="235" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="184" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">PAC PROCESSING SPECIFICATIONS</text>
<line x1="475" y1="192" x2="935" y2="192" stroke="#c084fc" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="490" y="210" fill="#94a3b8">Signal Algorithm:</text><text x="640" y="210" fill="#c084fc">Canolty &amp; Tort Modulation Index (MI)</text>
  <text x="490" y="228" fill="#94a3b8">Phase Frequency (f_p):</text><text x="640" y="228" fill="#38bdf8">Frontal Theta (4.0 to 7.5 Hz)</text>
  <text x="490" y="246" fill="#94a3b8">Amplitude Freq (f_a):</text><text x="640" y="246" fill="#c084fc">Low/High Cortical Gamma (30 to 80 Hz)</text>
  <text x="490" y="264" fill="#94a3b8">Sampling Rate:</text><text x="640" y="264" fill="#94a3b8">256 Hz / 500 Hz (64-channel 24-bit ADC)</text>
  <text x="490" y="282" fill="#94a3b8">Artifact Rejection:</text><text x="640" y="282" fill="#10B981">FastICA Ocular/Myogenic Artifact Filter</text>
  <text x="490" y="300" fill="#94a3b8">Processing Latency:</text><text x="640" y="300" fill="#00E5FF">&lt; 18 ms streaming window on GPU</text>
  <text x="490" y="318" fill="#94a3b8">Predictive Power:</text><text x="640" y="318" fill="#10B981">92.4% correlation with 7-day recall score</text>
  <text x="490" y="336" fill="#94a3b8">Hardware Support:</text><text x="640" y="336" fill="#94a3b8">OpenBCI, BioSemi ActiveTwo, Emotiv Epoc X</text>
  <text x="490" y="354" fill="#94a3b8">CAD Reference:</text><text x="640" y="354" fill="#94a3b8">RS-NEURO-PAC-043-REV-A</text>
  <text x="490" y="372" fill="#00E5FF">Application: Closed-loop Brain-Computer Tutoring Interfaces</text>
</g>

