<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a1500"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  
    <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/>
    </pattern>
    <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-minor)"/>
      <path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/>
    </pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#10B981" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#10B981" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#10B981" font-size="11" font-weight="bold">PROJ-12 // NEUROMORPHIC RADAR — BIO-VISUAL CORTEX STEALTH DETECTION</text>
  <text x="700" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#94a3b8" font-size="9">DRW-DEF-0012 | REV.A | DOMAIN: DEFENSE SENSING</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<!-- LEFT: Radar + SNN visualization -->
<text x="220" y="66" class="m" fill="#10B981" font-size="9" text-anchor="middle">RADAR PULSE-DOPPLER + SNN PROCESSING</text>
<!-- Radar antenna -->
<path d="M200 290 L140 200 L260 200 Z" fill="#001500" stroke="#10B981" stroke-width="1.5"/>
<rect x="188" y="285" width="24" height="35" fill="#001a00" stroke="#10B981" stroke-width="1.5"/>
<!-- Radar beam arcs -->
<g fill="none" stroke="#00E5FF" stroke-dasharray="5,5" opacity="0.5">
  <path d="M200 285 Q100 180 120 100"/><animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  <path d="M200 285 Q200 160 200 90"/>
  <path d="M200 285 Q300 180 280 100"/>
</g>
<!-- Target (stealth aircraft cross-section) -->
<path d="M120 115 L200 95 L280 115 L200 125 Z" fill="#0a1a00" stroke="#FF3366" stroke-width="1.5" filter="url(#glow)"/>
<text x="200" y="112" class="m" fill="#FF3366" font-size="7" text-anchor="middle">STEALTH</text>
<!-- Micro-Doppler signature box -->
<rect x="30" y="300" width="180" height="85" fill="#001500" stroke="#F59E0B" stroke-width="1" rx="3"/>
<text x="120" y="315" class="m" fill="#F59E0B" font-size="8" text-anchor="middle" font-weight="bold">MICRO-DOPPLER</text>
<!-- Signature waveform -->
<polyline points="40,365 55,340 65,368 80,330 95,362 110,342 125,368 140,335 155,360 170,342 185,365" fill="none" stroke="#10B981" stroke-width="1.5"/>
<text x="120" y="378" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Rotating blade signature</text>
<!-- SNN neuron cluster -->
<rect x="240" y="300" width="180" height="85" fill="#001000" stroke="#c084fc" stroke-width="1" rx="3"/>
<text x="330" y="315" class="m" fill="#c084fc" font-size="8" text-anchor="middle" font-weight="bold">SNN LAYER</text>
<g fill="#c084fc" opacity="0.8">
  <circle cx="270" cy="340" r="5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="330" r="5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="330" cy="345" r="5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="360" cy="335" r="5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="390" cy="342" r="5"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="0.8s" repeatCount="indefinite"/></circle>
</g>
<g stroke="#c084fc" stroke-width="0.5" opacity="0.3">
  <line x1="270" y1="340" x2="300" y2="330"/><line x1="300" y1="330" x2="330" y2="345"/>
  <line x1="330" y1="345" x2="360" y2="335"/><line x1="360" y1="335" x2="390" y2="342"/>
</g>
<text x="330" y="375" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Leaky integrate-and-fire</text>
<!-- Divider -->
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
<!-- RIGHT: Pipeline + Performance -->
<text x="700" y="68" class="s" fill="#10B981" font-size="11" font-weight="bold" text-anchor="middle">NEUROMORPHIC DETECTION PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="38" rx="4" fill="#001a00" stroke="#10B981" stroke-width="1.2"/>
<text x="700" y="103" class="m" fill="#10B981" font-size="9" text-anchor="middle">1. PHASED ARRAY: I/Q samples — 10 GHz X-band pulse-Doppler</text>
<text x="700" y="116" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Range-Doppler map + micro-Doppler time-frequency extraction</text>
<rect x="490" y="132" width="420" height="38" rx="4" fill="#0a1a00" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="150" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">2. VISUAL CORTEX ENCODING: Rate coding + STDP</text>
<text x="700" y="163" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Bio-inspired V1/V2/V4 layer hierarchy for feature detection</text>
<rect x="490" y="179" width="420" height="38" rx="4" fill="#001020" stroke="#c084fc" stroke-width="1.2"/>
<text x="700" y="197" class="m" fill="#c084fc" font-size="9" text-anchor="middle">3. SNN CLASSIFIER: LIF neurons, STDP learning rule</text>
<text x="700" y="210" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Spiking neural network with temporal credit assignment</text>
<rect x="490" y="226" width="420" height="38" rx="4" fill="#150010" stroke="#FF3366" stroke-width="2" filter="url(#glow)"/>
<text x="700" y="244" class="m" fill="#FF3366" font-size="9" text-anchor="middle" font-weight="bold">4. DETECTION: Stealth aircraft identified — RCS threshold</text>
<text x="700" y="257" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Micro-Doppler blade signature + planform geometry classification</text>
<!-- Metrics grid -->
<rect x="475" y="278" width="460" height="125" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
<text x="490" y="295" class="m" fill="#10B981" font-size="8.5" font-weight="bold">PERFORMANCE METRICS</text>
<line x1="475" y1="302" x2="935" y2="302" stroke="#10B981" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="490" y="319" fill="#94a3b8">Detection accuracy:</text><text x="660" y="319" fill="#10B981">93.4% (vs 71% classic CFAR)</text>
  <text x="490" y="336" fill="#94a3b8">RCS sensitivity:</text><text x="660" y="336" fill="#00E5FF">-20 dBsm stealth target</text>
  <text x="490" y="353" fill="#94a3b8">Power consumption:</text><text x="660" y="353" fill="#F59E0B">8x less than DNN (neuromorphic)</text>
  <text x="490" y="370" fill="#94a3b8">SNN type:</text><text x="660" y="370" fill="#c084fc">Leaky Integrate-and-Fire (LIF)</text>
  <text x="490" y="387" fill="#94a3b8">Hardware:</text><text x="660" y="387" fill="#94a3b8">Intel Loihi neuromorphic chip</text>
</g>
</svg>