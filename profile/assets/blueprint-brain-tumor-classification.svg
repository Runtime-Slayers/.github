<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a0015"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="11" font-weight="bold">PROJ-24 // BRAIN TUMOR CLASSIFICATION — MULTI-PARAMETRIC MRI</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-BIO-0024 | REV.A | CLINICAL AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">MULTI-PARAMETRIC MRI BRAIN TUMOR CLASSIFICATION</text>
<!-- MRI slices (4 modalities) -->
<!-- T1 -->
<rect x="35" y="80" width="90" height="90" rx="4" fill="#001020" stroke="#c084fc" stroke-width="1.5"/>
<text x="80" y="96" class="m" fill="#c084fc" font-size="7.5" text-anchor="middle">T1-weighted</text>
<ellipse cx="80" cy="145" rx="32" ry="25" fill="#1a0a30" stroke="#c084fc" stroke-width="0.8"/>
<ellipse cx="80" cy="145" rx="20" ry="15" fill="#2a1a40" stroke="#c084fc" stroke-width="0.5"/>
<text x="80" y="148" class="m" fill="#94a3b8" font-size="6" text-anchor="middle">brain</text>
<!-- T2 -->
<rect x="135" y="80" width="90" height="90" rx="4" fill="#001020" stroke="#38bdf8" stroke-width="1.5"/>
<text x="180" y="96" class="m" fill="#38bdf8" font-size="7.5" text-anchor="middle">T2-FLAIR</text>
<ellipse cx="180" cy="145" rx="32" ry="25" fill="#001a30" stroke="#38bdf8" stroke-width="0.8"/>
<ellipse cx="190" cy="140" rx="12" ry="10" fill="#38bdf8" opacity="0.5" filter="url(#glow)"/>
<text x="195" y="140" class="m" fill="#38bdf8" font-size="5.5" text-anchor="start">edema</text>
<!-- DWI -->
<rect x="235" y="80" width="90" height="90" rx="4" fill="#001020" stroke="#F59E0B" stroke-width="1.5"/>
<text x="280" y="96" class="m" fill="#F59E0B" font-size="7.5" text-anchor="middle">DWI</text>
<ellipse cx="280" cy="145" rx="32" ry="25" fill="#100800" stroke="#F59E0B" stroke-width="0.8"/>
<circle cx="290" cy="140" r="8" fill="#F59E0B" opacity="0.5" filter="url(#glow)"/>
<text x="295" y="140" class="m" fill="#F59E0B" font-size="5.5">restrict</text>
<!-- T1c (contrast) -->
<rect x="335" y="80" width="90" height="90" rx="4" fill="#001020" stroke="#FF3366" stroke-width="1.5"/>
<text x="380" y="96" class="m" fill="#FF3366" font-size="7.5" text-anchor="middle">T1+Gd</text>
<ellipse cx="380" cy="145" rx="32" ry="25" fill="#200010" stroke="#FF3366" stroke-width="0.8"/>
<ellipse cx="390" cy="142" rx="15" ry="12" fill="#FF3366" opacity="0.6" filter="url(#glow)"/>
<text x="395" y="142" class="m" fill="#FF3366" font-size="5.5">enhance</text>
<!-- CNN architecture schematic -->
<rect x="35" y="185" width="395" height="55" rx="4" fill="#0a0020" stroke="#c084fc" stroke-width="1.5"/>
<text x="232" y="202" class="m" fill="#c084fc" font-size="8.5" text-anchor="middle">3D MULTI-PARAMETRIC CNN ARCHITECTURE</text>
<!-- Architecture blocks -->
<rect x="45" y="208" width="40" height="20" rx="2" fill="#100020" stroke="#c084fc" stroke-width="0.8"/>
<text x="65" y="221" class="m" fill="#c084fc" font-size="6.5" text-anchor="middle">Conv3D</text>
<line x1="85" y1="218" x2="95" y2="218" stroke="#94a3b8" stroke-width="1"/>
<rect x="95" y="208" width="40" height="20" rx="2" fill="#100020" stroke="#38bdf8" stroke-width="0.8"/>
<text x="115" y="221" class="m" fill="#38bdf8" font-size="6.5" text-anchor="middle">MaxPool</text>
<line x1="135" y1="218" x2="145" y2="218" stroke="#94a3b8" stroke-width="1"/>
<rect x="145" y="208" width="40" height="20" rx="2" fill="#100020" stroke="#c084fc" stroke-width="0.8"/>
<text x="165" y="221" class="m" fill="#c084fc" font-size="6.5" text-anchor="middle">Conv3D</text>
<line x1="185" y1="218" x2="205" y2="218" stroke="#94a3b8" stroke-width="1"/>
<rect x="205" y="208" width="50" height="20" rx="2" fill="#001020" stroke="#F59E0B" stroke-width="0.8"/>
<text x="230" y="221" class="m" fill="#F59E0B" font-size="6.5" text-anchor="middle">Attention</text>
<line x1="255" y1="218" x2="265" y2="218" stroke="#94a3b8" stroke-width="1"/>
<rect x="265" y="208" width="50" height="20" rx="2" fill="#100020" stroke="#c084fc" stroke-width="0.8"/>
<text x="290" y="221" class="m" fill="#c084fc" font-size="6.5" text-anchor="middle">FC-256</text>
<line x1="315" y1="218" x2="325" y2="218" stroke="#94a3b8" stroke-width="1"/>
<rect x="325" y="208" width="50" height="20" rx="2" fill="#150000" stroke="#FF3366" stroke-width="0.8"/>
<text x="350" y="221" class="m" fill="#FF3366" font-size="6.5" text-anchor="middle">Softmax</text>
<!-- Tumor classification results -->
<rect x="35" y="255" width="395" height="140" rx="4" fill="#080d18" stroke="#c084fc" stroke-width="1"/>
<text x="232" y="272" class="m" fill="#c084fc" font-size="8.5" text-anchor="middle" font-weight="bold">CLASSIFICATION RESULTS (BraTS 2023 Dataset)</text>
<line x1="35" y1="278" x2="430" y2="278" stroke="#c084fc" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="50" y="295" fill="#94a3b8">Tumor Type</text><text x="200" y="295" fill="#94a3b8">Dice Score</text><text x="300" y="295" fill="#94a3b8">Sensitivity</text><text x="390" y="295" fill="#94a3b8">Spec.</text>
  <line x1="35" y1="300" x2="430" y2="300" stroke="#1e3a5f" stroke-width="0.5"/>
  <text x="50" y="316" fill="#FF3366">Glioblastoma</text><text x="200" y="316" fill="#10B981">0.91</text><text x="300" y="316" fill="#10B981">93.2%</text><text x="390" y="316" fill="#10B981">96.1%</text>
  <text x="50" y="333" fill="#38bdf8">Meningioma</text><text x="200" y="333" fill="#10B981">0.88</text><text x="300" y="333" fill="#10B981">90.7%</text><text x="390" y="333" fill="#10B981">94.8%</text>
  <text x="50" y="350" fill="#F59E0B">LGG (low grade)</text><text x="200" y="350" fill="#10B981">0.85</text><text x="300" y="350" fill="#10B981">88.4%</text><text x="390" y="350" fill="#10B981">95.3%</text>
  <text x="50" y="367" fill="#c084fc">PCNSL</text><text x="200" y="367" fill="#10B981">0.83</text><text x="300" y="367" fill="#10B981">87.1%</text><text x="390" y="367" fill="#10B981">93.7%</text>
  <text x="50" y="384" fill="#94a3b8">Overall mAP:</text><text x="200" y="384" fill="#10B981" font-weight="bold">0.87</text>
</g>
<!-- RIGHT: Grad-CAM + metrics -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">GRAD-CAM EXPLAINABILITY + SPECS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<!-- Grad-CAM heatmap visualization -->
<rect x="490" y="85" width="200" height="150" rx="4" fill="#001020" stroke="#c084fc" stroke-width="1.5"/>
<text x="590" y="100" class="m" fill="#c084fc" font-size="8" text-anchor="middle">GRAD-CAM HEATMAP</text>
<ellipse cx="590" cy="165" rx="65" ry="50" fill="#001020" stroke="#c084fc" stroke-width="0.8"/>
<!-- Heatmap gradient colors -->
<ellipse cx="610" cy="160" rx="30" ry="22" fill="#FF3366" opacity="0.5" filter="url(#glow)"/>
<ellipse cx="615" cy="158" rx="15" ry="10" fill="#FF6B00" opacity="0.7" filter="url(#glow)"/>
<ellipse cx="620" cy="156" rx="8" ry="5" fill="#F59E0B" opacity="0.9" filter="url(#glow)"/>
<text x="590" y="228" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Red = most diagnostic region</text>
<!-- Specs block -->
<rect x="705" y="85" width="225" height="150" rx="4" fill="#080d18" stroke="#F59E0B" stroke-width="1"/>
<text x="817" y="104" class="m" fill="#F59E0B" font-size="9" text-anchor="middle" font-weight="bold">SYSTEM SPECS</text>
<line x1="705" y1="112" x2="930" y2="112" stroke="#F59E0B" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="715" y="130" fill="#94a3b8">Dataset:</text><text x="800" y="130" fill="#38bdf8">BraTS 2023 (1251 cases)</text>
  <text x="715" y="148" fill="#94a3b8">Modalities:</text><text x="800" y="148" fill="#c084fc">T1, T2, FLAIR, DWI, T1+Gd</text>
  <text x="715" y="166" fill="#94a3b8">Architecture:</text><text x="800" y="166" fill="#10B981">3D EfficientNet-B5</text>
  <text x="715" y="184" fill="#94a3b8">Parameters:</text><text x="800" y="184" fill="#94a3b8">30M trainable</text>
  <text x="715" y="202" fill="#94a3b8">XAI method:</text><text x="800" y="202" fill="#F59E0B">Grad-CAM v2</text>
  <text x="715" y="220" fill="#94a3b8">Classes:</text><text x="800" y="220" fill="#94a3b8">4 tumor types</text>
</g>
<!-- Bottom -->
<rect x="475" y="255" width="460" height="140" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="272" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">CLINICAL IMPACT</text>
<g class="m" font-size="8">
  <text x="490" y="290" fill="#94a3b8">Radiologist agreement: 94.5% concordance on GBM cases</text>
  <text x="490" y="307" fill="#94a3b8">Volumetric segmentation: Dice 0.91 (state-of-art)</text>
  <text x="490" y="324" fill="#94a3b8">Inference time: 2.8 s per patient (NVIDIA A100)</text>
  <text x="490" y="341" fill="#94a3b8">Grade classification: WHO Grade II/III/IV (96.1% acc)</text>
  <text x="490" y="358" fill="#94a3b8">Treatment planning: radiation target volume auto-delineation</text>
  <text x="490" y="375" fill="#10B981" font-weight="bold">Key innovation: multi-parametric fusion + attention + Grad-CAM</text>
  <text x="490" y="392" fill="#F59E0B">Runtime Slayers | DRW-BIO-0024 | CLINICAL AI RESEARCH</text>
</g>
</svg>