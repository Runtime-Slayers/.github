<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <style>.mono{font-family:"JetBrains Mono","Courier New",monospace}.sans{font-family:"Montserrat","Segoe UI",sans-serif}</style>
    <filter id="p3-glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="p3-bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d1220"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
    <linearGradient id="p3-aircraft" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a4a4a"/><stop offset="100%" stop-color="#1a1a1a"/></linearGradient>
    <pattern id="p3-grid-minor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="p3-grid-major" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#p3-grid-minor)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
  </defs>
  <rect width="960" height="420" fill="url(#p3-bg)"/>
  <rect width="960" height="420" fill="url(#p3-grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#c084fc" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" class="mono" fill="#c084fc" font-size="11" font-weight="bold">PROJ-03 // E-4C NEMESIS — AIRBORNE NUCLEAR COMMAND POST</text>
  <text x="700" y="32" class="mono" fill="#94a3b8" font-size="9">DRW-DEF-0003 | REV.B | CLASSIFIED SIM</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>

  <!-- Aircraft silhouette (side view, modified Boeing E-4B style) -->
  <g transform="translate(30, 60)">
    <!-- Fuselage -->
    <ellipse cx="200" cy="130" rx="185" ry="42" fill="url(#p3-aircraft)" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Nose cone -->
    <path d="M15 130 Q0 130 5 122 Q30 110 60 125" fill="#2a2a2a" stroke="#c084fc" stroke-width="1"/>
    <!-- Tail -->
    <path d="M385 115 L420 80 L420 115 Z" fill="#2a2a2a" stroke="#c084fc" stroke-width="1"/>
    <!-- Wings -->
    <path d="M120 165 L80 230 L280 230 L270 165 Z" fill="#252525" stroke="#c084fc" stroke-width="1" opacity="0.7"/>
    <!-- Engines (4) -->
    <ellipse cx="130" cy="235" rx="20" ry="8" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.2"/>
    <ellipse cx="180" cy="238" rx="20" ry="8" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.2"/>
    <ellipse cx="230" cy="238" rx="20" ry="8" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.2"/>
    <ellipse cx="275" cy="235" rx="20" ry="8" fill="#1a1a1a" stroke="#FF6B00" stroke-width="1.2"/>
    <!-- Engine glow -->
    <circle cx="130" cy="235" r="5" fill="#FF6B00" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="238" r="5" fill="#FF6B00" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="238" r="5" fill="#FF6B00" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="235" r="5" fill="#FF6B00" opacity="0.6"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></circle>
    <!-- SATCOM dome on top -->
    <ellipse cx="200" cy="90" rx="30" ry="12" fill="#c084fc" opacity="0.3" stroke="#c084fc" stroke-width="1.2"/>
    <text x="200" y="94" class="mono" fill="#c084fc" font-size="7" text-anchor="middle">SATCOM</text>
    <!-- EMP shield glow around aircraft -->
    <ellipse cx="205" cy="130" rx="200" ry="60" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="5,5" opacity="0.5">
      <animate attributeName="rx" values="200;210;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <text x="190" y="320" class="mono" fill="#00E5FF" font-size="8" text-anchor="middle">EMP HARDENED FARADAY SHIELD — Faraday cage rated 100 kV/m</text>
  </g>

  <!-- Annotations -->
  <line x1="240" y1="80" x2="320" y2="60" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="322" y="58" class="mono" fill="#94a3b8" font-size="8">Hardened fuselage</text>
  <line x1="108" y1="200" x2="50" y2="240" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="20" y="252" class="mono" fill="#94a3b8" font-size="8">4x CF6 turbofan</text>
  <line x1="230" y1="90" x2="295" y2="110" stroke="#c084fc" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="300" y="113" class="mono" fill="#c084fc" font-size="8">SATCOM + SHF/EHF</text>

  <!-- Vertical divider -->
  <line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

  <!-- ===== RIGHT PANEL: Systems Architecture ===== -->
  <text x="480" y="68" class="sans" fill="#c084fc" font-size="12" font-weight="bold">NEMESIS ONBOARD SYSTEMS ARCHITECTURE</text>
  <line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>

  <!-- System blocks -->
  <!-- C2 Core -->
  <rect x="490" y="85" width="130" height="60" rx="5" fill="#12052a" stroke="#c084fc" stroke-width="1.5"/>
  <text x="555" y="107" class="mono" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">C2 CORE</text>
  <text x="555" y="120" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">NEAC-II processor</text>
  <text x="555" y="132" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Rad-hardened CPU</text>

  <!-- Comms -->
  <rect x="650" y="85" width="130" height="60" rx="5" fill="#0a1a00" stroke="#10B981" stroke-width="1.5"/>
  <text x="715" y="107" class="mono" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">COMMS SUITE</text>
  <text x="715" y="120" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">SHF / EHF / LF / VLF</text>
  <text x="715" y="132" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Trailing-wire antenna</text>

  <!-- EW -->
  <rect x="800" y="85" width="130" height="60" rx="5" fill="#1a0a00" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="865" y="107" class="mono" fill="#FF6B00" font-size="9" text-anchor="middle" font-weight="bold">EW MODULE</text>
  <text x="865" y="120" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">AI jamming detect</text>
  <text x="865" y="132" class="mono" fill="#94a3b8" font-size="7.5" text-anchor="middle">Spectrum analyser</text>

  <!-- Arrows top row -->
  <line x1="620" y1="115" x2="650" y2="115" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="780" y1="115" x2="800" y2="115" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- AI Decision Layer -->
  <rect x="560" y="175" width="200" height="55" rx="5" fill="#0d1a35" stroke="#00E5FF" stroke-width="2"/>
  <text x="660" y="195" class="mono" fill="#00E5FF" font-size="10" text-anchor="middle" font-weight="bold">AI DECISION LAYER</text>
  <text x="660" y="210" class="mono" fill="#94a3b8" font-size="8" text-anchor="middle">Active Inference / Free Energy</text>
  <text x="660" y="222" class="mono" fill="#94a3b8" font-size="8" text-anchor="middle">Threat model: OODA loop AI</text>

  <!-- Arrows to AI layer -->
  <line x1="555" y1="145" x2="610" y2="175" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="715" y1="145" x2="680" y2="175" stroke="#10B981" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="865" y1="145" x2="740" y2="175" stroke="#FF6B00" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Nuclear C2 output -->
  <rect x="560" y="255" width="200" height="45" rx="5" fill="#1a0000" stroke="#FF3366" stroke-width="2"/>
  <text x="660" y="275" class="mono" fill="#FF3366" font-size="9" text-anchor="middle" font-weight="bold">NUCLEAR C2 OUTPUT</text>
  <text x="660" y="290" class="mono" fill="#94a3b8" font-size="8" text-anchor="middle">Authenticated EAM relay</text>
  <line x1="660" y1="230" x2="660" y2="255" stroke="#00E5FF" stroke-width="1.5"/>

  <!-- CAAS / Survivability -->
  <rect x="475" y="315" width="210" height="80" rx="5" fill="#080d18" stroke="#c084fc" stroke-width="1"/>
  <text x="580" y="333" class="mono" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">SURVIVABILITY METRICS</text>
  <text x="490" y="350" class="mono" fill="#94a3b8" font-size="8">Endurance (air-refuelled): 72 hr</text>
  <text x="490" y="364" class="mono" fill="#94a3b8" font-size="8">EMP tolerance: 100 kV/m</text>
  <text x="490" y="378" class="mono" fill="#94a3b8" font-size="8">Crew: 112 persons onboard</text>
  <text x="490" y="392" class="mono" fill="#F59E0B" font-size="8">Classification: SIMULATION ONLY</text>

  <!-- Specs box -->
  <rect x="700" y="315" width="235" height="80" rx="5" fill="#080d18" stroke="#10B981" stroke-width="1"/>
  <text x="817" y="333" class="mono" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">AI INNOVATION</text>
  <text x="710" y="350" class="mono" fill="#94a3b8" font-size="8">Free-energy active inference</text>
  <text x="710" y="364" class="mono" fill="#94a3b8" font-size="8">Autopoietic self-repair routing</text>
  <text x="710" y="378" class="mono" fill="#94a3b8" font-size="8">Neuro-symbolic threat logic</text>
  <text x="710" y="392" class="mono" fill="#00E5FF" font-size="8">Real-time EW spectrum classify</text>
</svg>