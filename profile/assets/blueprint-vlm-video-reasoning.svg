  <text x="490" y="354" fill="#94a3b8">Innovation:</text><text x="620" y="354" fill="#94a3b8">Neural + symbolic hybrid reasoning</text>
  <text x="490" y="371" fill="#94a3b8">subcategories:</text><text x="620" y="371" fill="#94a3b8">278 video reasoning subcategories</text>
