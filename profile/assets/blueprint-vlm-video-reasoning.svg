<line x1="100" y1="245" x2="215" y2="270" stroke="#94a3b8" stroke-width="1"/>
<line x1="212" y1="245" x2="217" y2="270" stroke="#94a3b8" stroke-width="1"/>
<line x1="324" y1="245" x2="222" y2="270" stroke="#94a3b8" stroke-width="1"/>
<!-- Consensus module -->
<rect x="130" y="268" width="175" height="50" rx="4" fill="#200a00" stroke="#FF3366" stroke-width="1.5" filter="url(#glow)"/>
<text x="217" y="289" class="m" fill="#FF3366" font-size="8.5" text-anchor="middle" font-weight="bold">NEURAL-SYMBOLIC</text>
<text x="217" y="302" class="m" fill="#FF3366" font-size="8.5" text-anchor="middle" font-weight="bold">CONSENSUS</text>
<text x="217" y="315" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Weighted voting + symbolic rule check</text>
<text x="220" y="390" class="m" fill="#F59E0B" font-size="8" text-anchor="middle">3 VLMs vote + symbolic logic verifier — top-1 accuracy 73.5%</text>
