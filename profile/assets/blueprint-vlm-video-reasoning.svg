<line x1="455" y1="48" x2="455" y2="412" stroke="#F59E0B" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">VLM NEURAL-SYMBOLIC CONSENSUS — VIDEO REASONING</text>
