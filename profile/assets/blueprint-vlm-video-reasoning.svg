<text x="100" y="235" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">reasoning</text>
<rect x="162" y="190" width="100" height="55" rx="4" fill="#001020" stroke="#00E5FF" stroke-width="1"/>
<text x="212" y="212" class="m" fill="#00E5FF" font-size="7.5" text-anchor="middle" font-weight="bold">Gemini</text>
<text x="212" y="224" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Temporal</text>
<text x="212" y="235" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">grounding</text>
<rect x="274" y="190" width="100" height="55" rx="4" fill="#001a00" stroke="#10B981" stroke-width="1"/>
<text x="324" y="212" class="m" fill="#10B981" font-size="7.5" text-anchor="middle" font-weight="bold">Llama-V</text>
<text x="324" y="224" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Object</text>
<text x="324" y="235" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">tracking</text>
