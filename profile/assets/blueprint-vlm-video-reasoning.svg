<text x="332" y="145" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">"Why did person A</text>
<text x="332" y="157" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">do X after event Y?"</text>
