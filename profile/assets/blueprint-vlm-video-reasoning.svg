<text x="490" y="96" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">NextQA TOP-1 ACCURACY — QUESTION TYPE</text>
<text x="490" y="115" class="m" fill="#94a3b8" font-size="8">Causal (C-QA)</text><rect x="620" y="105" width="195" height="14" fill="#F59E0B" rx="2"/><text x="821" y="116" class="m" fill="#0B0F19" font-size="7.5" font-weight="bold">73.5%</text>
<text x="490" y="136" class="m" fill="#94a3b8" font-size="8">Temporal (T-QA)</text><rect x="620" y="126" width="175" height="14" fill="#F59E0B" rx="2" opacity="0.85"/><text x="801" y="137" class="m" fill="#f8fafc" font-size="7.5">68.2%</text>
<text x="490" y="157" class="m" fill="#94a3b8" font-size="8">Descriptive (D-QA)</text><rect x="620" y="147" width="205" height="14" fill="#F59E0B" rx="2" opacity="0.9"/><text x="831" y="158" class="m" fill="#0B0F19" font-size="7.5">78.9%</text>
<text x="490" y="178" class="m" fill="#94a3b8" font-size="8">Overall</text><rect x="620" y="168" width="188" height="14" fill="#FF3366" rx="2" filter="url(#glow)"/><text x="814" y="179" class="m" fill="#f8fafc" font-size="7.5" font-weight="bold">73.5%</text>
<!-- Symbolic reasoning specs -->
<rect x="475" y="200" width="460" height="195" fill="#080d18" rx="4" stroke="#F59E0B" stroke-width="1"/>
<text x="490" y="217" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">SYSTEM DESIGN</text>
<g class="m" font-size="8">
  <text x="490" y="235" fill="#94a3b8">Dataset:</text><text x="620" y="235" fill="#F59E0B">NextQA — 5k videos, 52k QA pairs</text>
  <text x="490" y="252" fill="#94a3b8">VLM ensemble:</text><text x="620" y="252" fill="#c084fc">GPT-4V + Gemini-1.5 + LLaMA-3-V</text>
