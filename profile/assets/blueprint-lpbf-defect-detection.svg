<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#100500"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#FF6B00" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#FF6B00" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#FF6B00" font-size="10" font-weight="bold">PROJ-46 // ADDITIVE MANUFACTURING — REAL-TIME DEFECT DETECTION</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-ENG-0046 | REV.A | MANUFACTURING AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#FF6B00" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#FF6B00" stroke-width="0.8" opacity="0.4"/>
<text x="220" y="66" class="m" fill="#FF6B00" font-size="9" text-anchor="middle">LPBF 3D PRINTING — REAL-TIME DEFECT DETECTION</text>
    <rect x="35" y="80" width="400" height="295" rx="5" fill="#0a0000" stroke="#FF6B00" stroke-width="1.5"/>
    <text x="220" y="100" class="m" fill="#F59E0B" font-size="8" text-anchor="middle">IN-SITU LAYER MONITORING — IN-PROCESS CAMERA</text>
    <!-- Layer surface scan -->
    <rect x="55" y="110" width="350" height="200" fill="#1a0800" rx="3"/>
    <!-- Melt pool trace -->
    <path d="M70 200 Q150 190 230 200 Q310 210 390 195" fill="none" stroke="#FF3366" stroke-width="2" filter="url(#glow)"/>
    <!-- Normal surface areas -->
    <g fill="#2a1000" opacity="0.5">
      <rect x="65" y="115" width="80" height="75"/>
      <rect x="200" y="115" width="90" height="75"/>
      <rect x="65" y="210" width="70" height="90"/>
      <rect x="310" y="210" width="85" height="90"/>
    </g>
    <!-- Defects (highlighted boxes) -->
    <rect x="155" y="118" width="40" height="35" fill="none" stroke="#FF3366" stroke-width="2" stroke-dasharray="3,2" filter="url(#glow)"/>
    <text x="175" y="143" class="m" fill="#FF3366" font-size="7" text-anchor="middle">POROS.</text>
    <rect x="290" y="135" width="50" height="35" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="315" y="157" class="m" fill="#F59E0B" font-size="7" text-anchor="middle">DELAMN.</text>
    <rect x="145" y="225" width="45" height="35" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="167" y="247" class="m" fill="#c084fc" font-size="7" text-anchor="middle">CRACK</text>
    <!-- Scan progress bar -->
    <rect x="55" y="320" width="350" height="15" fill="#0a0000" rx="3"/>
    <rect x="55" y="320" width="210" height="15" fill="#FF6B00" rx="3" opacity="0.8"/>
    <text x="230" y="332" class="m" fill="#0B0F19" font-size="7.5" font-weight="bold">Layer 347 / 500 — 69.4%</text>
    <!-- Alert -->
    <rect x="55" y="345" width="350" height="22" fill="#1a0000" rx="3" stroke="#FF3366" stroke-width="1"/>
    <text x="220" y="360" class="m" fill="#FF3366" font-size="8" text-anchor="middle">ALERT: Porosity detected Layer 347 — laser power +8%</text>
    <text x="220" y="390" class="m" fill="#FF6B00" font-size="8" text-anchor="middle">YOLOv8 F1: 0.931 | Reject rate: 8.3% to 1.1% | 200mm/s scan</text>
<!-- RIGHT PANEL -->
<text x="700" y="68" class="s" fill="#FF6B00" font-size="11" font-weight="bold" text-anchor="middle">SYSTEM ARCHITECTURE &amp; METRICS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#FF6B00" stroke-width="0.5" opacity="0.4"/>
<!-- Description block -->
<rect x="490" y="82" width="440" height="200" rx="5" fill="#080d18" stroke="#FF6B00" stroke-width="1"/>
<text x="710" y="100" class="m" fill="#FF6B00" font-size="9" text-anchor="middle" font-weight="bold">TECHNICAL OVERVIEW</text>
<line x1="490" y1="108" x2="930" y2="108" stroke="#FF6B00" stroke-width="0.5"/>
<text x="500" y="130" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">Computer vision system for real-time defect detection in laser powder bed fusion</text>
<text x="500" y="148" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> (LPBF) metal 3D printing. YOLOv8 + ResNet50 ensemble detects: porosity, delamin</text>
<text x="500" y="166" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">ation, cracking, surface roughness anomalies from in-situ camera monitoring. Lay</text>
<text x="500" y="184" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">er-by-layer analysis at 200mm/s scan speed. F1: 0.931. Real-time alert triggers </text>
<text x="500" y="202" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">laser parameter correction. Dataset: 50k annotated LPBF layers (Ti-6Al-4V + IN71</text>
<text x="500" y="220" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">8). Reduces post-process rejection rate from 8.3% to 1.1%.</text>
<text x="500" y="238" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="256" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="274" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<!-- Metrics table -->
<rect x="490" y="295" width="440" height="110" rx="4" fill="#080d18" stroke="#FF6B00" stroke-width="1"/>
<text x="710" y="310" class="m" fill="#FF6B00" font-size="8.5" text-anchor="middle" font-weight="bold">KEY METRICS</text>
<line x1="490" y1="316" x2="930" y2="316" stroke="#FF6B00" stroke-width="0.5"/>
<text x="490" y="305" class="m" fill="#94a3b8" font-size="8">Architecture</text><text x="660" y="305" class="m" fill="#FF6B00" font-size="8">YOLOv8 + ResNet50 ensemble</text>
<text x="490" y="322" class="m" fill="#94a3b8" font-size="8">Defect types</text><text x="660" y="322" class="m" fill="#94a3b8" font-size="8">Porosity, delamination, cracking</text>
<text x="490" y="339" class="m" fill="#94a3b8" font-size="8">F1 score</text><text x="660" y="339" class="m" fill="#10B981" font-size="8">0.931 (all defect classes)</text>
<text x="490" y="356" class="m" fill="#94a3b8" font-size="8">Scan speed</text><text x="660" y="356" class="m" fill="#F59E0B" font-size="8">200 mm/s in-situ monitoring</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">Rejection rate</text><text x="660" y="373" class="m" fill="#10B981" font-size="8">8.3% to 1.1% (-87%)</text>
<text x="490" y="390" class="m" fill="#94a3b8" font-size="8">Material</text><text x="660" y="390" class="m" fill="#c084fc" font-size="8">Ti-6Al-4V + IN718 — 50k layers</text>

</svg>