<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" role="img" aria-labelledby="pil-title pil-desc">
  <title id="pil-title">Runtime-Slayers Seven Research Pillars Map</title>
  <desc id="pil-desc">Hexagonal constellation mapping the Seven Research Pillars across Aerospace, Defense, Quantum, Biomedical, Genomics, Multimodal AI, and Agritech.</desc>
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="p-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <pattern id="p-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/></pattern>
  </defs>

  <rect width="960" height="380" rx="14" fill="url(#p-bg)"/>
  <rect width="960" height="380" rx="14" fill="url(#p-dots)"/>
  <rect width="960" height="380" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="34" fill="#f8fafc" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="0.06em">THE SEVEN RESEARCH PILLARS ECOSYSTEM</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Interconnected Domains Driving Deep-Tech Breakthroughs from Theory to Silicon</text>

  <!-- Connective Constellation Lines -->
  <line x1="160" y1="120" x2="360" y2="100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="360" y1="100" x2="600" y2="100" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="600" y1="100" x2="800" y2="120" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="160" y1="120" x2="260" y2="250" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="260" y1="250" x2="480" y2="280" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="480" y1="280" x2="700" y2="250" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
  <line x1="700" y1="250" x2="800" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Pillar 1: Aero -->
  <g transform="translate(60, 70)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0284c7" opacity="0.3"/>
    <text x="28" y="33" fill="#38bdf8" font-size="14" text-anchor="middle">🚀</text>
    <text x="50" y="24" fill="#38bdf8" font-size="10" font-weight="700">PILLAR I</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Aero-Propulsion</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• TITAN-NET PINNs &amp; Wear Gating</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• WKB Cold Tunneling &amp; Plasma RF</text>
  </g>

  <!-- Pillar 2: Defense -->
  <g transform="translate(290, 50)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#e11d48" opacity="0.3"/>
    <text x="28" y="33" fill="#f43f5e" font-size="14" text-anchor="middle">🛡️</text>
    <text x="50" y="24" fill="#f43f5e" font-size="10" font-weight="700">PILLAR II</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Defense Intelligence</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• Project VISHWAROOP Active Inf.</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Spatio-Temporal GNNs &amp; C-UAS</text>
  </g>

  <!-- Pillar 3: Quantum -->
  <g transform="translate(520, 50)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#4f46e5" opacity="0.3"/>
    <text x="28" y="33" fill="#818cf8" font-size="14" text-anchor="middle">⚛️</text>
    <text x="50" y="24" fill="#818cf8" font-size="10" font-weight="700">PILLAR III</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Quantum Networks</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• Avian Cryptochrome Navigation</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Satellite Topological QKD</text>
  </g>

  <!-- Pillar 4: Biomedical -->
  <g transform="translate(720, 70)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#059669" opacity="0.3"/>
    <text x="28" y="33" fill="#34d399" font-size="14" text-anchor="middle">🩺</text>
    <text x="50" y="24" fill="#34d399" font-size="10" font-weight="700">PILLAR IV</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Biomedical Engineering</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• Carotid Plaque Ultrasound AI</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Self-Healing Hydrogels &amp; OECTs</text>
  </g>

  <!-- Pillar 5: Genomics -->
  <g transform="translate(150, 210)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#d97706" opacity="0.3"/>
    <text x="28" y="33" fill="#f59e0b" font-size="14" text-anchor="middle">🧬</text>
    <text x="50" y="24" fill="#f59e0b" font-size="10" font-weight="700">PILLAR V</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Genomics &amp; Biology</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• Chronos CRISPR Dependency</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Beta-Amyloid Quantum Fibrils</text>
  </g>

  <!-- Pillar 6: Multimodal AI -->
  <g transform="translate(380, 210)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#9333ea" opacity="0.3"/>
    <text x="28" y="33" fill="#c084fc" font-size="14" text-anchor="middle">🔮</text>
    <text x="50" y="24" fill="#c084fc" font-size="10" font-weight="700">PILLAR VI</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Foundation Models</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• Kaggle CUHK-X Video Reasoning</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Multi-Layer Hallucination Proofs</text>
  </g>

  <!-- Pillar 7: Agritech & Societal -->
  <g transform="translate(610, 210)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#047857" opacity="0.3"/>
    <text x="28" y="33" fill="#10b981" font-size="14" text-anchor="middle">🌾</text>
    <text x="50" y="24" fill="#10b981" font-size="10" font-weight="700">PILLAR VII</text>
    <text x="50" y="40" fill="#f8fafc" font-size="12" font-weight="700">Societal Resilience</text>
    <text x="14" y="62" fill="#94a3b8" font-size="10">• Smart Cane Edge Obstacle AI</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• RhizoRoot 3D Drought Phenotyping</text>
  </g>
</svg>