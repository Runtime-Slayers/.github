<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" role="img" aria-labelledby="pil-title pil-desc">
  <title id="pil-title">Runtime-Slayers Seven Research Pillars Map</title>
  <desc id="pil-desc">Constellation mapping the Seven Research Pillars across Aerospace, Defense, Quantum, Biomedical, Genomics, Multimodal AI, and Agritech.</desc>
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="p-box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141f38"/>
      <stop offset="100%" stop-color="#0c1322"/>
    </linearGradient>
    <pattern id="p-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/></pattern>
  </defs>

  <rect width="960" height="380" rx="14" fill="url(#p-bg)"/>
  <rect width="960" height="380" rx="14" fill="url(#p-dots)"/>
  <rect width="960" height="380" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="34" fill="#f8fafc" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="0.06em">THE SEVEN RESEARCH PILLARS ECOSYSTEM</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Interconnected Domains Driving Deep-Tech Breakthroughs from Theory to Silicon</text>

  <!-- Connective Constellation Lines with Flowing Data Animation -->
  <line x1="145" y1="125" x2="370" y2="125" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="370" y1="125" x2="595" y2="125" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="595" y1="125" x2="820" y2="125" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="145" y1="170" x2="205" y2="230" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="370" y1="170" x2="480" y2="230" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="820" y1="170" x2="755" y2="230" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Top Row: Pillars 1, 2, 3, 4 (Width 205 each, spaced at x=35, 265, 495, 725) -->
  <!-- Pillar 1: Aero -->
  <g transform="translate(35, 70)">
    <rect width="205" height="96" rx="10" fill="url(#p-box)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#0284c7" opacity="0.3"/>
    <text x="26" y="31" fill="#38bdf8" font-size="13" text-anchor="middle">🚀</text>
    <text x="46" y="22" fill="#38bdf8" font-size="10" font-weight="700">PILLAR I</text>
    <text x="46" y="38" fill="#f8fafc" font-size="12" font-weight="700">Aero-Propulsion</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="10">• TITAN-NET PINNs &amp; Wear Gating</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• WKB Cold Tunneling &amp; Plasma RF</text>
  </g>

  <!-- Pillar 2: Defense -->
  <g transform="translate(265, 70)">
    <rect width="205" height="96" rx="10" fill="url(#p-box)" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#e11d48" opacity="0.3"/>
    <text x="26" y="31" fill="#f43f5e" font-size="13" text-anchor="middle">🛡️</text>
    <text x="46" y="22" fill="#f43f5e" font-size="10" font-weight="700">PILLAR II</text>
    <text x="46" y="38" fill="#f8fafc" font-size="12" font-weight="700">Defense Intelligence</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="10">• Project VISHWAROOP Active Inf.</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Spatio-Temporal GNNs &amp; C-UAS</text>
  </g>

  <!-- Pillar 3: Quantum -->
  <g transform="translate(495, 70)">
    <rect width="205" height="96" rx="10" fill="url(#p-box)" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#4f46e5" opacity="0.3"/>
    <text x="26" y="31" fill="#818cf8" font-size="13" text-anchor="middle">⚛️</text>
    <text x="46" y="22" fill="#818cf8" font-size="10" font-weight="700">PILLAR III</text>
    <text x="46" y="38" fill="#f8fafc" font-size="12" font-weight="700">Quantum Networks</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="10">• Avian Cryptochrome Navigation</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Satellite Topological QKD</text>
  </g>

  <!-- Pillar 4: Biomedical -->
  <g transform="translate(725, 70)">
    <rect width="200" height="96" rx="10" fill="url(#p-box)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#059669" opacity="0.3"/>
    <text x="26" y="31" fill="#34d399" font-size="13" text-anchor="middle">🩺</text>
    <text x="46" y="22" fill="#34d399" font-size="10" font-weight="700">PILLAR IV</text>
    <text x="46" y="38" fill="#f8fafc" font-size="12" font-weight="700">Biomedical &amp; NVST</text>
    <text x="12" y="62" fill="#cbd5e1" font-size="10">• NVST Carotid Ultrasound AI</text>
    <text x="12" y="78" fill="#64748b" font-size="9">• Microfluidic Plasma Separator</text>
  </g>

  <!-- Bottom Row: Pillars 5, 6, 7 (Width 270 each, spaced at x=60, 350, 640) -->
  <!-- Pillar 5: Genomics -->
  <g transform="translate(60, 210)">
    <rect width="260" height="96" rx="10" fill="url(#p-box)" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#d97706" opacity="0.3"/>
    <text x="26" y="31" fill="#f59e0b" font-size="13" text-anchor="middle">🧬</text>
    <text x="48" y="22" fill="#f59e0b" font-size="10" font-weight="700">PILLAR V</text>
    <text x="48" y="38" fill="#f8fafc" font-size="12" font-weight="700">Genomics &amp; Computational Bio</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="10">• CITEDiscord-Net Optimal Transport</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• De Novo Proteomics Pointer Networks</text>
  </g>

  <!-- Pillar 6: Multimodal AI -->
  <g transform="translate(350, 210)">
    <rect width="260" height="96" rx="10" fill="url(#p-box)" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#9333ea" opacity="0.3"/>
    <text x="26" y="31" fill="#c084fc" font-size="13" text-anchor="middle">🔮</text>
    <text x="48" y="22" fill="#c084fc" font-size="10" font-weight="700">PILLAR VI</text>
    <text x="48" y="38" fill="#f8fafc" font-size="12" font-weight="700">Foundation Models &amp; Cognition</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="10">• Kaggle CUHK-X Video Reasoning</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• Multi-Layer Hallucination Intercept</text>
  </g>

  <!-- Pillar 7: Agritech & Societal -->
  <g transform="translate(640, 210)">
    <rect width="260" height="96" rx="10" fill="url(#p-box)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="13" fill="#047857" opacity="0.3"/>
    <text x="26" y="31" fill="#10b981" font-size="13" text-anchor="middle">🌾</text>
    <text x="48" y="22" fill="#10b981" font-size="10" font-weight="700">PILLAR VII</text>
    <text x="48" y="38" fill="#f8fafc" font-size="12" font-weight="700">Societal Resilience &amp; Hardware</text>
    <text x="14" y="62" fill="#cbd5e1" font-size="10">• Smart Cane Edge AI &amp; Haptic Ring</text>
    <text x="14" y="78" fill="#64748b" font-size="9">• RhizoRoot 3D Topological Phenotyping</text>
  </g>
</svg>