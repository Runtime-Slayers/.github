<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" role="img" aria-labelledby="cdx-title cdx-desc">
  <title id="cdx-title">The Da Vinci Laboratory: Master Deep-Tech Engineering Codex</title>
  <desc id="cdx-desc">Master engineering schematic uniting classical geometry, golden spirals, fluid dynamics, and physical AI runtimes.</desc>
  <defs>
    <linearGradient id="cdx-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#091122"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <pattern id="cdx-grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#102038" stroke-width="0.5"/>
    </pattern>
    <pattern id="cdx-grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" stroke="#183256" stroke-width="1"/>
      <circle cx="25" cy="25" r="0.8" fill="#00e5ff" opacity="0.4"/>
    </pattern>
    <filter id="cdx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Canvas Background with Blueprint Grid -->
  <rect width="960" height="400" fill="url(#cdx-bg)"/>
  <rect width="960" height="400" fill="url(#cdx-grid-minor)"/>
  <rect width="960" height="400" fill="url(#cdx-grid-major)"/>
  <rect width="960" height="400" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Technical Border with Alignment Registration Marks -->
  <rect x="14" y="14" width="932" height="372" rx="8" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.4"/>
  <path d="M 10 14 H 24 M 14 10 V 24" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M 936 14 H 950 M 946 10 V 24" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M 10 386 H 24 M 14 376 V 390" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M 936 386 H 950 M 946 376 V 390" stroke="#00e5ff" stroke-width="1.5"/>

  <!-- Header Block -->
  <text x="36" y="42" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.2em">EX ARCHIVUM LEONARDO • RUNTIME SLAYERS DEEP-TECH CODEX</text>
  <text x="36" y="66" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" letter-spacing="0.05em">THE DA VINCI LABORATORY: MASTER SYSTEM SCHEMATICS</text>
  <text x="36" y="84" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">FIRST-PRINCIPLES PHYSICAL INVARIANTS • MATHEMATICAL SYNTHESIS • SILICON TRANSLATION</text>

  <!-- LEFT ZONE: Leonardo's Golden Ratio Spiral & Fluid Vortices -->
  <g transform="translate(36, 105)">
    <rect width="280" height="265" rx="8" fill="#091426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG I: GOLDEN RATIO &amp; DEAN VORTEX</text>
    
    <!-- Archimedean Spiral Path -->
    <path d="M 140 140 
             A 10 10 0 0 1 150 150 
             A 20 20 0 0 1 130 170 
             A 40 40 0 0 1 90 130 
             A 70 70 0 0 1 160 60 
             A 110 110 0 0 1 250 170" 
          fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 3">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="140" cy="140" r="3.5" fill="#f59e0b" filter="url(#cdx-glow)"/>
    
    <!-- Caliper Dimension Annotation -->
    <line x1="90" y1="225" x2="210" y2="225" stroke="#00e5ff" stroke-width="1"/>
    <line x1="90" y1="220" x2="90" y2="230" stroke="#00e5ff" stroke-width="1"/>
    <line x1="210" y1="220" x2="210" y2="230" stroke="#00e5ff" stroke-width="1"/>
    <text x="150" y="242" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">phi = 1.618033 • SECONDARY DEAN VORTEX</text>
  </g>

  <!-- CENTER ZONE: Vitruvian Geometric Harmony & Quantum Orbital -->
  <g transform="translate(336, 105)">
    <rect width="300" height="265" rx="8" fill="#091426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="24" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG II: QUANTUM-VITRUVIAN HARMONY</text>

    <!-- Vitruvian Circle and Square -->
    <rect x="70" y="45" width="160" height="160" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
    <circle cx="150" cy="125" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="150" cy="125" r="54" fill="none" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="4 2">
      <animateTransform attributeName="transform" type="rotate" from="0 150 125" to="360 150 125" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="125" r="28" fill="none" stroke="#10b981" stroke-width="1.5"/>

    <!-- Central Invariant Point -->
    <circle cx="150" cy="125" r="4.5" fill="#ffffff" filter="url(#cdx-glow)"/>
    <text x="150" y="232" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ENERGY &amp; MOMENTUM CONSERVATION</text>
    <text x="150" y="246" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">HAMILTONIAN GATED LOSS SURFACE</text>
  </g>

  <!-- RIGHT ZONE: Official Engineering Blueprint Specification Block -->
  <g transform="translate(656, 105)">
    <rect width="268" height="265" rx="8" fill="#091426" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SPECIFICATION TITLE BLOCK</text>

    <line x1="12" y1="36" x2="256" y2="36" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="12" y1="80" x2="256" y2="80" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="12" y1="124" x2="256" y2="124" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="12" y1="168" x2="256" y2="168" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="12" y1="212" x2="256" y2="212" stroke="#1e3a5f" stroke-width="1"/>

    <text x="16" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="16" y="70" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">RUNTIME-SLAYERS LABS</text>

    <text x="16" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DOCUMENT IDENTIFIER:</text>
    <text x="16" y="114" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">RS-CODEX-DV-2026-ALPHA</text>

    <text x="16" y="142" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">SYSTEM PILLARS:</text>
    <text x="16" y="158" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">7 PHYSICAL DOMAINS</text>

    <text x="16" y="186" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">GROUND TRUTH METRIC:</text>
    <text x="16" y="202" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">100% ZERO-SYNTHETIC DATA</text>

    <text x="16" y="230" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">LEAD RESEARCH ARCHITECT:</text>
    <text x="16" y="246" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">B. RAJENDRA REDDY</text>
  </g>
</svg>