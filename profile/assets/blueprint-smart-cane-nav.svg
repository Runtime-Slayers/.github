<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="sc-title sc-desc">
  <title id="sc-title">Smart Cane Edge AI Navigation &amp; Ultrasonic ToF Mapping Blueprint</title>
  <desc id="sc-desc">Architectural CAD blueprint of ergonomic assistive cane, multi-sensor ToF array, and 360-degree overhead obstacle avoidance.</desc>
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111a"/>
      <stop offset="50%" stop-color="#0c1d2e"/>
      <stop offset="100%" stop-color="#04090f"/>
    </linearGradient>
    <pattern id="sc-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#14324f" stroke-width="0.5"/>
    </pattern>
    <filter id="sc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#sc-bg)"/>
  <rect width="960" height="420" fill="url(#sc-grid)"/>
  <rect width="960" height="420" fill="none" stroke="#164e63" stroke-width="2"/>

  <!-- CAD Border Registration -->
  <path d="M 10 15 H 25 M 15 10 V 25" stroke="#06b6d4" stroke-width="1.5"/>
  <path d="M 935 15 H 950 M 945 10 V 25" stroke="#06b6d4" stroke-width="1.5"/>
  <path d="M 10 405 H 25 M 15 395 V 410" stroke="#06b6d4" stroke-width="1.5"/>
  <path d="M 935 405 H 950 M 945 395 V 410" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • ASSISTIVE EDGE ROBOTICS BLUEPRINT</text>
  <text x="35" y="58" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">SMART CANE: EDGE AI ULTRASONIC &amp; TIME-OF-FLIGHT SPATIAL MAPPING</text>
  <text x="35" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">HEAD-HEIGHT HAZARD DETECTION • 15ms REACTION LATENCY • TINYML ESP32-S3 EMBEDDED</text>

  <!-- LEFT PANEL: Cane Chassis & Multi-Sensor Radiation Cones -->
  <g transform="translate(35, 95)">
    <rect width="450" height="295" rx="8" fill="#0a1d2e" stroke="#164e63" stroke-width="1.5"/>
    <text x="16" y="22" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 3.0: CHASSIS TOPOLOGY &amp; DUAL-CONE SENSOR FIELD</text>

    <!-- Ergonomic Cane Handle & Shaft -->
    <!-- Handle -->
    <path d="M 70 70 C 50 70, 40 90, 50 110 L 80 110 C 90 90, 80 70, 70 70 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Shaft running downwards diagonally -->
    <line x1="65" y1="110" x2="220" y2="260" stroke="#0284c7" stroke-width="8"/>
    <line x1="65" y1="110" x2="220" y2="260" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Roller Tip at Ground -->
    <circle cx="222" cy="262" r="9" fill="#f59e0b" filter="url(#sc-glow)"/>
    <text x="236" y="265" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8">GROUND ROLLER</text>

    <!-- Upper Head-Level Hazard Sensor Node -->
    <rect x="85" y="115" width="22" height="22" rx="4" fill="#ff3366" filter="url(#sc-glow)"/>
    <!-- Upper Cone (Head-height hazard avoidance e.g. tree branches, trucks) -->
    <path d="M 107 126 L 410 40 L 410 130 Z" fill="#ff3366" opacity="0.15" stroke="#ff3366" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="250" y="70" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">HEAD-HEIGHT CONE (ToF LiDAR)</text>

    <!-- Lower Knee-Level Obstacle Sensor Node -->
    <rect x="135" y="165" width="22" height="22" rx="4" fill="#10b981" filter="url(#sc-glow)"/>
    <!-- Lower Cone (Knee-height obstacles, stairs, curbs) -->
    <path d="M 157 176 L 410 170 L 410 260 Z" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="250" y="210" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">GROUND/STAIR CONE (Ultrasonic)</text>

    <text x="16" y="280" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Dual-cone eliminates standard white cane blindspot for elevated overhead obstacles</text>
  </g>

  <!-- RIGHT PANEL TOP: TinyML Real-Time Sensor Processing -->
  <g transform="translate(505, 95)">
    <rect width="420" height="150" rx="8" fill="#0a1d2e" stroke="#164e63" stroke-width="1.5"/>
    <text x="16" y="20" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 3.1: 15ms HARD REAL-TIME EDGE INFERENCE</text>

    <circle cx="65" cy="70" r="24" fill="#082f49" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="65" y="68" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">ToF + US</text>
    <text x="65" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">50 Hz</text>

    <path d="M 90 70 H 130" stroke="#00e5ff" stroke-width="1.5"/>

    <rect x="130" y="45" width="120" height="50" rx="5" fill="#082f49" stroke="#ff3366" stroke-width="1.5"/>
    <text x="190" y="65" fill="#ff3366" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">ESP32-S3 TinyML</text>
    <text x="190" y="78" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Spatial Vector Net</text>

    <path d="M 250 70 H 290" stroke="#00e5ff" stroke-width="1.5"/>

    <circle cx="340" cy="70" r="24" fill="#082f49" stroke="#10b981" stroke-width="1.5"/>
    <text x="340" y="68" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">HAPTIC GRIP</text>
    <text x="340" y="80" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Vibro-Pulse</text>

    <text x="16" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Zero cloud connectivity required: Complete autonomous spatial guidance on 2x AA batteries</text>
  </g>

  <!-- RIGHT PANEL BOTTOM: CAD Title Block -->
  <g transform="translate(505, 260)">
    <rect width="420" height="130" rx="8" fill="#0a1d2e" stroke="#164e63" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="420" y2="30" stroke="#164e63" stroke-width="1"/>
    <line x1="0" y1="65" x2="420" y2="65" stroke="#164e63" stroke-width="1"/>
    <line x1="0" y1="100" x2="420" y2="100" stroke="#164e63" stroke-width="1"/>
    <line x1="210" y1="0" x2="210" y2="100" stroke="#164e63" stroke-width="1"/>

    <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="80" y="20" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="222" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING ID:</text>
    <text x="285" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-EDGE-CANE-005-REV-A</text>

    <text x="12" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPO:</text>
    <text x="12" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">Smart-Cane Edge AI Navigation</text>

    <text x="222" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">EMBEDDED LEAD:</text>
    <text x="310" y="52" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">LIKITH PALAKURTHI</text>

    <text x="12" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">REACTION TIME:</text>
    <text x="95" y="86" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">15 MILLISECONDS</text>

    <text x="222" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">BILL OF MATERIALS:</text>
    <text x="330" y="86" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">UNDER 25 USD</text>

    <text x="12" y="118" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">AFFORDABLE HIGH-ACCURACY OBSTACLE AVOIDANCE RESTORING INDEPENDENT MOBILITY</text>
  </g>
</svg>