<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a0505"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  
    <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/>
    </pattern>
    <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-minor)"/>
      <path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/>
    </pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#FF6B00" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#FF6B00" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#FF6B00" font-size="11" font-weight="bold">PROJ-13 // MULTI-MODAL AI FUSION COUNTER-UAS SYSTEM</text>
  <text x="700" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#94a3b8" font-size="9">DRW-DEF-0013 | REV.A | DOMAIN: COUNTER-UAS</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#FF6B00" stroke-width="0.8" opacity="0.6"/>
<!-- LEFT: Sensor fusion diagram -->
<text x="220" y="66" class="m" fill="#FF6B00" font-size="9" text-anchor="middle">MULTI-SENSOR FUSION ARCHITECTURE</text>
<!-- Drone (target) -->
<text x="220" y="115" class="m" fill="#FF3366" font-size="28" text-anchor="middle" filter="url(#glow)">&#9992;</text>
<text x="220" y="135" class="m" fill="#FF3366" font-size="8" text-anchor="middle">HOSTILE UAS</text>
<!-- Three sensor nodes -->
<!-- Thermal -->
<rect x="40" y="160" width="90" height="55" rx="5" fill="#1a0800" stroke="#FF6B00" stroke-width="1.5"/>
<text x="85" y="182" class="m" fill="#FF6B00" font-size="8" text-anchor="middle" font-weight="bold">THERMAL IR</text>
<text x="85" y="195" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">FLIR — 640x512</text>
<text x="85" y="207" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">8-14 um LWIR</text>
<!-- Acoustic -->
<rect x="165" y="160" width="90" height="55" rx="5" fill="#001a1a" stroke="#00E5FF" stroke-width="1.5"/>
<text x="210" y="182" class="m" fill="#00E5FF" font-size="8" text-anchor="middle" font-weight="bold">ACOUSTIC</text>
<text x="210" y="195" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">8-mic array</text>
<text x="210" y="207" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">TDOA bearing</text>
<!-- RF -->
<rect x="290" y="160" width="90" height="55" rx="5" fill="#001500" stroke="#10B981" stroke-width="1.5"/>
<text x="335" y="182" class="m" fill="#10B981" font-size="8" text-anchor="middle" font-weight="bold">RF SIGNAL</text>
<text x="335" y="195" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">2.4/5.8 GHz</text>
<text x="335" y="207" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Protocol fingerprint</text>
<!-- Lines to fusion -->
<line x1="85" y1="215" x2="185" y2="260" stroke="#FF6B00" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="210" y1="215" x2="215" y2="260" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="335" y1="215" x2="245" y2="260" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- Fusion core -->
<rect x="140" y="258" width="140" height="55" rx="5" fill="#1a0a00" stroke="#FF6B00" stroke-width="2" filter="url(#glow)"/>
<text x="210" y="279" class="m" fill="#FF6B00" font-size="9" text-anchor="middle" font-weight="bold">KALMAN FUSION</text>
<text x="210" y="293" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Track association</text>
<text x="210" y="305" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Extended Kalman filter</text>
<!-- Output -->
<rect x="140" y="330" width="140" height="45" rx="5" fill="#150000" stroke="#FF3366" stroke-width="1.5"/>
<text x="210" y="350" class="m" fill="#FF3366" font-size="8.5" text-anchor="middle" font-weight="bold">TRACK + CLASSIFY</text>
<text x="210" y="365" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">GPS coordinate + drone type</text>
<line x1="210" y1="313" x2="210" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
<!-- Lines from sensor to target -->
<line x1="85" y1="160" x2="185" y2="125" stroke="#FF6B00" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="210" y1="160" x2="215" y2="125" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="335" y1="160" x2="245" y2="125" stroke="#10B981" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
<!-- Divider -->
<line x1="455" y1="48" x2="455" y2="412" stroke="#FF6B00" stroke-width="0.8" opacity="0.4"/>
<!-- RIGHT: Classification + metrics -->
<text x="700" y="68" class="s" fill="#FF6B00" font-size="11" font-weight="bold" text-anchor="middle">AI CLASSIFICATION ENGINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#FF6B00" stroke-width="0.5" opacity="0.4"/>
<!-- Detection scores bar chart -->
<text x="490" y="96" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">UAS CLASSIFICATION CONFIDENCE</text>
<text x="490" y="115" class="m" fill="#94a3b8" font-size="8">DJI Phantom 4</text><rect x="620" y="105" width="195" height="14" fill="#FF6B00" rx="2"/><text x="820" y="116" class="m" fill="#F8fafc" font-size="8">97.2%</text>
<text x="490" y="136" class="m" fill="#94a3b8" font-size="8">Fixed-wing UAV</text><rect x="620" y="126" width="155" height="14" fill="#FF6B00" rx="2" opacity="0.8"/><text x="780" y="137" class="m" fill="#f8fafc" font-size="8">80.1%</text>
<text x="490" y="157" class="m" fill="#94a3b8" font-size="8">Multirotor military</text><rect x="620" y="147" width="175" height="14" fill="#F59E0B" rx="2" opacity="0.85"/><text x="800" y="158" class="m" fill="#f8fafc" font-size="8">91.3%</text>
<text x="490" y="178" class="m" fill="#94a3b8" font-size="8">Bird (false +)</text><rect x="620" y="168" width="30" height="14" fill="#10B981" rx="2" opacity="0.7"/><text x="655" y="179" class="m" fill="#94a3b8" font-size="8">15.4% — correctly rejected</text>
<!-- Confusion matrix -->
<text x="490" y="205" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">CONFUSION MATRIX SUMMARY</text>
<rect x="490" y="213" width="420" height="100" fill="#080d18" rx="4" stroke="#FF6B00" stroke-width="1"/>
<g class="m" font-size="8">
  <text x="560" y="230" fill="#94a3b8">Predicted UAS</text><text x="730" y="230" fill="#94a3b8">Predicted NON-UAS</text>
  <text x="500" y="250" fill="#10B981">Actual UAS</text><rect x="560" y="237" width="155" height="22" fill="#10B981" opacity="0.3" rx="2"/><text x="637" y="252" fill="#10B981" text-anchor="middle">TP: 1842</text>
  <rect x="730" y="237" width="155" height="22" fill="#FF3366" opacity="0.2" rx="2"/><text x="807" y="252" fill="#FF3366" text-anchor="middle">FN: 87</text>
  <text x="500" y="278" fill="#FF3366">Actual NON</text><rect x="560" y="261" width="155" height="22" fill="#FF3366" opacity="0.2" rx="2"/><text x="637" y="276" fill="#FF3366" text-anchor="middle">FP: 34</text>
  <rect x="730" y="261" width="155" height="22" fill="#10B981" opacity="0.3" rx="2"/><text x="807" y="276" fill="#10B981" text-anchor="middle">TN: 2156</text>
  <text x="490" y="305" fill="#00E5FF">Precision: 98.2%   |   Recall: 95.5%   |   F1: 96.8%</text>
</g>
<!-- Bottom block -->
<rect x="475" y="328" width="460" height="75" fill="#080d18" rx="4" stroke="#FF6B00" stroke-width="1"/>
<text x="490" y="345" class="m" fill="#FF6B00" font-size="8.5" font-weight="bold">COUNTER-UAS SYSTEM SPECS</text>
<text x="490" y="362" class="m" fill="#94a3b8" font-size="8">Sensors: Thermal IR + 8-mic acoustic array + RF SDR + optional visual</text>
<text x="490" y="377" class="m" fill="#94a3b8" font-size="8">Tracking: Extended Kalman filter — multi-sensor track association</text>
<text x="490" y="392" class="m" fill="#F59E0B" font-size="8">AI: YOLOv8 visual + ResNet acoustic + XGBoost RF | Fusion: Dempster-Shafer</text>
</svg>