<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" role="img" aria-labelledby="c-title c-desc">
  <title id="c-title">Runtime-Slayers Core Research Council</title>
  <desc id="c-desc">The Core Research Council: Bhavanam Rajendra Reddy, Boddu Saran, Muthuraman Ramanathan, and Likith Palakurthi converging into the unified deep-tech runtime bus.</desc>
  <defs>
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="c-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="c-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="c-grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/></pattern>
    <marker id="arr-hub" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#818cf8"/></marker>
  </defs>

  <rect width="960" height="360" rx="14" fill="url(#c-bg)"/>
  <rect width="960" height="360" rx="14" fill="url(#c-grid)"/>
  <rect width="960" height="360" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="480" y="34" fill="#f8fafc" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="0.06em">THE CORE RESEARCH COUNCIL • COGNITIVE SYNTHESIS</text>
  <text x="480" y="52" fill="#94a3b8" font-size="11" text-anchor="middle">Uniting Theoretical Physics, Materials Transduction, Multimodal Reasoning &amp; Edge Silicon</text>

  <!-- Convergence Paths Directly Touching Central Hub Boundary (x=410 and x=550 at y=195) -->
  <path d="M 250 105 H 340 A 12 12 0 0 1 352 117 V 183 A 12 12 0 0 0 364 195 H 410" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-hub)" opacity="0.9"/>
  <path d="M 250 285 H 340 A 12 12 0 0 0 352 273 V 207 A 12 12 0 0 1 364 195 H 410" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arr-hub)" opacity="0.9"/>
  <path d="M 710 105 H 620 A 12 12 0 0 0 608 117 V 183 A 12 12 0 0 1 596 195 H 550" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arr-hub)" opacity="0.9"/>
  <path d="M 710 285 H 620 A 12 12 0 0 1 608 273 V 207 A 12 12 0 0 0 596 195 H 550" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-hub)" opacity="0.9"/>

  <!-- Member 1: Rajendra -->
  <rect x="40" y="65" width="210" height="80" rx="10" fill="url(#c-card)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="52" y="87" fill="#38bdf8" font-size="10" font-weight="700">LEAD DEEP-TECH ARCHITECT</text>
  <text x="52" y="105" fill="#f8fafc" font-size="13" font-weight="700">Bhavanam Rajendra Reddy</text>
  <text x="52" y="121" fill="#94a3b8" font-size="10">Theoretical Physics &amp; Aerospace</text>
  <text x="52" y="137" fill="#64748b" font-size="9">PINN Gating • WKB Tunneling • PINNs</text>

  <!-- Member 2: Saran -->
  <rect x="40" y="245" width="210" height="80" rx="10" fill="url(#c-card)" stroke="#34d399" stroke-width="1.5"/>
  <text x="52" y="267" fill="#34d399" font-size="10" font-weight="700">TRANSDUCER ARCHITECT</text>
  <text x="52" y="285" fill="#f8fafc" font-size="13" font-weight="700">Boddu Saran</text>
  <text x="52" y="301" fill="#94a3b8" font-size="10">Bioengineering &amp; Materials</text>
  <text x="52" y="317" fill="#64748b" font-size="9">PEDOT:PSS OECTs • Hydrogels • EEG</text>

  <!-- Central Hub (Center 480, 195, Radius 70) -->
  <circle cx="480" cy="195" r="70" fill="#0f172a" stroke="url(#c-hub)" stroke-width="3"/>
  <circle cx="480" cy="195" r="58" fill="#131e3b" stroke="#38bdf8" stroke-dasharray="3 3"/>
  <text x="480" y="183" fill="#f8fafc" font-size="14" font-weight="800" text-anchor="middle">RUNTIME</text>
  <text x="480" y="201" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle">SLAYERS</text>
  <text x="480" y="219" fill="#a7f3d0" font-size="9" font-weight="600" text-anchor="middle">108 Packages</text>
  <text x="480" y="233" fill="#94a3b8" font-size="8" text-anchor="middle">Autonomous Runtimes</text>

  <!-- Member 3: Muthuraman -->
  <rect x="710" y="65" width="210" height="80" rx="10" fill="url(#c-card)" stroke="#c084fc" stroke-width="1.5"/>
  <text x="722" y="87" fill="#c084fc" font-size="10" font-weight="700">NEURAL-SYMBOLIC LEAD</text>
  <text x="722" y="105" fill="#f8fafc" font-size="13" font-weight="700">Muthuraman Ramanathan</text>
  <text x="722" y="121" fill="#94a3b8" font-size="10">Multimodal AI &amp; VLMs</text>
  <text x="722" y="137" fill="#64748b" font-size="9">Graph Transformers • Kaggle CUHK-X</text>

  <!-- Member 4: Likith -->
  <rect x="710" y="245" width="210" height="80" rx="10" fill="url(#c-card)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="722" y="267" fill="#f59e0b" font-size="10" font-weight="700">EDGE SILICON &amp; ROBOTICS</text>
  <text x="722" y="285" fill="#f8fafc" font-size="13" font-weight="700">Likith Palakurthi</text>
  <text x="722" y="301" fill="#94a3b8" font-size="10">Assistive Robotics &amp; Firmware</text>
  <text x="722" y="317" fill="#64748b" font-size="9">FreeRTOS C++20 • ESP32-S3 • Tactile</text>
</svg>