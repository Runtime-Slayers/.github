<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#100800"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#F59E0B" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#F59E0B" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#F59E0B" font-size="11" font-weight="bold">PROJ-19 // QUANTUM-ENCRYPTED STUDENT DATA PRIVACY — BB84 QKD</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-QUANTUM-0019 | REV.A | QUANTUM PRIVACY</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#F59E0B" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#F59E0B" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">BB84 QKD ENCRYPTED STUDENT DATA SYSTEM</text>
<!-- System diagram -->
<rect x="35" y="80" width="100" height="60" rx="5" fill="#1a0a00" stroke="#F59E0B" stroke-width="1.5"/>
<text x="85" y="104" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle">STUDENT</text>
<text x="85" y="118" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle">ALICE</text>
<text x="85" y="131" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Key generator</text>
<!-- Quantum channel -->
<rect x="155" y="95" width="130" height="35" rx="4" fill="#001020" stroke="#00E5FF" stroke-width="1.2"/>
<text x="220" y="110" class="m" fill="#00E5FF" font-size="8" text-anchor="middle">QUANTUM CHANNEL</text>
<text x="220" y="123" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Photon polarization</text>
<line x1="135" y1="110" x2="155" y2="110" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#glow)"/>
<line x1="285" y1="110" x2="305" y2="110" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#glow)"/>
<rect x="305" y="80" width="100" height="60" rx="5" fill="#001a00" stroke="#10B981" stroke-width="1.5"/>
<text x="355" y="104" class="m" fill="#10B981" font-size="8.5" text-anchor="middle">UNIVERSITY</text>
<text x="355" y="118" class="m" fill="#10B981" font-size="8.5" text-anchor="middle">BOB</text>
<text x="355" y="131" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Key receiver</text>
<!-- Classical channel -->
<line x1="135" y1="140" x2="305" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="220" y="155" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Classical channel (public — reconciliation)</text>
