<rect x="35" y="170" width="185" height="45" rx="4" fill="#100a00" stroke="#F59E0B" stroke-width="1"/>
<text x="127" y="188" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">BB84 KEY GENERATION</text>
<text x="127" y="202" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Random bits + basis selection</text>
<text x="127" y="213" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">1024-bit secure key established</text>
<!-- Encrypted database -->
<rect x="80" y="230" width="280" height="55" rx="5" fill="#001520" stroke="#c084fc" stroke-width="1.5"/>
<text x="220" y="252" class="m" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">QKD-ENCRYPTED STUDENT DATABASE</text>
<text x="220" y="265" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Grades, personal info, medical records — AES-256 + QKD key</text>
<text x="220" y="277" class="m" fill="#F59E0B" font-size="7.5" text-anchor="middle">Perfect forward secrecy — new key per session</text>
<!-- Eve (eavesdropper) blocked -->
<text x="220" y="315" class="m" fill="#FF3366" font-size="16" text-anchor="middle" filter="url(#glow)">&#128275;</text>
<text x="260" y="318" class="m" fill="#FF3366" font-size="8">EVE blocked!</text>
<text x="260" y="330" class="m" fill="#94a3b8" font-size="7.5">Heisenberg uncertainty</text>
<text x="260" y="342" class="m" fill="#94a3b8" font-size="7.5">No-cloning theorem</text>
<text x="220" y="395" class="m" fill="#F59E0B" font-size="8" text-anchor="middle">GDPR + FERPA compliant quantum-secure student privacy</text>
<!-- RIGHT: Privacy flow + metrics -->
<text x="700" y="68" class="s" fill="#F59E0B" font-size="11" font-weight="bold" text-anchor="middle">QUANTUM PRIVACY ARCHITECTURE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#F59E0B" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="35" rx="3" fill="#1a0800" stroke="#F59E0B" stroke-width="1.5"/>
<text x="700" y="103" class="m" fill="#F59E0B" font-size="9" text-anchor="middle" font-weight="bold">Phase 1: BB84 Protocol — Quantum Key Distribution</text>
<text x="700" y="113" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">1024 photons exchanged — basis reconciliation — sifted key</text>
<rect x="490" y="127" width="420" height="35" rx="3" fill="#001020" stroke="#00E5FF" stroke-width="1.2"/>
<text x="700" y="145" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">Phase 2: Error correction — Cascade protocol</text>
<text x="700" y="155" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">QBER estimation — parity check reconciliation over classical channel</text>
<rect x="490" y="169" width="420" height="35" rx="3" fill="#001000" stroke="#10B981" stroke-width="1.2"/>
<text x="700" y="187" class="m" fill="#10B981" font-size="9" text-anchor="middle">Phase 3: Privacy amplification — hash compression</text>
<text x="700" y="197" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Universal hash function reduces key to information-theoretic secure length</text>
<rect x="490" y="211" width="420" height="35" rx="3" fill="#100020" stroke="#c084fc" stroke-width="1.2"/>
<text x="700" y="229" class="m" fill="#c084fc" font-size="9" text-anchor="middle">Phase 4: AES-256 encryption with QKD key</text>
<text x="700" y="239" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Student records encrypted — one-time pad semantics with frequent rekeying</text>
<!-- Compliance + metrics -->
<rect x="475" y="260" width="460" height="145" fill="#080d18" rx="4" stroke="#F59E0B" stroke-width="1"/>
<text x="490" y="278" class="m" fill="#F59E0B" font-size="8.5" font-weight="bold">SECURITY ANALYSIS</text>
<line x1="475" y1="285" x2="935" y2="285" stroke="#F59E0B" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="490" y="302" fill="#94a3b8">QKD protocol:</text><text x="640" y="302" fill="#00E5FF">BB84 (Bennett-Brassard 1984)</text>
  <text x="490" y="319" fill="#94a3b8">Key length:</text><text x="640" y="319" fill="#10B981">1024 bits (post-sifting)</text>
  <text x="490" y="336" fill="#94a3b8">QBER threshold:</text><text x="640" y="336" fill="#F59E0B">11% (Eve detection)</text>
  <text x="490" y="353" fill="#94a3b8">Encryption:</text><text x="640" y="353" fill="#c084fc">AES-256-GCM + QKD key</text>
  <text x="490" y="370" fill="#94a3b8">Security model:</text><text x="640" y="370" fill="#10B981">Information-theoretic (not computational)</text>
  <text x="490" y="387" fill="#94a3b8">Compliance:</text><text x="640" y="387" fill="#94a3b8">GDPR, FERPA, PDPA</text>
</g>
</svg>