<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0a1200"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  
    <pattern id="grid-minor" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/>
    </pattern>
    <pattern id="grid-major" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="url(#grid-minor)"/>
      <path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/>
    </pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#grid-major)" opacity="0.5"/>
  <rect x="2" y="2" width="956" height="416" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <rect x="6" y="6" width="948" height="408" fill="none" stroke="#10B981" stroke-width="0.5" stroke-dasharray="8,4"/>
  <g stroke="#10B981" stroke-width="1" opacity="0.8">
    <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
    <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
    <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
    <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
  </g>
  <rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
  <text x="30" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#10B981" font-size="11" font-weight="bold">PROJ-10 // DEFENSENET — ST-GNN LATERAL MOVEMENT DETECTION</text>
  <text x="700" y="32" font-family="JetBrains Mono, Courier New, monospace" fill="#94a3b8" font-size="9">DRW-DEF-0010 | REV.A | DOMAIN: CYBER DEFENSE</text>
  <line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<!-- LEFT: Enterprise Network Graph -->
<text x="220" y="66" class="m" fill="#10B981" font-size="9" text-anchor="middle">ENTERPRISE NETWORK GRAPH TOPOLOGY</text>
<!-- Network nodes -->
<!-- Domain Controller (target) -->
<rect x="180" y="185" width="80" height="50" rx="5" fill="#200000" stroke="#FF3366" stroke-width="2" filter="url(#glow)"/>
<text x="220" y="207" class="m" fill="#FF3366" font-size="8" text-anchor="middle">DOMAIN</text>
<text x="220" y="219" class="m" fill="#FF3366" font-size="8" text-anchor="middle">CONTROL</text>
<text x="220" y="231" class="m" fill="#FF3366" font-size="7" text-anchor="middle">TARGET</text>
<!-- Workstations -->
<g fill="#001500" stroke="#10B981" stroke-width="1.2">
  <rect x="50" y="80" width="55" height="35" rx="3"/>
  <rect x="120" y="80" width="55" height="35" rx="3"/>
  <rect x="50" y="145" width="55" height="35" rx="3"/>
  <rect x="310" y="80" width="55" height="35" rx="3"/>
  <rect x="50" y="290" width="55" height="35" rx="3"/>
  <rect x="310" y="145" width="55" height="35" rx="3"/>
  <rect x="310" y="290" width="55" height="35" rx="3"/>
  <rect x="160" y="320" width="55" height="35" rx="3"/>
</g>
<g class="m" fill="#10B981" font-size="7" text-anchor="middle">
  <text x="77" y="101">WS-01</text><text x="147" y="101">WS-02</text>
  <text x="77" y="166">WS-03</text><text x="337" y="101">SRV-01</text>
  <text x="77" y="311">WS-04</text><text x="337" y="166">SRV-02</text>
  <text x="337" y="311">DB-01</text><text x="187" y="341">FTP</text>
</g>
<!-- Normal connections (faint) -->
<g stroke="#10B981" stroke-width="0.7" opacity="0.3">
  <line x1="105" y1="97" x2="180" y2="200"/>
  <line x1="175" y1="97" x2="200" y2="185"/>
  <line x1="105" y1="162" x2="180" y2="200"/>
  <line x1="365" y1="97" x2="260" y2="195"/>
  <line x1="365" y1="162" x2="260" y2="195"/>
  <line x1="105" y1="307" x2="185" y2="235"/>
  <line x1="365" y1="307" x2="260" y2="200"/>
  <line x1="215" y1="320" x2="220" y2="235"/>
</g>
<!-- Lateral movement path (attack) highlighted -->
<g stroke="#FF3366" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#glow)">
  <line x1="77" y1="115" x2="147" y2="115"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/></line>
  <line x1="175" y1="105" x2="180" y2="185"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/></line>
  <line x1="220" y1="235" x2="220" y2="320"><animate attributeName="stroke-dashoffset" values="0;-18" dur="1s" repeatCount="indefinite"/></line>
</g>
<!-- Entry point -->
<circle cx="77" cy="80" r="8" fill="#FF6B00" filter="url(#glow)"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
<text x="90" y="72" class="m" fill="#FF6B00" font-size="7">ENTRY</text>
<text x="220" y="400" class="m" fill="#10B981" font-size="8" text-anchor="middle">ST-GNN detects anomalous lateral movement path in real-time</text>
<!-- Divider -->
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>
<!-- RIGHT: ST-GNN Architecture -->
<text x="700" y="68" class="s" fill="#10B981" font-size="11" font-weight="bold" text-anchor="middle">SPATIO-TEMPORAL GNN PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>
<!-- Step 1 -->
<rect x="490" y="85" width="420" height="42" rx="5" fill="#001500" stroke="#10B981" stroke-width="1.5"/>
<text x="700" y="106" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">INPUT: Network Flow Logs</text>
<text x="700" y="120" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">src_ip, dst_ip, port, protocol, bytes, timestamp — graph edges</text>
<!-- Step 2 -->
<rect x="490" y="142" width="420" height="42" rx="5" fill="#0a1500" stroke="#F59E0B" stroke-width="1.5"/>
<text x="700" y="163" class="m" fill="#F59E0B" font-size="9" text-anchor="middle" font-weight="bold">GRAPH CONSTRUCTION</text>
<text x="700" y="177" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Hosts = nodes, sessions = edges, temporal snapshots per 60s</text>
<!-- Step 3: ST-GNN -->
<rect x="490" y="199" width="420" height="55" rx="5" fill="#001a00" stroke="#10B981" stroke-width="2" filter="url(#glow)"/>
<text x="700" y="220" class="m" fill="#10B981" font-size="10" text-anchor="middle" font-weight="bold">SPATIO-TEMPORAL GNN</text>
<text x="700" y="235" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">GraphSAGE (spatial) + LSTM / Transformer (temporal)</text>
<text x="700" y="248" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Message passing aggregates neighborhood features across time</text>
<!-- Step 4: Anomaly score -->
<rect x="490" y="269" width="420" height="42" rx="5" fill="#1a0000" stroke="#FF3366" stroke-width="1.5"/>
<text x="700" y="290" class="m" fill="#FF3366" font-size="9" text-anchor="middle" font-weight="bold">ANOMALY SCORE + ALERT</text>
<text x="700" y="304" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Reconstruction error threshold — lateral movement flagged with path</text>
<!-- Arrows -->
<line x1="700" y1="127" x2="700" y2="142" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="700" y1="184" x2="700" y2="199" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="700" y1="254" x2="700" y2="269" stroke="#94a3b8" stroke-width="1.5"/>
<!-- Bottom metrics -->
<rect x="475" y="325" width="460" height="78" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
<text x="490" y="342" class="m" fill="#10B981" font-size="8.5" font-weight="bold">DEFENSENET METRICS</text>
<text x="490" y="358" class="m" fill="#94a3b8" font-size="8">Dataset: LANL lateral movement dataset (500k+ auth events)</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">Detection AUC: 0.973   |   False positive rate: 0.4%   |   Latency: 45 ms/snapshot</text>
<text x="490" y="388" class="m" fill="#F59E0B" font-size="8">ST-GNN: GraphSAGE + LSTM hybrid   |   Interpretable path attribution via SHAP</text>
</svg>