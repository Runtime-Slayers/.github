<text x="700" y="242" class="m" fill="#94a3b8" font-size="7" text-anchor="middle">Glucose alert | insulin pump sync | wound care auto-dosing</text>
<rect x="475" y="265" width="460" height="130" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
<text x="490" y="282" class="m" fill="#10B981" font-size="8.5" font-weight="bold">MATERIALS + INNOVATION</text>
