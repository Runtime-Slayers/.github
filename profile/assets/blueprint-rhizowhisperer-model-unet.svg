<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>
    .m { font-family: "JetBrains Mono", monospace; }
    .s { font-family: "Montserrat", sans-serif; }
  </style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00150a"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.45"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#10B981" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#10B981" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#10B981" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#10B981" font-size="10.5" font-weight="bold">PROJ-46 // RHIZOWHISPERER — DIRECTIONAL GRAPH CONVOLUTION UNET</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-AI-0046 | REV.A | CV ARCHITECTURES</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>

<!-- LEFT: Directional Graph Convolution + Attention UNet -->
<text x="220" y="66" class="m" fill="#10B981" font-size="9" text-anchor="middle">CURVILINEAR GRAPH CONVOLUTIONAL UNET ARCHITECTURE</text>
<rect x="35" y="78" width="400" height="230" rx="5" fill="#00120a" stroke="#10B981" stroke-width="1.2"/>

<!-- UNet Encoder / Decoder V-Shape -->
<g class="m" font-size="7">
  <!-- Input -->
  <rect x="50" y="95" width="35" height="40" fill="#002015" stroke="#38bdf8" stroke-width="1"/>
  <text x="67" y="118" fill="#38bdf8" text-anchor="middle">Input</text>
  
  <!-- Enc 1 -->
  <rect x="95" y="125" width="30" height="35" fill="#002518" stroke="#10B981" stroke-width="1"/>
  <text x="110" y="145" fill="#10B981" text-anchor="middle">E1</text>
  
  <!-- Enc 2 -->
  <rect x="135" y="155" width="30" height="35" fill="#002518" stroke="#10B981" stroke-width="1"/>
  <text x="150" y="175" fill="#10B981" text-anchor="middle">E2</text>

  <!-- Bottleneck with Graph Attention Core -->
  <rect x="180" y="195" width="80" height="45" fill="#0a2a1a" stroke="#F59E0B" stroke-width="1.5" filter="url(#glow)"/>
  <text x="220" y="215" fill="#F59E0B" text-anchor="middle" font-weight="bold">Directional GCN</text>
  <text x="220" y="228" fill="#94a3b8" text-anchor="middle" font-size="6">Vector Field Preserving</text>

  <!-- Dec 2 -->
  <rect x="275" y="155" width="30" height="35" fill="#002518" stroke="#00E5FF" stroke-width="1"/>
  <text x="290" y="175" fill="#00E5FF" text-anchor="middle">D2</text>

  <!-- Dec 1 -->
  <rect x="315" y="125" width="30" height="35" fill="#002518" stroke="#00E5FF" stroke-width="1"/>
  <text x="330" y="145" fill="#00E5FF" text-anchor="middle">D1</text>

  <!-- Output Mask -->
  <rect x="355" y="95" width="40" height="40" fill="#002015" stroke="#10B981" stroke-width="1.5"/>
  <text x="375" y="118" fill="#10B981" text-anchor="middle" font-weight="bold">Skeleton</text>
</g>

<!-- Skip Connections with Attention Gates -->
<path d="M125 140 L285 140" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2"/>
<circle cx="205" cy="140" r="4" fill="#F59E0B"/>
<text x="205" y="133" class="m" fill="#F59E0B" font-size="6" text-anchor="middle">Attention Gate</text>

<path d="M85 115 L355 115" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2"/>

<!-- Root Segmentation Detail (Curvilinear vector field) -->
<g transform="translate(60, 250)">
  <rect x="0" y="0" width="330" height="45" rx="3" fill="#001a10" stroke="#10B981" stroke-width="0.8"/>
  <text x="165" y="16" class="m" fill="#10B981" font-size="7.5" text-anchor="middle" font-weight="bold">SUB-MILLIMETER ROOT TOPOLOGY RECONSTRUCTION</text>
  <text x="165" y="32" class="m" fill="#94a3b8" font-size="6.5" text-anchor="middle">Prevents disconnection of &lt;0.3mm root hairs via continuous directional field loss</text>
</g>

<!-- Status bar below -->
<rect x="50" y="320" width="370" height="75" rx="4" fill="#001020" stroke="#10B981" stroke-width="1"/>
<text x="235" y="336" class="m" fill="#10B981" font-size="8.5" text-anchor="middle" font-weight="bold">BENCHMARK PERFORMANCE: SOIL CORE SEGMENTATION</text>
<text x="235" y="352" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Dice Score: 0.924 | Topology Continuity Error: -82% vs Standard UNet</text>
<text x="235" y="367" class="m" fill="#00E5FF" font-size="7.5" text-anchor="middle">Inference Speed: 42 ms per 2048x2048 slice | Edge-device capable</text>
<text x="235" y="382" class="m" fill="#F59E0B" font-size="7.5" text-anchor="middle">Integrated with automated skeleton extraction &amp; length quantification</text>

<!-- RIGHT PANEL: Dice Comparison & Specs -->
<text x="700" y="68" class="s" fill="#10B981" font-size="11" font-weight="bold" text-anchor="middle">SEGMENTATION ACCURACY BY ROOT CALIBER</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>

<g class="m" font-size="7.5">
  <text x="490" y="98" fill="#94a3b8">Standard UNet (Fine roots &lt;0.5mm)</text>
  <rect x="660" y="88" width="115" height="13" fill="#FF3366" rx="2" opacity="0.7"/>
  <text x="782" y="98" fill="#FF3366">0.612 Dice</text>

  <text x="490" y="118" fill="#94a3b8">Attention UNet (Fine roots)</text>
  <rect x="660" y="108" width="165" height="13" fill="#F59E0B" rx="2" opacity="0.8"/>
  <text x="832" y="118" fill="#F59E0B">0.785 Dice</text>

  <text x="490" y="138" fill="#10B981" font-weight="bold">RhizoWhisperer GCN-UNet</text>
  <rect x="660" y="128" width="220" height="13" fill="#10B981" rx="2" filter="url(#glow)"/>
  <text x="888" y="138" fill="#10B981" font-weight="bold">0.924 BEST</text>
</g>

<!-- Specs Block -->
<rect x="475" y="165" width="460" height="235" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
<text x="490" y="184" class="m" fill="#10B981" font-size="8.5" font-weight="bold">NEURAL ARCHITECTURE SPECIFICATIONS</text>
<line x1="475" y1="192" x2="935" y2="192" stroke="#10B981" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="490" y="210" fill="#94a3b8">Base Backbone:</text><text x="640" y="210" fill="#10B981">Multi-Scale Attention UNet with ResNet50 encoder</text>
  <text x="490" y="228" fill="#94a3b8">Graph Module:</text><text x="640" y="228" fill="#F59E0B">Directional Edge-Conditioned Graph Convolution</text>
  <text x="490" y="246" fill="#94a3b8">Loss Function:</text><text x="640" y="246" fill="#00E5FF">Dice Loss + Soft Skeleton Continuity Loss</text>
  <text x="490" y="264" fill="#94a3b8">Parameter Count:</text><text x="640" y="264" fill="#94a3b8">28.4 Million Trainable Parameters</text>
  <text x="490" y="282" fill="#94a3b8">Fine Root Recovery:</text><text x="640" y="282" fill="#10B981">Maintains topology down to 0.22 mm diameter</text>
  <text x="490" y="300" fill="#94a3b8">Noise Robustness:</text><text x="640" y="300" fill="#38bdf8">Tolerates heterogeneous organic matter &amp; pebbles</text>
  <text x="490" y="318" fill="#94a3b8">Inference Throughput:</text><text x="640" y="318" fill="#10B981">24 FPS on NVIDIA RTX 4090 / 6 FPS on Jetson</text>
  <text x="490" y="336" fill="#94a3b8">Dataset Benchmark:</text><text x="640" y="336" fill="#94a3b8">RhizoRoot2025: 12,000 annotated field slices</text>
  <text x="490" y="354" fill="#94a3b8">CAD Reference:</text><text x="640" y="354" fill="#94a3b8">RS-AI-RHIZOARCH-046-REV-A</text>
  <text x="490" y="372" fill="#00E5FF">Application: High-throughput plant breeding phenotyping platforms</text>
</g>

</svg>