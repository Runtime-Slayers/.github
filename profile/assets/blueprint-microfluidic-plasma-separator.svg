<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" role="img" aria-label="Microfluidic Plasma Separator Technical Blueprint">
  <defs>
    <!-- Blueprint Grid Background -->
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="100%" stop-color="#081022"/>
    </linearGradient>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1e3a5f" stroke-width="0.8" opacity="0.4"/>
    </pattern>
    <pattern id="grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#132338" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <marker id="bp-arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="bp-arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#f43f5e"/>
    </marker>
    <marker id="bp-arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#34d399"/>
    </marker>
    <filter id="bp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="520" fill="url(#bp-bg)"/>
  <rect width="960" height="520" fill="url(#grid-minor)"/>
  <rect width="960" height="520" fill="url(#grid-major)"/>
  <rect width="960" height="520" fill="none" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Technical Drawing Border & Corner Crosshairs -->
  <rect x="15" y="15" width="930" height="490" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.6"/>
  <path d="M 10 15 H 20 M 15 10 V 20" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 940 15 H 950 M 945 10 V 20" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 10 505 H 20 M 15 500 V 510" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 940 505 H 950 M 945 500 V 510" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Title & Specification Banner -->
  <text x="35" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • DEEP-TECH HARDWARE SCHEMATIC</text>
  <text x="35" y="66" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="18" font-weight="800">CASCADED SPIRAL MICROFLUIDIC PLASMA SEPARATOR</text>
  <text x="35" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DEAN VORTEX INERTIAL FOCUSING • 99.8% PLASMA PURITY • ZERO CENTRIFUGE</text>

  <!-- LEFT PANEL: Spiral Microchannel Geometry (Schematic View) -->
  <g transform="translate(40, 105)">
    <!-- Outer Chip Frame -->
    <rect width="400" height="340" rx="8" fill="#091326" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 1.0: 4-STAGE SPIRAL ARCHIMEDEAN CHANNEL</text>

    <!-- Spiral Center Reference -->
    <circle cx="200" cy="180" r="4" fill="#38bdf8" opacity="0.5"/>
    <line x1="190" y1="180" x2="210" y2="180" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
    <line x1="200" y1="170" x2="200" y2="190" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>

    <!-- Concentric Spiral Channel Guide Paths -->
    <path d="M 200 180 A 30 30 0 0 1 230 180 A 60 60 0 0 1 170 180 A 90 90 0 0 1 260 180 A 120 120 0 0 1 140 180 A 150 150 0 0 1 290 180" 
          fill="none" stroke="#1e40af" stroke-width="18" opacity="0.35" stroke-linecap="round"/>
    <path d="M 200 180 A 30 30 0 0 1 230 180 A 60 60 0 0 1 170 180 A 90 90 0 0 1 260 180 A 120 120 0 0 1 140 180 A 150 150 0 0 1 290 180" 
          fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- Blood Stream Inlet Port -->
    <circle cx="200" cy="180" r="9" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="160" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">WHOLE BLOOD INLET</text>
    <line x1="200" y1="165" x2="200" y2="171" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#bp-arr)"/>

    <!-- Concentrated RBC Outlet Port (Outer Radius) -->
    <circle cx="290" cy="180" r="8" fill="#881337" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="355" y="176" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RBC WASTE</text>
    <text x="355" y="188" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Hematocrit 72%</text>

    <!-- Pure Plasma Skimmer Port (Inner Radius) -->
    <circle cx="270" cy="180" r="7" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="355" y="212" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PURE PLASMA</text>
    <text x="355" y="224" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">99.8% Cell-Free</text>

    <!-- Channel Dimensions Annotation -->
    <path d="M 50 290 H 130" stroke="#94a3b8" stroke-width="0.8"/>
    <line x1="50" y1="286" x2="50" y2="294" stroke="#94a3b8" stroke-width="0.8"/>
    <line x1="130" y1="286" x2="130" y2="294" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="90" y="306" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">WIDTH = 200 um</text>

    <text x="16" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Reynolds Number Re = 48.2 • Dean Number De = 12.4 • PDMS Soft Lithography</text>
  </g>

  <!-- RIGHT PANEL TOP: Dean Vortices Cross-Section Physics -->
  <g transform="translate(460, 105)">
    <rect width="460" height="170" rx="8" fill="#091326" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="16" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 1.1: CROSS-SECTIONAL SECONDARY DEAN VORTICES</text>

    <!-- Channel Cross-Section Box (Width 240, Height 90) -->
    <rect x="25" y="42" width="220" height="90" rx="4" fill="#050b18" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="30" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">INNER WALL</text>
    <text x="200" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">OUTER WALL</text>

    <!-- Counter-Rotating Dean Vortices Ellipses -->
    <!-- Top Vortex (Clockwise) -->
    <ellipse cx="135" cy="65" rx="70" ry="18" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <polygon points="175,61 185,65 175,69" fill="#818cf8"/>

    <!-- Bottom Vortex (Counter-Clockwise) -->
    <ellipse cx="135" cy="108" rx="70" ry="18" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 3">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <polygon points="175,104 185,108 175,112" fill="#818cf8"/>

    <!-- Inertial Focused RBC Band at Outer Wall -->
    <ellipse cx="220" cy="87" rx="12" ry="32" fill="#f43f5e" opacity="0.35"/>
    <circle cx="218" cy="75" r="4" fill="#f43f5e"/>
    <circle cx="223" cy="87" r="4.5" fill="#f43f5e"/>
    <circle cx="219" cy="99" r="4" fill="#f43f5e"/>
    <text x="220" y="148" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">RBC FOCUS BAND</text>

    <!-- Clear Plasma Zone at Inner Wall -->
    <rect x="35" y="52" width="55" height="70" fill="#34d399" opacity="0.15"/>
    <text x="62" y="90" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CELL-FREE</text>
    <text x="62" y="100" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">PLASMA</text>

    <!-- Side Physics Annotations -->
    <g transform="translate(265, 45)">
      <text x="0" y="14" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">• Inertial Lift Force (F_L)</text>
      <text x="10" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Pushes particles toward walls</text>

      <text x="0" y="48" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">• Dean Drag Force (F_D)</text>
      <text x="10" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">Circulates smaller plasma cells</text>

      <text x="0" y="82" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">• Bifurcation Cutoff</text>
      <text x="10" y="96" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8">99.8% cell rejection ratio</text>
    </g>
  </g>

  <!-- RIGHT PANEL BOTTOM: Official Engineering Title Block (CAD Style) -->
  <g transform="translate(460, 290)">
    <rect width="460" height="155" rx="8" fill="#091326" stroke="#1e3a5f" stroke-width="1.5"/>
    
    <!-- Title Block Grid -->
    <line x1="0" y1="35" x2="460" y2="35" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="0" y1="75" x2="460" y2="75" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="0" y1="115" x2="460" y2="115" stroke="#1e3a5f" stroke-width="1"/>
    <line x1="230" y1="0" x2="230" y2="115" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Metadata Cells -->
    <text x="14" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="85" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="244" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING NUMBER:</text>
    <text x="340" y="22" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-BIO-DWG-001-REV-C</text>

    <text x="14" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPO:</text>
    <text x="14" y="68" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">ai-microfluidic-plasma-separator</text>

    <text x="244" y="58" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">SYS ARCHITECT:</text>
    <text x="340" y="58" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">B. RAJENDRA REDDY</text>
    <text x="244" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">BIOENGINEER:</text>
    <text x="340" y="70" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">B. SARAN KUMAR</text>

    <text x="14" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">VALIDATION:</text>
    <text x="95" y="98" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PASSED • 99.8% PURITY</text>

    <text x="244" y="98" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">HARDWARE SILICON:</text>
    <text x="340" y="98" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">PASSIVE SYRINGE (0W)</text>

    <text x="14" y="136" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">APPROVED FOR OPEN-SOURCE EMBEDDED PRODUCTION • DUAL MIT/APACHE 2.0 LICENSE</text>
  </g>
</svg>