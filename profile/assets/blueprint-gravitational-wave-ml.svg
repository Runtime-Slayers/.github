    <path d="M100 357 Q150 350 200 340 Q250 328 300 315 Q320 310 340 310" fill="none" stroke="#F59E0B" stroke-width="3" filter="url(#glow)"/>
    <text x="220" y="390" class="m" fill="#c084fc" font-size="8" text-anchor="middle">CNN detects chirp morphology 15% deeper than matched filter</text>
<!-- RIGHT PANEL -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">SYSTEM ARCHITECTURE &amp; METRICS</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<!-- Description block -->
<rect x="490" y="82" width="440" height="200" rx="5" fill="#080d18" stroke="#c084fc" stroke-width="1"/>
<text x="710" y="100" class="m" fill="#c084fc" font-size="9" text-anchor="middle" font-weight="bold">TECHNICAL OVERVIEW</text>
<line x1="490" y1="108" x2="930" y2="108" stroke="#c084fc" stroke-width="0.5"/>
<text x="500" y="130" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">Machine learning enhanced gravitational wave detection from LIGO data. CNN-based</text>
<text x="500" y="148" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> matched filter replaces classical cross-correlation for binary black hole (BBH)</text>
<text x="500" y="166" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"> and neutron star merger signals. Tested on LIGO O3 strain data. SNR threshold: </text>
<text x="500" y="184" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">8. False alarm rate: 1/month. Detection sensitivity: 15% deeper than classical m</text>
<text x="500" y="202" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">ethod. WaveNet-style 1D CNN encoder captures h(t) waveform morphology. GW150914 </text>
<text x="500" y="220" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">re-detected at FAR &lt; 1/yr confidence. Template bank: IMRPhenomXP. GWTC-3 catalog </text>
<text x="500" y="238" class="m" fill="#94a3b8" font-size="8" xml:space="preserve">validation.</text>
<text x="500" y="256" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<text x="500" y="274" class="m" fill="#94a3b8" font-size="8" xml:space="preserve"></text>
<!-- Metrics table -->
<rect x="490" y="295" width="440" height="110" rx="4" fill="#080d18" stroke="#c084fc" stroke-width="1"/>
<text x="710" y="310" class="m" fill="#c084fc" font-size="8.5" text-anchor="middle" font-weight="bold">KEY METRICS</text>
<line x1="490" y1="316" x2="930" y2="316" stroke="#c084fc" stroke-width="0.5"/>
<text x="490" y="305" class="m" fill="#94a3b8" font-size="8">Detector</text><text x="660" y="305" class="m" fill="#c084fc" font-size="8">LIGO O3 strain — Hanford + Livingston</text>
<text x="490" y="322" class="m" fill="#94a3b8" font-size="8">Source type</text><text x="660" y="322" class="m" fill="#94a3b8" font-size="8">BBH merger — IMRPhenomXP template</text>
<text x="490" y="339" class="m" fill="#94a3b8" font-size="8">SNR threshold</text><text x="660" y="339" class="m" fill="#c084fc" font-size="8">8 — CNN-matched filter hybrid</text>
<text x="490" y="356" class="m" fill="#94a3b8" font-size="8">Sensitivity gain</text><text x="660" y="356" class="m" fill="#10B981" font-size="8">+15% vs classical matched filter</text>
<text x="490" y="373" class="m" fill="#94a3b8" font-size="8">FAR</text><text x="660" y="373" class="m" fill="#F59E0B" font-size="8">&lt; 1/month (GW150914 re-detect)</text>
<text x="490" y="390" class="m" fill="#94a3b8" font-size="8">Dataset</text><text x="660" y="390" class="m" fill="#94a3b8" font-size="8">GWTC-3 catalog — O3 events</text>

</svg>