<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d0015"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="10" font-weight="bold">PROJ-43 // GRAVITATIONAL WAVE DETECTION — ML MATCHED FILTER</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-ML-0043 | REV.A | ASTROPHYSICS AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>
<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">LIGO GRAVITATIONAL WAVE — ML DETECTION PIPELINE</text>
    <rect x="35" y="80" width="400" height="295" rx="5" fill="#050010" stroke="#c084fc" stroke-width="1.5"/>
    <text x="220" y="100" class="m" fill="#c084fc" font-size="8" text-anchor="middle">LIGO STRAIN DATA h(t) — HANFORD DETECTOR</text>
    <!-- Strain signal -->
    <line x1="50" y1="250" x2="420" y2="250" stroke="#94a3b8" stroke-width="1"/>
    <line x1="50" y1="140" x2="50" y2="350" stroke="#94a3b8" stroke-width="1"/>
    <!-- Noise baseline -->
    <polyline points="50,250 80,248 110,252 140,249 170,251 200,248 230,250 260,248 290,252 320,249" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- GW signal chirp (merger) -->
    <path d="M290,250 Q310,248 320,242 Q330,232 340,220 Q345,210 350,200 Q352,194 354,188 Q355,183 356,190 Q357,202 358,218 Q360,232 362,242 Q365,248 370,250 Q380,250 420,250" fill="none" stroke="#c084fc" stroke-width="2.5" filter="url(#glow)"/>
    <text x="335" y="175" class="m" fill="#c084fc" font-size="7.5" text-anchor="middle">BBH MERGER</text>
    <text x="335" y="187" class="m" fill="#c084fc" font-size="7.5" text-anchor="middle">chirp signal</text>
    <!-- SNR bar -->
    <rect x="55" y="280" width="350" height="20" fill="#0a0020" rx="3"/>
    <rect x="55" y="280" width="280" height="20" fill="#c084fc" rx="3" filter="url(#glow)" opacity="0.8"/>
    <text x="220" y="295" class="m" fill="#0B0F19" font-size="8" text-anchor="middle" font-weight="bold">SNR = 24.3 (GW150914 equivalent)</text>
    <!-- Spectrogram sketch -->
    <rect x="55" y="310" width="350" height="55" fill="#050010" stroke="#c084fc" stroke-width="0.8" rx="3"/>
    <text x="230" y="325" class="m" fill="#c084fc" font-size="7.5" text-anchor="middle">TIME-FREQUENCY SPECTROGRAM (Q-transform)</text>
