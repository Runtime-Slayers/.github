<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
<defs>
  <style>.m{font-family:"JetBrains Mono",monospace}.s{font-family:"Montserrat",sans-serif}</style>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#0d0015"/><stop offset="100%" stop-color="#0B0F19"/></radialGradient>
  <pattern id="gmin" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#1e3a5f" stroke-width="0.3"/></pattern>
    <pattern id="gmaj" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gmin)"/><path d="M50 0H0V50" fill="none" stroke="#1e3a5f" stroke-width="0.7"/></pattern>
</defs>
<rect width="960" height="420" fill="url(#bg)"/>
<rect width="960" height="420" fill="url(#gmaj)" opacity="0.5"/>
<rect x="2" y="2" width="956" height="416" fill="none" stroke="#c084fc" stroke-width="1.5"/>
<rect x="6" y="6" width="948" height="408" fill="none" stroke="#c084fc" stroke-width="0.5" stroke-dasharray="8,4"/>
<g stroke="#c084fc" stroke-width="1" opacity="0.8">
  <line x1="2" y1="20" x2="2" y2="2"/><line x1="2" y1="2" x2="20" y2="2"/>
  <line x1="940" y1="2" x2="958" y2="2"/><line x1="958" y1="2" x2="958" y2="20"/>
  <line x1="2" y1="400" x2="2" y2="418"/><line x1="2" y1="418" x2="20" y2="418"/>
  <line x1="940" y1="418" x2="958" y2="418"/><line x1="958" y1="418" x2="958" y2="400"/>
</g>
<rect x="20" y="14" width="920" height="28" fill="#0B0F19" rx="2"/>
<text x="30" y="32" class="m" fill="#c084fc" font-size="11" font-weight="bold">PROJ-38 // STRUCTURE-AWARE DRUG REPURPOSING — MOLECULAR GNN</text>
<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-GEN-0038 | REV.A | DRUG DISCOVERY AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#c084fc" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#c084fc" stroke-width="0.8" opacity="0.4"/>

<text x="220" y="66" class="m" fill="#c084fc" font-size="9" text-anchor="middle">STRUCTURE-AWARE DRUG REPURPOSING — MOLECULAR GNN</text>
<!-- Molecular graph (left) -->
<text x="220" y="88" class="m" fill="#F59E0B" font-size="8.5" text-anchor="middle" font-weight="bold">DRUG-TARGET INTERACTION — MOLECULAR GRAPH</text>
<rect x="35" y="96" width="400" height="270" rx="5" fill="#001020" stroke="#c084fc" stroke-width="1.5"/>
<!-- Drug molecule graph (atoms as nodes, bonds as edges) -->
<!-- Benzene ring -->
<g fill="none" stroke="#c084fc" stroke-width="1.5">
  <line x1="120" y1="160" x2="150" y2="145"/><line x1="150" y1="145" x2="180" y2="160"/>
  <line x1="180" y1="160" x2="180" y2="190"/><line x1="180" y1="190" x2="150" y2="205"/>
  <line x1="150" y1="205" x2="120" y2="190"/><line x1="120" y1="190" x2="120" y2="160"/>
</g>
<!-- Atom nodes -->
<g fill="#c084fc" filter="url(#glow)">
  <circle cx="120" cy="160" r="7"/><circle cx="150" cy="145" r="7"/>
  <circle cx="180" cy="160" r="7"/><circle cx="180" cy="190" r="7"/>
  <circle cx="150" cy="205" r="7"/><circle cx="120" cy="190" r="7"/>
</g>
<g class="m" fill="#0B0F19" font-size="6.5" text-anchor="middle">
  <text x="120" y="163">C</text><text x="150" y="148">C</text>
  <text x="180" y="163">C</text><text x="180" y="193">C</text>
  <text x="150" y="208">C</text><text x="120" y="193">C</text>
</g>
<!-- Side chains -->
<line x1="180" y1="160" x2="215" y2="145" stroke="#c084fc" stroke-width="1.5"/>
<circle cx="215" cy="145" r="7" fill="#F59E0B" filter="url(#glow)"/><text x="215" y="148" class="m" fill="#0B0F19" font-size="6.5" text-anchor="middle">N</text>
<line x1="215" y1="145" x2="245" y2="130" stroke="#F59E0B" stroke-width="1.5"/>
<circle cx="245" cy="130" r="7" fill="#00E5FF"/><text x="245" y="133" class="m" fill="#0B0F19" font-size="6.5" text-anchor="middle">O</text>
<line x1="120" y1="160" x2="90" y2="145" stroke="#c084fc" stroke-width="1.5"/>
<circle cx="90" cy="145" r="7" fill="#10B981"/><text x="90" y="148" class="m" fill="#0B0F19" font-size="6.5" text-anchor="middle">S</text>
<!-- GNN message passing arrows -->
<g stroke="#00E5FF" stroke-width="1" stroke-dasharray="3,2" opacity="0.5">
  <line x1="130" y1="165" x2="145" y2="148"/>
  <line x1="175" y1="165" x2="148" y2="150"/>
</g>
<!-- Protein target (right side of left panel) -->
<ellipse cx="330" cy="200" rx="75" ry="90" fill="#001020" stroke="#10B981" stroke-width="1.5"/>
<text x="330" y="175" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">PROTEIN</text>
<text x="330" y="187" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">TARGET</text>
<!-- Binding pocket -->
<ellipse cx="320" cy="210" rx="30" ry="22" fill="#002000" stroke="#F59E0B" stroke-width="1.5"/>
<text x="320" y="214" class="m" fill="#F59E0B" font-size="7" text-anchor="middle">BINDING</text>
<text x="320" y="224" class="m" fill="#F59E0B" font-size="7" text-anchor="middle">POCKET</text>
<!-- Drug fitting into pocket -->
<circle cx="320" cy="213" r="10" fill="#c084fc" opacity="0.5" filter="url(#glow)"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/></circle>
<!-- Docking arrow -->
<line x1="195" y1="175" x2="285" y2="200" stroke="#FF3366" stroke-width="2" stroke-dasharray="5,3" filter="url(#glow)"/>
<text x="240" y="185" class="m" fill="#FF3366" font-size="7.5">docking</text>
<text x="220" y="380" class="m" fill="#c084fc" font-size="8" text-anchor="middle">GNN encodes molecular graph — predicts binding affinity Ki (nM)</text>
<!-- RIGHT: Pipeline -->
<text x="700" y="68" class="s" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle">DRUG REPURPOSING GNN PIPELINE</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#c084fc" stroke-width="0.5" opacity="0.4"/>
<rect x="490" y="85" width="420" height="35" rx="3" fill="#100020" stroke="#c084fc" stroke-width="1.5"/>
<text x="700" y="103" class="m" fill="#c084fc" font-size="9" text-anchor="middle">INPUT: Drug SMILES + Protein PDB structure</text>
<text x="700" y="113" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">ChEMBL + PDB + BindingDB — 500k drug-target pairs</text>
<rect x="490" y="127" width="420" height="35" rx="3" fill="#0d0020" stroke="#F59E0B" stroke-width="1.2"/>
<text x="700" y="145" class="m" fill="#F59E0B" font-size="9" text-anchor="middle">GRAPH ENCODING: GCN + MPNN on molecular graph</text>
<text x="700" y="155" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Atom features: type, charge, hybridization, aromatic</text>
<rect x="490" y="169" width="420" height="35" rx="3" fill="#001020" stroke="#00E5FF" stroke-width="1.2"/>
<text x="700" y="187" class="m" fill="#00E5FF" font-size="9" text-anchor="middle">PROTEIN: ESMFold structure + pocket fingerprint</text>
<text x="700" y="197" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">pLDDT-weighted contact map — binding site residue embedding</text>
<rect x="490" y="211" width="420" height="35" rx="3" fill="#001020" stroke="#10B981" stroke-width="1.5" filter="url(#glow)"/>
<text x="700" y="229" class="m" fill="#10B981" font-size="9" text-anchor="middle" font-weight="bold">OUTPUT: Binding affinity (Ki) + repurposing ranking</text>
<text x="700" y="239" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Top-k candidates sorted by predicted Ki — clinical opportunity</text>
<rect x="475" y="263" width="460" height="130" fill="#080d18" rx="4" stroke="#c084fc" stroke-width="1"/>
<text x="490" y="280" class="m" fill="#c084fc" font-size="8.5" font-weight="bold">PERFORMANCE METRICS</text>
<g class="m" font-size="8">
  <text x="490" y="297" fill="#94a3b8">Dataset:</text><text x="620" y="297" fill="#c084fc">BindingDB + ChEMBL — 500k DTI pairs</text>
  <text x="490" y="314" fill="#94a3b8">Pearson R:</text><text x="620" y="314" fill="#10B981">0.91 (pKi prediction)</text>
  <text x="490" y="331" fill="#94a3b8">Structure encoder:</text><text x="620" y="331" fill="#F59E0B">ESMFold2 + 3D pocket fingerprint</text>
  <text x="490" y="348" fill="#94a3b8">GNN layers:</text><text x="620" y="348" fill="#c084fc">6 MPNN layers — 256 hidden dim</text>
  <text x="490" y="365" fill="#94a3b8">Repurposing:</text><text x="620" y="365" fill="#FF3366">FDA drugs screened vs COVID-19 targets</text>
  <text x="490" y="382" fill="#94a3b8">Top hit:</text><text x="620" y="382" fill="#10B981">Baricitinib — rediscovered at top-5</text>
</g>
</svg>