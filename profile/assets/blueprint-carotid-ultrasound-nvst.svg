<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" role="img" aria-labelledby="nv-title nv-desc">
  <title id="nv-title">NVST Carotid Ultrasound Neuro-Vascular Symbiotic Transformer Blueprint</title>
  <desc id="nv-desc">Architectural CAD blueprint of carotid bifurcation, soft lipid plaque rupture boundary, and 12-channel transformer attention attribution.</desc>
  <defs>
    <linearGradient id="nv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100b18"/>
      <stop offset="50%" stop-color="#181126"/>
      <stop offset="100%" stop-color="#090610"/>
    </linearGradient>
    <pattern id="nv-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2a1b3d" stroke-width="0.5"/>
    </pattern>
    <filter id="nv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="960" height="420" fill="url(#nv-bg)"/>
  <rect width="960" height="420" fill="url(#nv-grid)"/>
  <rect width="960" height="420" fill="none" stroke="#3d215c" stroke-width="2"/>

  <!-- CAD Registration Crosshairs -->
  <path d="M 10 15 H 25 M 15 10 V 25" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 935 15 H 950 M 945 10 V 25" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 10 405 H 25 M 15 395 V 410" stroke="#c084fc" stroke-width="1.5"/>
  <path d="M 935 405 H 950 M 945 395 V 410" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Title -->
  <text x="35" y="38" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.15em">RUNTIME SLAYERS • CLINICAL NEURO-VASCULAR AI BLUEPRINT</text>
  <text x="35" y="58" fill="#f8fafc" font-family="'Montserrat', sans-serif" font-size="16" font-weight="800">NVST-ULTRA &amp; OMNI: MULTIMODAL NEURO-VASCULAR SYMBIOTIC TRANSFORMER</text>
  <text x="35" y="74" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="9">CAROTID BIFURCATION • ASYMPTOMATIC SOFT PLAQUE RUPTURE PREDICTION • 0.978 AUC</text>

  <!-- LEFT PANEL: Carotid Bifurcation & Vulnerable Plaque Anatomy -->
  <g transform="translate(35, 95)">
    <rect width="450" height="295" rx="8" fill="#150d22" stroke="#3d215c" stroke-width="1.5"/>
    <text x="16" y="22" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 2.0: CAROTID ARTERY BIFURCATION &amp; LIPID CORE</text>

    <!-- Common Carotid Artery (CCA) dividing into Internal (ICA) and External (ECA) -->
    <!-- Lower CCA Trunk -->
    <path d="M 50 120 C 130 120, 160 100, 220 70 L 400 40 L 410 75 L 260 105 C 240 125, 240 165, 260 185 L 410 215 L 400 250 L 220 220 C 160 190, 130 170, 50 170 Z" 
          fill="#1c0f2e" stroke="#ff3366" stroke-width="2"/>

    <text x="60" y="150" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">CCA TRUNK</text>
    <text x="330" y="65" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="8">ICA (BRAIN PERFUSION)</text>
    <text x="330" y="240" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ECA (FACIAL SUPPLY)</text>

    <!-- Vulnerable Soft Plaque (Lipid-Rich Necrotic Core with Thin Fibrous Cap) -->
    <path d="M 200 85 C 220 75, 240 80, 255 100 C 245 108, 225 110, 205 100 Z" fill="#f59e0b" stroke="#ff3366" stroke-width="1.5"/>
    <circle cx="230" cy="92" r="3.5" fill="#ff3366" filter="url(#nv-glow)"/>

    <!-- Caliper Annotation to Plaque -->
    <line x1="230" y1="92" x2="280" y2="140" stroke="#f59e0b" stroke-width="1"/>
    <rect x="270" y="140" width="160" height="40" rx="4" fill="#201235" stroke="#f59e0b" stroke-width="1"/>
    <text x="276" y="155" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">VULNERABLE SOFT PLAQUE</text>
    <text x="276" y="168" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7">Stenosis &lt; 50% • High Rupture Risk</text>

    <text x="16" y="280" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">Standard Doppler ignores &lt;50% stenosis; NVST identifies hypoechoic acoustic micro-features</text>
  </g>

  <!-- RIGHT PANEL TOP: 12-Channel Vascular Feature Attribution Network -->
  <g transform="translate(505, 95)">
    <rect width="420" height="150" rx="8" fill="#150d22" stroke="#3d215c" stroke-width="1.5"/>
    <text x="16" y="20" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FIG 2.1: 12-CHANNEL CROSS-ATTENTION SUITE</text>

    <rect x="30" y="40" width="90" height="50" rx="5" fill="#231338" stroke="#c084fc" stroke-width="1"/>
    <text x="75" y="60" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">B-MODE SCAN</text>
    <text x="75" y="75" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">Echogenicity</text>

    <path d="M 120 65 H 145" stroke="#00e5ff" stroke-width="1.5"/>

    <rect x="145" y="40" width="110" height="50" rx="5" fill="#231338" stroke="#00e5ff" stroke-width="1"/>
    <text x="200" y="60" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">CROSS-ATTENTION</text>
    <text x="200" y="75" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">12 Hemodynamic Ch.</text>

    <path d="M 255 65 H 280" stroke="#00e5ff" stroke-width="1.5"/>

    <rect x="280" y="40" width="115" height="50" rx="5" fill="#231338" stroke="#10b981" stroke-width="1"/>
    <text x="337" y="60" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">STROKE RISK</text>
    <text x="337" y="75" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="700" text-anchor="middle">0.978 AUC SOTA</text>

    <text x="16" y="135" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="7.5">Explainable AI: Attributions map exactly to thin fibrous cap wall shear stress zones</text>
  </g>

  <!-- RIGHT PANEL BOTTOM: CAD Title Block -->
  <g transform="translate(505, 260)">
    <rect width="420" height="130" rx="8" fill="#150d22" stroke="#3d215c" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="420" y2="30" stroke="#3d215c" stroke-width="1"/>
    <line x1="0" y1="65" x2="420" y2="65" stroke="#3d215c" stroke-width="1"/>
    <line x1="0" y1="100" x2="420" y2="100" stroke="#3d215c" stroke-width="1"/>
    <line x1="210" y1="0" x2="210" y2="100" stroke="#3d215c" stroke-width="1"/>

    <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ORGANIZATION:</text>
    <text x="80" y="20" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RUNTIME-SLAYERS LABS</text>

    <text x="222" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">DRAWING ID:</text>
    <text x="285" y="20" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RS-CLIN-NVST-003-REV-A</text>

    <text x="12" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">PROJECT REPOS:</text>
    <text x="12" y="60" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600">carotid-ultrasound-deep-fusion &amp; NVST</text>

    <text x="222" y="52" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">RESEARCH LEADS:</text>
    <text x="305" y="52" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">MUTHURAMAN &amp; SARAN</text>

    <text x="12" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">ACCURACY METRIC:</text>
    <text x="105" y="86" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">0.978 AUC (12-CH FUSION)</text>

    <text x="222" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8">VALIDATION COHORT:</text>
    <text x="325" y="86" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">MULTI-CENTER CLINICAL</text>

    <text x="12" y="118" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">EARLY ISCHEMIC STROKE PREVENTION WITHOUT HAZARDOUS CONTRAST INJECTIONS</text>
  </g>
</svg>