<text x="700" y="32" class="m" fill="#94a3b8" font-size="9">DRW-HPC-0050 | REV.A | GREEN COMPUTING AI</text>
<line x1="20" y1="48" x2="940" y2="48" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
<line x1="455" y1="48" x2="455" y2="412" stroke="#10B981" stroke-width="0.8" opacity="0.4"/>

<!-- LEFT: AI Cluster Scheduler & GPU Energy Balancing -->
<text x="220" y="66" class="m" fill="#10B981" font-size="9" text-anchor="middle">DEEP Q-NETWORK HETEROGENEOUS GPU SCHEDULER</text>
<rect x="35" y="78" width="400" height="230" rx="5" fill="#00150a" stroke="#10B981" stroke-width="1.2"/>

<!-- Heterogeneous GPU Cluster Grid -->
<g transform="translate(55, 95)" class="m" font-size="7">
  <!-- Node 1: 8x H100 (High-Priority Training) -->
  <rect x="0" y="0" width="165" height="50" rx="3" fill="#002b15" stroke="#10B981" stroke-width="1.5"/>
