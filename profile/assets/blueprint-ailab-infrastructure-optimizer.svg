  <text x="82" y="76" fill="#F59E0B" font-weight="bold" text-anchor="middle">NODE 03: 16x PCIe L40S</text>
  <text x="82" y="88" fill="#94a3b8" text-anchor="middle">VLM Serving &amp; Eval Pipelines</text>
  <text x="82" y="102" fill="#F59E0B" text-anchor="middle">DVFS Power Throttle: -18% Idle</text>

  <!-- Node 4: InfiniBand NDR Switch Fabric -->
  <rect x="185" y="60" width="165" height="50" rx="3" fill="#080015" stroke="#c084fc" stroke-width="1.2"/>
  <text x="267" y="76" fill="#c084fc" font-weight="bold" text-anchor="middle">FABRIC: 400 Gbps NDR</text>
  <text x="267" y="88" fill="#94a3b8" text-anchor="middle">Adaptive Routing | Congestion Free</text>
  <text x="267" y="102" fill="#c084fc" text-anchor="middle">All-Reduce B/W: 382 GB/s</text>
</g>

<!-- Central DQN Scheduler Controller below -->
<rect x="50" y="320" width="370" height="75" rx="4" fill="#001020" stroke="#10B981" stroke-width="1"/>
<text x="235" y="336" class="m" fill="#10B981" font-size="8.5" text-anchor="middle" font-weight="bold">REINFORCEMENT LEARNING ENERGY BALANCER</text>
<text x="235" y="352" class="m" fill="#94a3b8" font-size="7.5" text-anchor="middle">Dynamically shifts asynchronous evaluation jobs to off-peak electrical tariff hours</text>
<text x="235" y="367" class="m" fill="#10B981" font-size="7.5" text-anchor="middle">Electricity Cost Reduction: 34.2% | Slurm Integration | Zero SLA Breaches</text>
<text x="235" y="382" class="m" fill="#F59E0B" font-size="7.5" text-anchor="middle">Prevents GPU thermal throttling through predictive job affinity packing</text>

<!-- RIGHT PANEL: Energy & Utilization Specs -->
<text x="700" y="68" class="s" fill="#10B981" font-size="11" font-weight="bold" text-anchor="middle">CLUSTER ELECTRICITY SAVINGS vs CONVENTIONAL SLURM</text>
<line x1="480" y1="75" x2="940" y2="75" stroke="#10B981" stroke-width="0.5" opacity="0.4"/>

<g class="m" font-size="7.5">
  <text x="490" y="98" fill="#94a3b8">Default Slurm (FIFO / Backfill)</text>
  <rect x="660" y="88" width="220" height="13" fill="#FF3366" rx="2" opacity="0.7"/>
  <text x="888" y="98" fill="#FF3366">182 MWh / mo</text>

  <text x="490" y="118" fill="#94a3b8">Heuristic Thermal Capping</text>
  <rect x="660" y="108" width="175" height="13" fill="#F59E0B" rx="2" opacity="0.8"/>
  <text x="842" y="118" fill="#F59E0B">148 MWh / mo</text>

  <text x="490" y="138" fill="#10B981" font-weight="bold">DQN Energy Optimizer</text>
  <rect x="660" y="128" width="145" height="13" fill="#10B981" rx="2" filter="url(#glow)"/>
  <text x="812" y="138" fill="#10B981" font-weight="bold">119 MWh (-34.2%)</text>
</g>

<!-- Specs Block -->
<rect x="475" y="165" width="460" height="235" fill="#080d18" rx="4" stroke="#10B981" stroke-width="1"/>
