<line x1="475" y1="192" x2="935" y2="192" stroke="#10B981" stroke-width="0.5"/>
<g class="m" font-size="8">
  <text x="490" y="210" fill="#94a3b8">Scheduling Agent:</text><text x="640" y="210" fill="#10B981">Deep Q-Network (DQN) + Multi-Objective Pareto</text>
