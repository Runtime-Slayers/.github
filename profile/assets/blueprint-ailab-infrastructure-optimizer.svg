  <text x="82" y="28" fill="#00E5FF" text-anchor="middle">LLM Pretraining (Distributed DDP)</text>
  <text x="82" y="42" fill="#10B981" text-anchor="middle">Utilization: 98.4% | Temp: 64 deg C</text>

  <!-- Node 2: 8x A100 (Fine-Tuning / Batch RL) -->
  <rect x="185" y="0" width="165" height="50" rx="3" fill="#002010" stroke="#00E5FF" stroke-width="1.2"/>
  <text x="267" y="16" fill="#00E5FF" font-weight="bold" text-anchor="middle">NODE 02: 8x NVLink A100</text>
  <text x="267" y="28" fill="#94a3b8" text-anchor="middle">LoRA &amp; Alignment SFT Jobs</text>
  <text x="267" y="42" fill="#00E5FF" text-anchor="middle">Utilization: 94.1% | Temp: 68 deg C</text>

  <!-- Node 3: 16x L40S (Inference &amp; Evaluation) -->
